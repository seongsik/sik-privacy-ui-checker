- id: NET-22B-01
  title: 앱 접근권한 고지·동의(필수/선택 구분)
  basis:
  - 법 제22조의2제1항(L225-232), 제5항
  - 영 제9조의2제1항·제2항(L239-247)
  - 과태료 법 제76조제2항제1호·제1호의2
  requirement: 앱이 단말기 저장정보(연락처·일정·사진·통신내용·바이오정보), 자동 저장정보(위치·통신기록·인증정보·신체활동), 단말 고유식별정보(IMEI 등), 입력·출력 기능(카메라·마이크·센서)에 접근하려면 필수 권한은 항목·이유를, 선택 권한은 항목·이유·동의하지 않아도 된다는 사실을 명확히 알리고 동의를 받아야 한다. 개별 선택 가능한 OS에서는 필수/선택을 구분해 알린 뒤 최초 접근 시 동의를 받는다(OS가 개별 선택 불가면 필수 권한만 설정해 설치 시 동의).
  applies_when: 이동통신단말장치용 앱(하이브리드 앱·웹뷰 앱 포함)을 제공하는 정보통신서비스 제공자. 순수 웹사이트는 직접 대상 아님(브라우저 권한 요청은 비고 참고)
  type: 관찰
  type_note: null
  location:
  - 앱 설치·최초 실행 안내 화면
  - 앱 소개 페이지(웹)
  - 처리방침 페이지
  - 모바일 웹에서 권한 요청 시점
  method: (1) 웹사이트에 앱 다운로드·소개 페이지가 있으면 접근권한 안내(필수/선택 구분, 항목, 이유, 선택 거부 가능 문구)를 페이지 텍스트로 확인. (2) 처리방침에서 접근권한 안내 조항 확인. (3) 모바일 웹은 페이지 로드 직후 위치·카메라·마이크·알림 권한 요청이 뜨는지 관찰하고, 읽기 전용 JS로 `navigator.permissions.query({name:'geolocation'})` 등 상태만 조회(권한 허용·거부는 누르지 않음). (4) 앱 자체 화면은 브라우저로 볼 수 없으므로 사용자에게 설치 화면·최초 실행 권한 팝업 스크린샷을 요청.
  pass: 필수·선택 권한이 구분 표시되고, 권한별 항목과 이유가 있으며, 선택 권한에 "동의하지 않아도 서비스 이용 가능" 취지가 있음. 권한 요청이 해당 기능 최초 사용 시점에 이루어짐.
  fail: '권한 안내 없음, 필수/선택 미구분, 이유 누락, 선택 권한을 필수처럼 표시, 기능과 무관한 권한(예: 쇼핑앱의 연락처·통화기록) 요청, 앱 실행 즉시 모든 권한 일괄 요청.'
  remediation: '앱 최초 실행 시 별도 안내 화면을 두고 "[필수] 저장공간: 사진 첨부 / [선택] 위치: 주변 매장 찾기(허용하지 않아도 서비스 이용 가능)"처럼 권한별 항목·이유·선택 여부를 표로 표시한다. Android 6.0 이상·iOS는 런타임 권한으로 구현하고 해당 기능 진입 시점에 요청한다. 처리방침에 "앱 접근권한" 조항을 두고 동일 내용과 철회 방법(OS 설정 > 앱 > 권한)을 적는다. 신규 권한 추가 시 개발·배포 체크리스트에 권한 필요성 검토를 넣는다.'
  evidence: 앱 소개·처리방침의 권한 안내 부분 스크린샷, 사용자 제공 앱 권한 팝업 스크린샷, permissions.query 결과
  notes: 법령 의무(과태료는 제2항 위반=서비스 거부 시, 제3항 조치 미이행 시). 웹 브라우저의 위치·카메라 권한 요청은 엄밀히 이 조 대상은 아니나, 같은 기준(사용 시점 요청, 이유 안내)을 권고로 적용 가능. 판단 시 영 제9조의2제3항에 따라 약관·처리방침에 공개된 서비스 범위와 이용자의 합리적 예상, 기술적 관련성을 고려한다. PIPA-22과 관계(선택 동의 거부 시 서비스 거부 금지 원칙).
  category: 동의·고지
  strength: 의무
  default_risk: 중
- id: NET-22B-02
  title: 선택 접근권한 미동의를 이유로 한 서비스 거부 금지
  basis:
  - 법 제22조의2제2항(L233)
  - 과태료 법 제76조제2항제1호(L2587)
  requirement: 서비스 제공에 반드시 필요하지 않은 접근권한에 동의하지 않았다는 이유로 서비스 제공을 거부해서는 안 된다.
  applies_when: 앱(모바일 웹 포함)을 제공하는 정보통신서비스 제공자
  type: 능동
  type_note: null
  location:
  - 앱 최초 실행·권한 팝업
  - 모바일 웹 권한 요청 화면
  method: 사용자 승인 후, 사용자가 테스트 단말·테스트 계정으로 선택 권한(위치·연락처·알림 등)을 "거부"로 선택하고 Claude는 이후 앱/웹이 종료되거나 진입을 막는지, 핵심 기능(로그인·조회·결제 등)이 계속 동작하는지 관찰·기록한다. 모바일 웹은 브라우저 권한 팝업에서 사용자가 거부한 뒤 동작을 관찰.
  pass: 선택 권한 거부 후에도 해당 권한과 무관한 기능이 정상 동작하며, 권한이 필요한 기능에서만 재요청 안내가 뜸.
  fail: 선택 권한 거부 시 앱 종료·무한 재요청·진입 차단, 또는 "모든 권한을 허용해야 이용 가능" 문구.
  remediation: 권한별 의존 기능을 분리해, 거부 시 해당 기능만 비활성화하고 "위치 권한을 허용하면 주변 매장을 볼 수 있습니다 [설정으로 이동]" 같은 안내를 띄운다. 앱 실행 시 일괄 권한 요청 코드를 제거한다. QA 시나리오에 "선택 권한 전부 거부" 케이스를 넣는다.
  evidence: 거부 선택 후 화면 스크린샷(사용자 화면), 오류·차단 메시지
  notes: 법령 의무. 단말 권한 설정 변경은 서비스 데이터 수정은 아니지만 사용자 단말 조작이므로 사용자가 직접 수행. PIPA-22과 관계.
  category: 동의·고지
  strength: 의무
  default_risk: 중
- id: NET-22B-03
  title: 접근권한 동의 철회 방법 구현
  basis:
  - 법 제22조의2제3항(L234)
  - 영 제9조의2제4항제3호(L249-252)
  - 과태료 법 제76조제2항제1호의2(L2588)
  requirement: 단말기 소프트웨어 제작·공급자는 OS·단말기에 맞는 접근권한 동의 및 철회 방법을 소프트웨어에 구현해야 한다.
  applies_when: 앱을 직접 제작·공급하는 자(외주 개발 시 공급 주체)
  type: 관찰
  type_note: null
  location:
  - 처리방침 접근권한 조항
  - 앱 설정 화면(사용자 제공 스크린샷)
  - 고객센터 FAQ
  method: 처리방침·FAQ에 권한 철회 방법(OS 설정 경로 또는 앱 내 설정 메뉴)이 안내되는지 확인. 앱 내부 설정 메뉴는 사용자 제공 스크린샷으로 확인.
  pass: 철회 방법이 안내되고 실제 OS 설정 또는 앱 내 메뉴로 철회 가능.
  fail: 철회 방법 안내 없음, 구버전 OS(개별 선택 불가)를 대상으로 하면서 대체 철회 수단 없음.
  remediation: '처리방침·FAQ에 "Android: 설정 > 애플리케이션 > [앱명] > 권한, iOS: 설정 > [앱명]"처럼 철회 경로를 적고, 가능하면 앱 내 [설정 > 권한 관리]에서 OS 설정으로 바로 이동하는 버튼을 둔다. targetSdkVersion을 런타임 권한 지원 버전 이상으로 유지한다.'
  evidence: 처리방침 해당 조항 스크린샷, 앱 설정 화면(사용자 제공)
  notes: 법령 의무. OS 제작자·단말 제조자 의무(영 제9조의2제4항제1호·제2호)는 웹서비스 운영자와 무관해 제외.
  category: 동의·고지
  strength: 의무
  default_risk: 중
- id: NET-23B-01
  title: 주민등록번호 수집·이용 금지
  basis:
  - 법 제23조의2제1항·제2항(L260-264)
  - 과태료 법 제76조제2항제2호(L2589)
  requirement: 정보통신서비스 제공자는 본인확인기관으로 지정받은 경우 등 예외를 제외하고 이용자의 주민등록번호를 수집·이용할 수 없다. 예외(이동통신 재판매사업자)로 수집할 수 있는 경우에도 주민등록번호를 쓰지 않는 본인확인 대체수단을 제공해야 한다.
  applies_when: 모든 정보통신서비스 제공자(본인확인기관, 재판매 이통사 예외). 다른 법령 근거가 있으면 PIPA 제24조의2 기준으로 판단
  type: 관찰
  type_note: null
  location:
  - 회원가입
  - 본인확인
  - 아이디·비밀번호 찾기
  - 주문·결제
  - 이벤트 응모
  - 고객문의
  - 마이페이지(회원정보 수정)
  method: (1) 각 화면의 입력 필드 라벨·placeholder·name 속성을 DOM으로 조회해 "주민", "jumin", "rrn", "ssn", "resident" 등이 있는지 확인(값 입력·제출은 하지 않음). (2) 생년월일+성별 뒷자리 1자리 외에 13자리 입력란이 있는지 확인. (3) 마이페이지·주문내역 응답 본문(네트워크 탭)에 13자리 주민등록번호 패턴(\d{6}-?[1-8]\d{6})이 있는지 검색. (4) 외부 본인확인(휴대폰·아이핀·PASS 등) 연동이면 사업자 페이지가 아닌 본인확인기관 도메인에서 입력받는지 확인.
  pass: 사업자 화면·요청·응답 어디에도 주민등록번호 전체 또는 뒷자리 입력·전송·노출이 없고, 본인확인은 본인확인기관 서비스로 위탁.
  fail: 사업자 화면에 주민등록번호 입력란 존재, 네트워크 요청·응답에 주민등록번호 포함, 처리방침 수집항목에 주민등록번호 기재(법령 근거 없음).
  remediation: 주민등록번호 입력란을 제거하고 본인확인은 본인확인기관(휴대폰 본인확인, 아이핀, 금융인증서 등) 연동으로 바꾼다. 필요 시 생년월일·성별만 받는다. 기존 보유분은 파기 계획을 세워 파기하고 처리방침 수집항목을 고친다. 법령 근거로 처리하는 경우 근거 조문을 처리방침에 적고 암호화 보관한다.
  evidence: 입력 필드 DOM 속성(스크린샷 또는 속성 목록), 해당 네트워크 요청 URL·필드명(값은 마스킹 필요), 처리방침 수집항목
  notes: 법령 의무. 정보통신서비스 제공자에게는 PIPA 제24조의2보다 엄격한 특칙으로 읽히나, 2020년 개정 후 PIPA와 함께 적용되므로 판단은 PIPA 항목과 함께. PIPA-24B과 관계.
  category: 동의·고지
  strength: 의무
  default_risk: 상
- id: NET-23E-01
  title: 연계정보(CI) 목적 범위 내 처리
  basis:
  - 법 제23조의5제4항(L360)
  requirement: 본인확인기관에서 연계정보를 제공받은 연계정보 이용기관은 제공받은 목적 범위에서만 연계정보를 처리할 수 있고, 다른 목적은 정보주체의 별도 동의를 받은 범위에서만 처리할 수 있다.
  applies_when: 본인확인서비스(휴대폰·아이핀 등)를 통해 CI를 받는 사업자(연계정보 이용기관)
  type: 관찰
  type_note: null
  location:
  - 본인확인 완료 후 콜백·회원가입 완료 화면
  - 마이페이지
  - 처리방침
  method: (1) 본인확인 결과 콜백 및 이후 API 응답 본문에서 CI(88자 Base64 형태, 필드명 ci, conn_info 등)가 브라우저로 내려오는지 확인(사용자 본인 계정에 한함). (2) 처리방침에 CI 수집 목적·이용 범위가 적혀 있는지 확인. (3) CI를 마케팅·제3자 제공 등에 쓴다는 기재가 있으면 별도 동의 화면이 있는지 확인.
  pass: CI가 클라이언트에 노출되지 않거나 노출이 불가피한 경우 서버 처리 직후 폐기, 처리방침에 목적 범위 명시, 목적 외 처리 시 별도 동의.
  fail: 'CI가 화면·로컬스토리지·쿠키·불필요한 API 응답에 남음, 목적 외 이용(예: 타 서비스 회원 매칭)을 별도 동의 없이 수행.'
  remediation: 'CI는 서버 간 통신(본인확인기관→사업자 서버)으로만 받고 브라우저 응답·쿠키·localStorage에 남기지 않는다. 처리방침 수집항목에 "연계정보(CI): 중복가입 확인·본인 식별"처럼 목적을 적는다. 목적 외 이용 시 "연계정보를 ○○ 목적으로 이용하는 데 동의합니다(선택)" 별도 동의를 받는다.'
  evidence: 해당 API 응답의 필드명(값 마스킹 필요), localStorage·cookie 키 목록, 처리방침 해당 부분
  notes: 법령 의무. CI 값은 개인정보이므로 증적에서 반드시 마스킹. PIPA-15·PIPA-18과 관계.
  category: 동의·고지
  strength: 의무
  default_risk: 중
- id: NET-23F-01
  title: 연계정보 안전조치(이용기관)
  basis:
  - 법 제23조의6제2항·제3항(L415-416)
  - 영 제13조제2항(L428-435), 제14조제2호(L440)
  - 과태료 법 제76조제2항제2호의6(L2594)
  requirement: 연계정보 이용기관은 PIPA 제29조 안전조치 외에 (1) 안전조치 총괄 책임자 지정·내부규정 수립, (2) 제공 목적 범위 내 처리, (3) 주민등록번호를 보관하는 경우 CI와 분리 보관, (4) CI 저장·전송 암호화, (5) CI 분실·도난 등 침해사고 대응계획, (6) CI 제공기관·제공시기 기록·보관, (7) 고시 사항을 이행해야 한다.
  applies_when: 연계정보 이용기관. 실태점검 대상은 CI를 1,000건 이상 제공받은 자(영 제14조제2호)
  type: 서면
  type_note: null
  location:
  - 본인확인 연동 화면(전송 구간)
  - 서면
  method: '서면 확인: CI 관리 내부규정·책임자 지정 문서, DB 스키마(CI 컬럼 암호화 여부, 주민등록번호와 분리 여부), CI 수신 이력 기록(제공기관·일시), 침해사고 대응계획. 브라우저 보조 확인: 본인확인 연동 구간이 HTTPS인지, CI가 브라우저 응답에 평문으로 노출되는지(NET-23E-01과 함께).'
  pass: 7개 조치가 문서·시스템으로 확인되고 CI가 암호화 저장·전송됨.
  fail: 책임자·규정 없음, CI 평문 저장, 주민등록번호와 동일 테이블 보관, 수신 이력 미기록.
  remediation: 개인정보 내부관리계획에 "연계정보 안전조치" 장을 추가해 책임자(통상 CPO)를 지정하고, CI 컬럼을 양방향 암호화(AES-256 등)로 저장하며 전송은 TLS 1.2 이상으로 한다. CI 수신 로그(제공 본인확인기관명, 수신 일시, 목적)를 남기고 보관기간을 정한다. 침해사고 대응 매뉴얼에 CI 유출 시나리오를 넣는다.
  evidence: 서면 문서 목록, 본인확인 연동 요청의 프로토콜·도메인
  notes: 법령 의무(2024.1.23. 신설, 시행령 2025.5.20. 신설). 세부는 방송미디어통신위원회 고시 위임(원문 미제공). PIPA-29과 관계, SAFE 항목과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: NET-44E-01
  title: 공공기관등 게시판 이용자 본인확인
  basis:
  - 법 제44조의5제1항·제4항(L712-717)
  requirement: 국가기관·지방자치단체·공기업·준정부기관·지방공사·지방공단이 게시판을 설치·운영하려면 게시판 이용자의 본인확인 방법·절차 등 본인확인조치를 해야 한다.
  applies_when: 공공기관등(법 제44조의5제1항제1호). 민간 사업자 의무 조항은 위헌결정으로 삭제(2014)
  type: 관찰
  type_note: null
  location:
  - 게시판 글쓰기 화면
  - 게시판 이용 안내
  method: 게시판 글쓰기 버튼을 눌러 진입 단계에서 로그인 또는 본인확인(휴대폰·아이핀·간편인증 등)을 요구하는지 관찰한다. 글 작성·등록은 하지 않는다.
  pass: 글쓰기 진입 전 본인확인 또는 본인확인된 회원 로그인을 요구하고, 본인확인 시 주민등록번호를 직접 받지 않음.
  fail: 공공기관 게시판에 본인확인 없이 익명 작성 가능, 또는 본인확인 수단으로 주민등록번호를 직접 입력받음.
  remediation: 게시판 글쓰기에 본인확인기관 연동(휴대폰·아이핀·간편인증) 또는 본인확인 완료 회원 로그인을 적용하고, 본인확인 정보는 작성자 식별에 필요한 최소 정보만 보관한다. 게시판 운영 지침에 본인확인 절차를 적는다.
  evidence: 글쓰기 진입 시 본인확인 요구 화면 스크린샷
  notes: 법령 의무(공공기관등 한정). 본인확인 결과 보관은 PIPA-21과 관계, 주민등록번호 미수집은 NET-23B-01과 관계.
  category: 동의·고지
  strength: 의무
  default_risk: 중
- id: NET-32E-01
  title: 국내대리인 지정·공개(국외 사업자)
  basis:
  - 법 제32조의5제1항~제3항(L535-542)
  - 영 제19조(L546-551)
  - 과태료 법 제76조제3항제4호의3(L2623)
  requirement: 국내에 주소·영업소가 없는 정보통신서비스 제공자 중 전년도 매출액 1조원 이상, 정보통신서비스 부문 매출액 100억원 이상, 또는 자료제출을 요구받은 자는 국내대리인을 서면으로 지정하고, 국내대리인의 성명(법인은 명칭·대표자), 주소(영업소 소재지)·전화번호·전자우편 주소를 인터넷 사이트 등에 공개해야 한다.
  applies_when: 국외 정보통신서비스 제공자로서 영 제19조 기준 해당자
  type: 관찰
  type_note: null
  location:
  - 처리방침 페이지
  - 사이트 하단(푸터)
  - 회사 소개·법적 고지 페이지
  method: 처리방침·푸터·법적 고지 페이지 텍스트에서 "국내대리인" 항목과 성명·주소·전화번호·이메일 4개 요소가 모두 있는지 확인한다.
  pass: 국내대리인 항목이 있고 4개 요소가 모두 공개됨.
  fail: 적용 대상인데 국내대리인 공개가 없거나 요소 일부 누락.
  remediation: '처리방침에 "국내대리인: ○○주식회사(대표 ○○○), 주소 ○○, 전화 ○○, 이메일 ○○" 조항을 추가하고 사이트 하단에도 링크를 둔다. 국내대리인 지정 계약서(서면)를 갖춘다.'
  evidence: 공개 위치 스크린샷
  notes: 법령 의무. 망법상 국내대리인 대리 범위는 2020년 이후 제64조 자료제출만 남았고, 개인정보 관련 국내대리인은 PIPA 제31조의2가 별도로 규정. PIPA-31B과 관계(처리방침 기재는 STD-19-01과도 관계).
  category: 처리방침·권리보장
  strength: 의무
  default_risk: 중
- id: NET-42-01
  title: 청소년유해매체물 표시
  basis:
  - 법 제42조(L615)
  - 영 제24조(L617-619)
  - 법 제44조의2제3항(L663)
  requirement: 청소년유해매체물을 제공하는 자는 19세 미만은 이용할 수 없다는 취지를 누구나 쉽게 확인할 수 있게 음성·문자·영상으로 표시하고, 인터넷 제공자는 기호·부호·문자·숫자로 된 전자적 표시도 함께 해야 한다(구체 방법은 방송미디어통신위원회 고시). 표시방법을 지키지 않은 청소년유해매체물이 게재되어 있으면 정보통신서비스 제공자는 지체 없이 삭제해야 한다.
  applies_when: 청소년유해매체물(성인 콘텐츠, 주류·담배 판매 등 청소년유해 결정 매체물)을 제공하거나 게재된 정보통신망을 운영하는 자
  type: 관찰
  type_note: null
  location:
  - 성인 콘텐츠 메뉴·상품 상세
  - 성인인증 화면
  - 해당 페이지의 HTML head
  method: (1) 유해매체물 페이지 진입 전·진입 시 "19세 미만 이용 불가" 문구·19 표시 이미지가 보이는지 화면으로 확인. (2) 페이지 소스(DOM)의 meta 태그·헤더에서 고시에 따른 전자적 표시(청소년유해 라벨)가 있는지 조회. (3) 성인인증 전 상태(로그아웃)에서 해당 콘텐츠 본문이 노출되는지 확인.
  pass: 화면 표시(문구·19 마크)와 전자적 표시가 모두 있고, 성인인증 전에는 본문이 노출되지 않음.
  fail: 표시 없음, 화면 표시만 있고 전자적 표시 없음, 표시 없는 유해매체물 게시물이 방치됨.
  remediation: 성인 콘텐츠 페이지 상단에 "이 정보 내용은 청소년유해매체물로서 「청소년 보호법」 및 「정보통신망법」에 따라 19세 미만의 청소년이 이용할 수 없습니다" 문구와 19 마크를 표시하고, 고시가 정한 전자적 표시를 HTML head에 넣는다. 게시판 이용자가 올린 미표시 유해물은 모니터링해 삭제하는 운영 절차를 둔다.
  evidence: 표시 화면 스크린샷, meta 태그 목록
  notes: 법령 의무. 전자적 표시의 구체 형식은 방송미디어통신위원회 고시 위임(원문 미제공) — 형식 판정은 고시 확인 필요. 성인인증은 NET-42B-01과 관계.
  category: 노출·출력
  strength: 의무
  default_risk: 중
- id: NET-42B-01
  title: 청소년유해매체물 광고의 청소년 접근제한
  basis:
  - 법 제42조의2(L622)
  - 법 제44조의2제3항(L663)
  requirement: 청소년유해매체물을 광고하는 정보를 청소년에게 전송하거나 청소년 접근을 제한하는 조치 없이 공개적으로 전시해서는 안 되며, 운영자는 그런 광고가 전시되어 있으면 지체 없이 삭제해야 한다.
  applies_when: 성인용 상품·콘텐츠 광고·배너를 게재하는 사이트, 이용자 게시판을 운영하는 자
  type: 관찰
  type_note: null
  location:
  - 메인·목록 화면의 배너·광고 영역
  - 검색 결과
  - 성인 상품 목록
  method: 로그아웃 또는 미인증 상태로 메인·목록·검색 화면을 탐색해 성인용 상품 이미지·광고가 성인인증 없이 노출되는지 관찰한다.
  pass: 청소년유해매체물 광고는 성인인증 후에만 보이거나 대체 이미지(19 마크)로 가려짐.
  fail: 미인증 상태에서 성인용 광고·썸네일이 그대로 노출됨.
  remediation: 성인 상품·광고는 성인인증(본인확인기관 연령 확인) 완료 세션에만 노출하고, 미인증 시 "19세 이상만 볼 수 있습니다" 대체 이미지를 띄운다. 광고 운영 정책에 유해매체물 광고 게재 기준을 둔다.
  evidence: 미인증 상태 화면 스크린샷(성인 이미지는 흐림 처리)
  notes: 법령 의무. 연령 확인 방법은 NET-23B-01(주민등록번호 미수집)과 함께 본다.
  category: 노출·출력
  strength: 의무
  default_risk: 중
- id: NET-42C-01
  title: 청소년보호책임자 지정·업무
  basis:
  - 법 제42조의3(L626-629)
  - 영 제25조~제27조(L632-643)
  - 과태료 법 제76조제4항제3호(L2635)
  requirement: 전년도 말 기준 직전 3개월 일평균 이용자 10만명 이상 또는 정보통신서비스 부문 매출액 10억원 이상이면서 청소년유해매체물을 제공·매개하는 자는 임원 또는 관련 부서장 중에서 청소년보호책임자를 매년 4월 말까지 지정해야 한다. 책임자는 보호계획 수립, 접근제한·관리조치, 종사자 교육, 피해상담·고충처리를 한다.
  applies_when: 영 제25조 요건을 모두 갖춘 정보통신서비스 제공자
  type: 서면
  type_note: null
  location:
  - 사이트 하단·청소년보호정책 페이지(공개 여부 참고)
  - 서면
  method: '서면 확인: 청소년보호책임자 지정 문서(직위·지정일), 청소년보호계획, 교육 실시 기록, 피해상담 처리 기록. 브라우저 보조 확인: 청소년보호정책·책임자 연락처가 사이트에 공개되어 있는지.'
  pass: 기한 내 적격자 지정, 4개 업무 수행 기록 존재.
  fail: 미지정, 임원·부서장이 아닌 자 지정, 업무 기록 없음.
  remediation: 매년 4월 말까지 임원 또는 청소년보호 담당 부서장을 책임자로 지정하는 내부 결재를 하고, 청소년보호정책(유해정보 차단·관리, 교육, 상담 창구)을 수립해 사이트 하단에 "청소년보호정책" 링크와 책임자 연락처를 게시한다(게시는 관행·권고).
  evidence: 정책 페이지 스크린샷, 서면 문서 목록
  notes: 지정은 법령 의무, 사이트 공개는 법 조문에 명시되지 않아 권고로 표시.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: NET-43-01
  title: 청소년유해 영상·음향정보 6개월 보관
  basis:
  - 법 제43조(L646-647)
  - 영 제28조(L650-651)
  - 과태료 법 제76조제4항제4호(L2636)
  requirement: 청소년유해매체물을 이용자 컴퓨터에 저장되지 않는 방식(스트리밍 등)으로 제공하는 것을 영업으로 하는 자(방송사업자 등 제외)는 그 정보를 제공한 때부터 6개월간 보관해야 한다.
  applies_when: 청소년유해 영상·음향을 스트리밍 등으로 영업 제공하는 자
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 스트리밍 제공 콘텐츠의 보관 정책·보관 기간 설정, 6개월 이내 제공분 보관 현황.'
  pass: 제공일부터 6개월 이상 보관.
  fail: 보관하지 않거나 6개월 미만 보관.
  remediation: 콘텐츠 저장소에 제공 일자 기준 최소 6개월 보존 정책(삭제 잠금 등)을 설정하고 보관 대장을 둔다.
  evidence: 서면 문서
  notes: 법령 의무. 해당 사업자가 아니면 "해당없음"으로 처리.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: NET-44B-01
  title: 권리침해 정보 삭제요청·임시조치 처리와 약관 명시
  basis:
  - 법 제44조의2제1항·제2항·제4항·제5항(L661-665)
  - 법 제44조의3(L696-697)
  requirement: 사생활 침해·명예훼손 정보에 대해 삭제 또는 반박내용 게재를 요청받으면 지체 없이 삭제·임시조치 등을 하고 즉시 신청인과 게재자에게 알리며, 조치 사실을 게시판 공시 등으로 이용자가 알 수 있게 해야 한다. 판단이 어렵거나 다툼이 예상되면 30일 이내 임시조치(접근 차단)를 할 수 있다. 조치의 내용·절차를 미리 약관에 구체적으로 밝혀야 한다. 신청인·게재자는 통지받을 수단(문자·이메일)을 지정할 수 있다.
  applies_when: 일반 공개 게시판·댓글·리뷰 등 이용자 게시 기능이 있는 정보통신서비스 제공자
  type: 관찰
  type_note: null
  location:
  - 이용약관
  - 게시물 신고·권리침해 신고 메뉴
  - 게시판 운영정책
  - 임시조치된 게시물 화면
  method: (1) 이용약관·운영정책에서 권리침해 게시물 삭제요청·임시조치(30일) 절차와 통지 방법이 구체적으로 있는지 확인. (2) 게시물 신고 또는 권리침해 신고 메뉴가 있는지, 신청 양식에 통지받을 수단(문자·이메일) 지정란이 있는지 관찰(제출하지 않음). (3) 임시조치된 게시물이 있으면 "권리침해 신고로 임시조치된 게시물입니다" 류 공시가 되는지 확인. (4) 처리 경과 통지·처리 기록은 서면 확인.
  pass: 약관에 절차가 구체적으로 있고, 신고 창구와 통지 수단 지정 기능이 있으며, 조치 사실이 공시됨.
  fail: 약관에 절차 없음, 신고 창구 없음, 임시조치 기간이 30일 초과로 규정, 조치 후 공시·통지 없음.
  remediation: 약관에 "권리침해 게시물 처리" 조항(요청 방법, 소명자료, 삭제·임시조치 기준, 임시조치 30일, 신청인·게재자 통지, 이의제기)을 둔다. 게시물마다 [신고] 버튼과 권리침해 신고 양식(대상 URL, 침해 사유, 소명자료, 통지 수단 선택)을 둔다. 조치된 게시물 자리에 "이 게시물은 권리침해 신고에 따라 임시조치(30일)되었습니다" 문구를 표시한다. 처리 대장을 운영한다.
  evidence: 약관 해당 조항 스크린샷, 신고 양식 화면(입력하지 않은 상태), 임시조치 공시 화면
  notes: 제44조의2 제2항·제5항은 "하여야 한다"로 법령 의무, 제44조의3 임의 임시조치는 재량. 과태료 조항은 없으나 이행 시 배상책임 감면(제6항). 신고 시 받는 개인정보는 최소화(PIPA-16과 관계).
  category: 노출·출력
  strength: 의무
  default_risk: 중
- id: NET-44F-01
  title: 분쟁조정부의 이용자 정보 제공 결정 이행
  basis:
  - 법 제44조의6(L723-726)
  - 영 제31조·제32조(L729-737)
  - 과태료 법 제76조제4항제4호의2(L2637)
  requirement: 분쟁조정부가 권리침해 주장자의 청구에 따라 이용자 정보(성명·주소·연락처 등) 제공을 결정하면, 정보통신서비스 제공자는 정당한 사유 없이 거부해서는 안 된다.
  applies_when: 이용자 게시 기능이 있는 정보통신서비스 제공자
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 분쟁조정부 정보제공 요청 처리 절차, 처리 기록(요청일·제공 항목·제공일), 제공 범위가 결정 범위를 넘지 않는지.'
  pass: 처리 절차가 있고 결정 범위의 최소 정보만 제공한 기록.
  fail: 절차 없음, 결정 불이행, 결정 범위 초과 제공.
  remediation: 개인정보 제3자 제공 절차서에 "법령에 따른 제공(분쟁조정부 결정)" 항목을 두고 요청 접수·검토·제공·기록 단계를 정한다. 제공 대장에 기록한다.
  evidence: 서면 문서
  notes: 법령 의무. 제3자 제공 기록은 PIPA-18과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: NET-44H-01
  title: 대화형 서비스의 아동 보호
  basis:
  - 법 제44조의8(L797)
  requirement: 만 14세 미만 아동에게 챗봇 등 대화형 정보통신서비스를 제공하는 경우 부적절한 내용이 제공되지 않도록 노력해야 한다.
  applies_when: 만 14세 미만이 이용할 수 있는 챗봇·AI 대화 서비스를 제공하는 자
  type: 서면
  type_note: null
  location:
  - 챗봇 화면
  - 서면
  method: '서면 확인: 아동 대상 응답 필터링 정책, 금칙어·유해응답 차단 설정, 연령 확인 여부. 브라우저 보조 확인: 챗봇 화면에 이용 연령 안내·신고 기능이 있는지 관찰(대화 입력은 하지 않음).'
  pass: 아동 대상 유해 응답 차단 정책과 기술적 필터가 있음.
  fail: 아동 이용 가능 서비스인데 필터링·정책 없음.
  remediation: 대화 모델 출력에 유해 콘텐츠 필터를 적용하고, 아동 계정이면 강화된 필터를 쓴다. 챗봇 화면에 부적절 응답 신고 버튼을 둔다.
  evidence: 챗봇 화면 스크린샷, 서면 문서
  notes: 노력의무(과태료 없음). 판정은 "권고 미이행" 수준으로 표시 권장.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: NET-44I-01
  title: 불법촬영물등 유통방지 책임자·보고서
  basis:
  - 법 제44조의9(L801-806)
  - 영 제35조의3(L809-822)
  - 법 제44조의14제2항(L934-939)
  - 영 제35조의7제3항(L914)
  - 과태료 법 제76조제3항제4호의4, 제4항제4호의4
  requirement: 특수유형부가통신사업자(웹하드 등) 또는 정보통신서비스 부문 매출액 10억원 이상이거나 일평균 이용자 10만명 이상이면서 별표 1의3 서비스를 제공하는 부가통신사업자는 임원 또는 담당 부서장 중 불법촬영물등 유통방지 책임자를 1명 이상 지정하고, 책임자는 매년 2시간 이상 교육을 받아야 한다. 매년 불법촬영물등 처리 보고서를 다음 연도 1월 31일까지 방송미디어통신위원회에 제출해야 한다.
  applies_when: 영 제35조의3제1항 해당자
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 책임자 지정 문서(직위), 연 2시간 이상 교육 이수증, 직전 연도 보고서 제출 증빙, 불법촬영물 신고·삭제 처리 절차.'
  pass: 적격자 지정, 교육 이수, 보고서 기한 내 제출.
  fail: 미지정, 교육 미이수, 보고서 미제출.
  remediation: 책임자를 지정하고 연간 교육 일정을 관리하며, 신고·삭제·접속차단 처리 대장을 바탕으로 매년 1월 보고서를 작성·제출한다.
  evidence: 서면 문서
  notes: 법령 의무. 신고 기능 화면은 NET-44L-01과 함께 볼 수 있음.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: NET-44L-01
  title: 대규모 사업자의 불법·허위조작정보 신고 처리·운영정책
  basis:
  - 법 제44조의12(L887-902)
  - 영 제35조의6(L905-910)
  - 법 제44조의16제1항·제5항(L955-959)
  - 영 제35조의8제5항(L975)
  - 법 제2조제1항제3호의2, 영 제2조의2(L23, L44)
  requirement: 대규모 정보통신서비스 제공자는 불법정보·허위조작정보 신고를 받아 접수 사실을 신고자에게 통지하고, 삭제·접근차단·계정정지·수익화 제한 등 조치(또는 기각) 시 정당한 이유와 이의신청 절차를 신고자·게재자에게 통지해야 한다. 이의신청은 통지일부터 6개월 이내 가능. 판정기준·신고·조치에 관한 자율적인 운영정책을 이해관계자 의견을 반영해 수립하고, 허위정보등 처리 정책을 수립·운영하며 사실확인 보고서를 반영한 경우 홈페이지에 공표해야 한다.
  applies_when: 대규모 정보통신서비스 제공자(전년도 말 직전 3개월 일평균 이용자 100만명 이상 + 영 별표 1 서비스)
  type: 관찰
  type_note: null
  location:
  - 게시물·계정 신고 메뉴
  - 운영정책·커뮤니티 가이드라인 페이지
  method: (1) 신고 양식이 영 제35조의6 기재사항(대상 URL, 내용·사유, 증빙 첨부, 신고자 연락처, 신고자 성명)을 받을 수 있는지 화면으로 확인(제출하지 않음). (2) 운영정책 페이지에 판정기준·조치 종류·이의신청 절차(6개월)가 공개되어 있는지 확인. (3) 사실확인 반영 공표 페이지 여부 확인. (4) 통지 실제 발송은 서면 확인.
  pass: 신고 양식·운영정책·이의신청 절차가 공개되어 있고 통지 기록이 있음.
  fail: 신고 창구 없음, 운영정책 미공개, 조치 통지·이의신청 절차 없음.
  remediation: 신고 양식에 대상 URL·사유·증빙·연락처·성명 입력란을 두되 신고에 필요한 최소 개인정보만 받는다는 안내를 붙인다. 운영정책 페이지에 판정기준, 조치 유형, 통지 방식, "통지를 받은 날부터 6개월 이내 이의신청 가능" 문구를 둔다. 접수·조치 통지 템플릿(이메일·알림)을 마련한다.
  evidence: 신고 양식 화면(빈 상태), 운영정책 페이지 스크린샷
  notes: 법령 의무(2026.1.6. 신설). 신고자 개인정보 수집은 PIPA-15·PIPA-16과 관계. 이용자 보호 범위의 경계 항목이므로 점검 범위 포함 여부는 사용자 결정 필요(추출 메모 참고).
  category: 노출·출력
  strength: 의무
  default_risk: 중
- id: NET-44N-01
  title: 대규모 사업자 투명성 보고서 공표
  basis:
  - 법 제44조의14제1항(L927-933)
  - 영 제35조의7제1항·제2항(L912-913)
  requirement: 대규모 정보통신서비스 제공자는 6개월에 1회 이상 일평균 이용자 수·매출액·사업 종류, 신고 유형별 건수·처리 건수·조치, 이의신청 건수·결과, 국가기관 명령·권고와 조치, 약관·정책에 따른 처리 현황, 자율 운영정책을 담은 보고서를 인터넷 홈페이지(없으면 앱 등)에 게시해야 한다.
  applies_when: 대규모 정보통신서비스 제공자
  type: 관찰
  type_note: null
  location:
  - 홈페이지 하단·고객센터·투명성 보고서 페이지
  method: 투명성 보고서 페이지를 찾아 최근 6개월 이내 보고서가 게시되어 있는지, 법정 항목이 있는지 확인한다.
  pass: 6개월 주기로 법정 항목을 담은 보고서가 홈페이지에 공개됨.
  fail: 미게시, 주기 초과, 항목 누락.
  remediation: 반기별 투명성 보고서 작성 절차를 정하고 홈페이지 하단에 "투명성 보고서" 링크로 상시 게시한다.
  evidence: 보고서 페이지 스크린샷(게시일 포함)
  notes: 법령 의무(2026.1.6. 신설). NET-44L-01과 같은 경계 항목.
  category: 노출·출력
  strength: 의무
  default_risk: 중
- id: NET-45-01
  title: 정보통신망 안정성·정보 신뢰성 보호조치
  basis:
  - 법 제45조제1항제1호·제2항·제3항(L1105-1113)
  requirement: 정보통신서비스 제공자는 정보통신망의 안정성과 정보의 신뢰성을 확보하기 위한 보호조치를 해야 하며, 과학기술정보통신부장관이 고시하는 정보보호지침(무단 접근·침입 방지 시스템, 정보 유출·위변조 방지, 가용성 확보, 인력·조직·경비 등 관리적 조치)을 지키도록 권고받을 수 있다.
  applies_when: 모든 정보통신서비스 제공자
  type: 관찰
  type_note: null
  location:
  - 전 화면(전송 구간)
  - 로그인 화면
  - 오류 페이지
  - 서면
  method: '브라우저로 볼 수 있는 범위만 확인: (1) 전 페이지 HTTPS 적용과 HTTP 접속 시 HTTPS 리다이렉트, (2) 오류 페이지에 스택트레이스·서버 버전 등 내부 정보 노출 여부, (3) 응답 헤더의 서버 버전 노출 여부(읽기만). 세부 기술 점검은 SAFE 항목에서 수행. 서면 확인: 정보보호 정책·조직·예산, 침입차단·탐지 시스템 운영 현황, 백업·이중화.'
  pass: 전송 구간 암호화, 내부 정보 미노출, 정보보호 정책·조직·시스템이 문서로 확인됨.
  fail: HTTP 평문 페이지 존재, 오류 시 내부 정보 노출, 정보보호 정책·조직 부재.
  remediation: '전 구간 TLS 적용과 HSTS 설정(`Strict-Transport-Security: max-age=31536000`), 사용자 정의 오류 페이지 적용, 서버 배너 제거(`server_tokens off` 등)를 한다. 정보보호 정책서와 침입차단·탐지 운영 절차, 백업·복구 절차를 문서화한다.'
  evidence: 리다이렉트 응답 헤더, 오류 페이지 스크린샷(개인정보 노출 시 마스킹)
  notes: 보호조치 자체는 법령 의무, 정보보호지침(고시) 준수는 "권고". 개인정보 안전성 확보조치(SAFE)와 대부분 겹침 — 판정은 SAFE 항목 우선, 이 항목은 근거 병기용. PIPA-29과 관계.
  category: 인증·접근통제
  strength: 의무
  default_risk: 중
- id: NET-45-02
  title: 정보보호 인력·예산 확보(주요 사업자)와 정보보호위원회
  basis:
  - 법 제45조제5항(L1116)
  - 영 제36조의2제2항·제3항(L1122-1125)
  - 법 제45조의4(L1247-1249)
  - 영 제36조의10·제36조의11(L1252-1267)
  requirement: 주요정보통신서비스 제공자, 집적정보통신시설 사업자, 영 제36조의7제1항제2호~제4호 해당 사업자는 정보보호 전문 인력과 예산을 확보하도록 노력해야 한다. 영 제36조의7제1항제2호~제4호 해당 사업자는 정보보호위원회(위원장=CISO, 정보보호·개인정보·전산·준법·재무·인사 부서장 등)를 설치해 인력·예산, CISO 업무를 심의하고 매년 1회 이상 정기 회의를 열며 결과를 최고경영자(중대 사항은 이사회)에게 보고해야 한다.
  applies_when: 영 제36조의7제1항제2호~제4호 해당 정보통신서비스 제공자(대략 소기업·소규모 중기업 제외한 사업자). 인력·예산은 노력의무
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 정보보호위원회 규정·위원 명단, 최근 1년 회의록, 최고경영자·이사회 보고 기록, 정보보호 인력·예산 현황.'
  pass: 위원회가 구성되어 연 1회 이상 개최되고 보고 기록이 있음.
  fail: 대상인데 위원회 미설치, 회의 미개최, 보고 없음.
  remediation: 정보보호위원회 운영 규정을 제정하고(구성, 심의사항, 개의·의결 정족수 과반수, 정기회의 연 1회 이상), 연간 정보보호 계획·예산을 상정해 심의·보고한다.
  evidence: 서면 문서 목록
  notes: 위원회 설치는 법령 의무(2026.3.31. 신설, 시행령 2026.9.30.), 인력·예산 확보는 노력의무.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: NET-45B-01
  title: 정보보호 사전점검(설계 단계 보안 고려)
  basis:
  - 법 제45조의2(L1137-1141)
  - 영 제36조의3~제36조의6(L1144-1169)
  requirement: 새 정보통신망 구축·서비스 제공 시 계획·설계에 정보보호를 고려해야 한다. 과기정통부 인허가·등록 사업으로 시스템 구축 투자 5억원 이상이거나 정부 지원 사업이면 사전점검기준에 따른 보호조치를 권고받을 수 있다(서면·현장·원격 점검, 준비→설계검토→보호대책 적용→구현점검→결과정리).
  applies_when: 신규 구축·서비스 개시 시 모든 정보통신서비스 제공자(사전점검 권고는 영 제36조의4 대상)
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 개발 방법론·SDLC 내 보안 요구사항 정의·설계 검토 산출물, 사전점검 결과보고서(대상인 경우).'
  pass: 신규 서비스 설계 시 보안 요구사항·위험 분석 산출물이 있음.
  fail: 보안 검토 절차·산출물 없음.
  remediation: 개발 단계별 보안성 검토 절차(요구사항 정의 시 보안 요구사항, 설계 검토, 오픈 전 취약점 점검)를 정하고 산출물 양식을 만든다.
  evidence: 서면 문서
  notes: 제1항은 "고려하여야" 의무이나 제재 없음, 제2항 사전점검은 권고. CISO 업무(영 제36조의7제7항제1호 보안성 검토)와 관계 — NET-45C-01.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: NET-45C-01
  title: 정보보호 최고책임자(CISO) 지정·신고·겸직제한
  basis:
  - 법 제45조의3제1항~제4항·제7항(L1174-1194)
  - 영 제36조의7(L1197-1233), 제36조의8(L1236)
  - 과태료 법 제76조제2항제6호의2·제6호의3(L2600-2601)
  requirement: '정보통신서비스 제공자는 기준에 맞는 임원을 CISO로 지정하고 신고의무 발생일부터 6개월 이내 과기정통부에 신고해야 한다(자본금 1억원 이하·소기업·일부 중기업은 신고 면제, 미신고 시 대표자를 CISO로 간주). CISO 자격: 정보보호·IT 석사 이상, 학사+3년, 전문학사+5년, 경력 10년, 인증심사원 자격, 정보보호 부서장 1년 중 하나. 자산총액 5조원 이상 또는 ISMS 의무+자산 5천억원 이상은 상근·겸직금지 및 추가 경력(정보보호 4년 등). CISO는 정보보호 계획, 정기 감사, 위험 평가, 교육·모의훈련, 인력·예산, 이사회 보고, 서비스 도입·변경 시 보안성 검토, 위탁·클라우드 사업자 정기 보안점검을 총괄한다.'
  applies_when: 모든 정보통신서비스 제공자(신고 면제·겸직금지 대상은 영 제36조의7 기준)
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: CISO 지정 문서(직위·임원 여부), 신고 접수증, 자격 증빙, 겸직 현황(겸직금지 대상이면 상근·단독 업무 확인), 연간 업무 수행 기록(이사회 보고, 보안성 검토, 수탁사 점검).'
  pass: 적격 임원 지정, 기한 내 신고, 겸직금지 준수, 업무 수행 기록 존재.
  fail: 미지정·미신고, 자격 미달, 겸직금지 대상인데 겸직, 업무 기록 없음.
  remediation: 이사회 또는 대표 결재로 CISO를 지정하고 과기정통부 지정신고서를 제출한다. 겸직금지 대상이면 CISO를 정보보호 전담 상근 임원으로 둔다. CISO 연간 업무계획(감사·위험평가·교육·훈련·이사회 보고·수탁사 점검)을 세우고 실적을 남긴다.
  evidence: 서면 문서
  notes: 법령 의무. CISO는 개인정보 보호책임자(CPO) 업무를 겸할 수 있음(법 제45조의3제4항제2호라목) — PIPA-31과 관계. 수탁사 점검은 PIPA-26과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: NET-46-01
  title: 집적정보통신시설 보호조치·중단 보고
  basis:
  - 법 제46조제1항·제2항·제6항·제7항(L1271-1279)
  - 영 제37조, 제38조, 제40조, 제41조(L1284-1317)
  - 법 제46조의2(L1327-1332)
  - 과태료 법 제76조제3항제4호의2, 제4항제4호의5·제4호의6
  requirement: 타인용 IDC 사업자(전산실 500㎡ 이상) 또는 자체 IDC 운영자(500㎡ 이상 + ICT 매출 100억원 이상 + 일평균 국내 이용자 100만명 이상)는 접근통제·감시, 재해·테러 대비, 관리인원 배치, 내부관리계획(비상계획 포함), 침해 확산 차단 조치를 해야 한다. 서비스가 연속 30분 이상 또는 24시간 내 2회 이상 합계 45분 이상 중단되면 문서로 지체 없이 보고해야 한다. IDC 사업자는 책임보험에 가입하고, 긴급 중단 시 사유·일시·기간을 시설이용자에게 즉시 알려야 한다. IDC를 임차해 배타적으로 운영하는 자도 보호조치·중단 보고·임대인 통지를 해야 한다.
  applies_when: 영 제37조제1항 해당자, IDC 임차 배타 운영자(영 제41조)
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 전산실 면적·대상 여부 판단 자료, 보호조치 이행 현황, 비상계획, 서비스 중단 보고 이력, 보험 증권(IDC 사업자).'
  pass: 대상이면 5개 보호조치와 보고 체계가 갖춰짐.
  fail: 대상인데 보호조치·보고 체계 없음, 보험 미가입.
  remediation: 전산실 출입통제·CCTV·재해 대비 설비를 갖추고, 서비스 중단 30분/45분 기준 보고 절차와 보고서 양식(일시·장소, 원인·피해, 응급조치, 복구대책, 향후 계획)을 마련한다.
  evidence: 서면 문서
  notes: 법령 의무. 클라우드·외부 IDC를 쓰는 일반 웹서비스는 대개 해당없음.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: NET-47-01
  title: 정보보호 관리체계(ISMS) 인증 의무
  basis:
  - 법 제47조제2항·제5항(L1342-1348)
  - 영 제49조제2항(L1386-1391), 제47조(L1368-1382)
  - 규칙 제3조(L1438-1446)
  - 과태료 법 제76조제2항제6호의5(L2603)
  requirement: 주요정보통신서비스 제공자, IDC 사업자, 전년도 매출액·세입 1,500억원 이상인 상급종합병원·재학생 1만명 이상 대학, 정보통신서비스 부문 매출액 100억원 이상, 전년도 일평균 이용자 100만명 이상인 자(금융회사 제외)는 ISMS 인증을 받아야 한다. 유효기간 3년, 연 1회 이상 사후관리.
  applies_when: 법 제47조제2항 각 호·영 제49조제2항 해당자
  type: 서면
  type_note: null
  location:
  - 서면
  - 사이트 하단 인증 표시
  method: '서면 확인: ISMS(또는 ISMS-P) 인증서(범위·유효기간), 최근 사후심사 결과. 인증 범위에 점검 대상 서비스가 포함되는지 대조.'
  pass: 유효한 인증서가 있고 범위에 대상 서비스 포함.
  fail: 의무 대상인데 미인증·만료, 대상 서비스가 범위 밖.
  remediation: 인증 의무 해당 여부를 매년 매출·이용자 수로 판단하고, 대상이면 ISMS-P 인증을 취득·유지한다(국제표준 인증 등은 심사 일부 생략 가능, 규칙 제3조).
  evidence: 인증서 사본(서면)
  notes: 법령 의무. ISMS-P 인증은 PIPA 제32조의2 개인정보 보호 인증과 함께 운영 — PIPA-32B과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: NET-47-02
  title: 인증 표시의 정확성
  basis:
  - 법 제47조제9항(L1358)
  - 영 제52조(L1401)
  - 과태료 법 제76조제4항제7호(L2644)
  requirement: 인증받은 내용을 표시·홍보할 때 고시된 인증표시를 쓰고 인증 범위와 유효기간을 함께 표시해야 하며, 거짓으로 홍보해서는 안 된다.
  applies_when: 사이트에 ISMS(ISMS-P) 인증 마크를 게시한 자
  type: 관찰
  type_note: null
  location:
  - 사이트 하단(푸터)
  - 회사 소개
  - 보안 안내 페이지
  method: 인증 마크가 있으면 인증 범위·유효기간이 함께 표시되는지 확인하고, 서면으로 받은 인증서(또는 KISA 인증 현황)와 범위·기간을 대조한다.
  pass: 마크와 함께 범위·유효기간이 표시되고 실제 인증과 일치.
  fail: 범위·유효기간 미표시, 만료된 인증 마크 게시, 인증 범위 밖 서비스에 마크 게시.
  remediation: 푸터 인증 마크 옆에 "[인증범위] ○○ 서비스 운영 / [유효기간] 2025.01.01~2027.12.31"을 함께 표시하고, 갱신·만료 시 즉시 수정하는 절차를 둔다.
  evidence: 인증 표시 스크린샷
  notes: 거짓 홍보는 과태료 대상(법령 의무). 범위·유효기간 동시 표시는 시행령 의무.
  category: 인증·접근통제
  strength: 의무
  default_risk: 하
- id: NET-47D-01
  title: 보안 취약점 보완 프로그램 고지(소프트웨어 배포 시)
  basis:
  - 법 제47조의4제4항(L1475)
  - 과태료 법 제76조제4항제10호(L2647)
  requirement: 소프트웨어사업자는 보안 취약점 보완 프로그램(패치)을 만들면 한국인터넷진흥원에 알리고, 소프트웨어 사용자에게 제작일부터 1개월 이내에 2회 이상 알려야 한다.
  applies_when: 사이트에서 설치형 소프트웨어(보안 프로그램, 뷰어, 데스크톱 앱, 플러그인)를 배포하는 소프트웨어사업자
  type: 관찰
  type_note: null
  location:
  - 다운로드 페이지
  - 공지사항
  - 보안 공지
  method: 배포 소프트웨어가 있으면 공지사항·다운로드 페이지에서 보안 업데이트 공지 이력을 확인한다(파일은 다운로드하지 않음). 고지 횟수·KISA 통보는 서면 확인.
  pass: 보안 패치마다 1개월 내 2회 이상 고지 이력과 KISA 통보 기록.
  fail: 보안 패치를 공지 없이 배포, 고지 1회 이하.
  remediation: 보안 패치 배포 절차에 "KISA 통보 + 사용자 고지 2회(공지사항, 이메일·앱 내 알림 등) 1개월 이내"를 넣고 고지 이력을 남긴다.
  evidence: 공지사항 목록 스크린샷
  notes: 법령 의무. 웹만 운영하면 해당없음.
  category: 인증·접근통제
  strength: 의무
  default_risk: 중
- id: NET-47D-02
  title: 중대 침해사고 시 이용자 보호조치 요청·접속제한의 약관 명시
  basis:
  - 법 제47조의4제3항·제5항(L1474-1476)
  - 영 제55조(L1483-1487)
  requirement: 주요정보통신서비스 제공자는 중대 침해사고로 이용자 시스템에 심각한 장애가 생길 가능성이 있으면 약관에 따라 이용자에게 보호조치를 요청하고 불이행 시 접속을 일시 제한할 수 있으며, 약관에 요청 사유·방법, 이용자 조치 내용, 접속 제한 기간, 부당 제한 시 이의제기·배상 절차를 정해야 한다.
  applies_when: 주요정보통신서비스 제공자(전국 회선설비 보유 통신사, 이통 재판매사업자)
  type: 관찰
  type_note: null
  location:
  - 이용약관
  method: 이용약관에서 영 제55조 4개 사항이 있는지 확인.
  pass: 4개 사항이 약관에 모두 있음.
  fail: 접속 제한을 하면서 약관 근거·이의제기 절차가 없음.
  remediation: 이용약관에 "침해사고 시 이용자 보호조치 요청 및 접속 제한" 조항을 추가해 4개 사항을 적는다.
  evidence: 약관 해당 조항 스크린샷
  notes: 일반 웹서비스는 대부분 해당없음.
  category: 인증·접근통제
  strength: 의무
  default_risk: 중
- id: NET-48B-01
  title: 침해사고 관련정보 제공(주요 사업자)
  basis:
  - 법 제48조의2제2항(L1568-1571)
  - 영 제57조·제58조(L1593-1602)
  requirement: 주요정보통신서비스 제공자, IDC 사업자, 영 제57조 해당자(주요정보통신기반시설, 관제서비스 사업자, 독자 IP 운영 민간사업자 중 고시 대상, 백신 제조자)는 침해사고 유형별 통계, 소통량 통계, 접속경로별 이용 통계 등을 과기정통부·KISA에 정해진 방식으로 제공해야 한다.
  applies_when: 법 제48조의2제2항 각 호 해당자
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 침해사고 관련정보 제공 체계·제공 이력.'
  pass: 대상이면 정해진 방식으로 제공 중.
  fail: 대상인데 미제공.
  remediation: KISA와 정보 제공 채널을 정하고 제공 주기·담당자를 지정한다.
  evidence: 서면 문서
  notes: 법령 의무(시정명령 불이행 시 과태료). 일반 웹서비스는 대부분 해당없음.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: NET-48C-01
  title: 침해사고 24시간 내 신고
  basis:
  - 법 제48조의3제1항(L1651)
  - 영 제58조의8(L1660-1665)
  - 과태료 법 제76조제1항제2호(L2585)
  requirement: 침해사고(해킹·악성코드·DDoS·인증 우회 장치 설치 등)가 발생하면 안 때부터 24시간 이내에 발생 일시·원인·피해내용, 대응 현황, 대응 부서·연락처를 과기정통부 또는 KISA에 신고하고, 추가 확인 사실은 확인 후 24시간 이내 추가 신고해야 한다. 서면·이메일·전화·홈페이지 입력으로 가능하며, 다른 법률에 따른 신고를 했으면 신고한 것으로 본다.
  applies_when: 모든 정보통신서비스 제공자
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 침해사고 대응 절차서의 신고 기준·기한(24시간)·신고처, 최근 침해사고 대장과 신고 이력(인지 시각 대비 신고 시각).'
  pass: 절차서에 24시간 신고와 추가 신고가 명시되고, 실제 사고 시 기한 내 신고.
  fail: 절차 없음, 신고 누락·지연.
  remediation: 침해사고 대응 절차서에 "인지 후 24시간 이내 KISA(118 또는 보호나라 신고) 신고, 추가 사실은 확인 후 24시간 이내" 단계와 담당자를 명시하고, 개인정보 유출이 함께 발생하면 PIPC 72시간 신고와 병행하도록 체크리스트를 만든다.
  evidence: 서면 문서
  notes: 법령 의무(2026.3.31. 개정으로 과태료 5천만원 이하). 개인정보 유출 신고(PIPA 72시간)와 기한·신고처가 다름 — PIPA-34과 관계, STD-28-01과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: NET-48C-02
  title: 침해사고 이용자 통지
  basis:
  - 법 제48조의3제4항(L1656)
  - 영 제58조의9(L1669-1681)
  - 과태료 법 제76조제4항제11호의4(L2651)
  requirement: 서비스 장애·기능 중단이 2시간 이상 지속되거나 이용자 정보가 분실·도난·유출·변조·훼손·유용되었거나 그럴 가능성이 있는 침해사고 등이 발생하면 지체 없이 이용자에게 발생 일시·원인·피해내용, 대응 현황, 이용자 대처방법, 피해구제 조치 내용, 피해구제 민원 담당부서·연락처를 통지해야 한다. 확인 못 한 사항은 우선 확인된 내용부터 통지하고 추가로 통지한다. 서면·전화·이메일·팩스·문자 등으로 하며, 연락처를 모르는 등 정당한 사유가 있으면 홈페이지에 30일 이상 게시로 갈음할 수 있다.
  applies_when: 모든 정보통신서비스 제공자
  type: 서면
  type_note: null
  location:
  - 공지사항(과거 장애·침해 공지)
  - 서면
  method: '서면 확인: 이용자 통지 절차·템플릿, 과거 사고 시 통지 이력. 브라우저 보조 확인: 공지사항에서 과거 장애·침해사고 공지가 있으면 5개 항목 포함 여부와 게시 기간(30일 이상) 확인.'
  pass: 통지 템플릿에 5개 항목이 있고 실제 사고 시 지체 없이 통지.
  fail: 통지 절차 없음, 통지 항목 누락, 홈페이지 게시로 갈음하며 30일 미만 게시.
  remediation: 통지 템플릿("발생 일시·원인·피해, 조치 현황, 이용자 대처방법(비밀번호 변경 등), 피해구제 내용, 문의처")을 미리 만들고, 공지사항 게시 시 30일 이상 상단 고정하는 운영 절차를 둔다.
  evidence: 과거 공지 스크린샷, 서면 문서
  notes: 법령 의무(2026.3.31. 신설, 시행령 2026.9.30.). 다른 법률에 따른 통지를 했으면 통지한 것으로 간주. 개인정보 유출 통지와 항목이 비슷함 — PIPA-34과 관계, STD-26-01·STD-27-01과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: NET-48D-01
  title: 침해사고 원인 분석·재발 방지·자료 보전
  basis:
  - 법 제48조의4제1항·제2항·제5항·제6항(L1691-1696)
  requirement: 침해사고가 발생했거나 내부 유출 등 의심 정황으로 조사심의위원회가 조사 필요를 인정하면 원인을 분석하고 사고대응·복구·재발방지 조치를 해야 하며, 정부의 조치 명령·접속기록 등 자료 보전·제출 명령에 따라야 한다.
  applies_when: 정보통신서비스 제공자 등 정보통신망 운영자
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 침해사고 대장, 원인분석 보고서, 재발방지 대책 이행 기록, 접속기록 보존 정책.'
  pass: 사고별 원인분석·재발방지 기록이 있고 접속기록을 보전할 수 있음.
  fail: 분석·대책 기록 없음, 접속기록 미보존으로 원인 분석 불가.
  remediation: 침해사고 처리 절차에 원인분석 보고서 작성과 재발방지 이행 점검 단계를 넣고, 접속기록·보안장비 로그의 보존 기간을 정한다.
  evidence: 서면 문서
  notes: 법령 의무(명령 불이행 시 이행강제금, 법 제48조의7). 접속기록은 SAFE 항목과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: NET-48I-01
  title: 침해사고 관리·대응 매뉴얼 작성·제출
  basis:
  - 법 제48조의9제3항·제4항(L1849-1850)
  - 영 제60조의15(L1854-1867)
  - 과태료 법 제76조제3항제4호의5·제4호의6(L2625-2626)
  requirement: 영 제36조의7제1항제2호~제4호 해당 정보통신서비스 제공자는 표준안에 따라 조직체계·담당자·정보공유, 이용자 피해구제 조치, 예방 점검·대응체계, 정기 점검·현행화 방안을 담은 침해사고 관리·대응 매뉴얼을 작성해 과기정통부와 KISA에 제출하고, 새로 작성·변경할 때도 제출해야 한다.
  applies_when: 영 제36조의7제1항제2호~제4호 해당자
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 매뉴얼 문서(필수 4개 항목), 제출 증빙, 최근 개정 이력.'
  pass: 필수 항목을 갖춘 매뉴얼이 제출·현행화됨.
  fail: 미작성·미제출, 항목 누락, 변경 후 미제출.
  remediation: 과기정통부 표준안을 바탕으로 매뉴얼을 작성하고, 연 1회 이상 점검·개정 후 재제출하는 절차를 둔다.
  evidence: 서면 문서
  notes: 법령 의무(2026.3.31. 신설). 개인정보 유출 대응 매뉴얼(STD-29-01)과 통합 운영 가능.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: NET-48J-01
  title: 침해사고 이용자 피해구제·결과 제출
  basis:
  - 법 제48조의10제1항·제2항(L1871-1872)
  - 영 제60조의16(L1876-1880)
  requirement: 침해사고가 발생하면 이용자 피해 확산 방지와 신속한 피해구제 조치를 하고, 피해구제 조치 내용·대상·범위·결과를 침해사고 신고일부터 14일 이내(1회 14일 연장 가능) 과기정통부에 제출해야 한다.
  applies_when: 정보통신서비스 제공자
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 피해구제 절차, 사고별 피해구제 제출 기록(신고일 대비 제출일).'
  pass: 피해구제 절차가 있고 14일 이내 제출.
  fail: 절차 없음, 미제출·지연.
  remediation: 침해사고 대응 절차에 피해구제(보상 기준, 민원 창구) 단계와 "신고일+14일 제출" 기한 관리를 넣는다.
  evidence: 서면 문서
  notes: 법령 의무(2026.3.31. 신설). 이용자 통지 항목(NET-48C-02)에 피해구제 내용이 포함됨.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: NET-49B-01
  title: 피싱 등 속이는 행위 발견 시 신고·약관
  basis:
  - 법 제49조의2제1항·제2항·제5항·제6항(L1888-1899)
  - 영 제60조의17(L1903-1907)
  requirement: 누구든지 속이는 행위로 타인의 정보를 수집하거나 제공을 유인해서는 안 되며, 정보통신서비스 제공자는 그런 위반 사실을 발견하면 즉시 과기정통부 또는 KISA에 신고해야 한다. 정부 요청에 따라 접속경로 차단·이용자 통지 등을 하려면 약관에 조치 사유·내용, 중지 기간, 이의제기 절차, 통지 방법을 정해야 한다.
  applies_when: 모든 정보통신서비스 제공자(약관 사항은 해당 조치를 하는 자)
  type: 서면
  type_note: null
  location:
  - 서면
  - 이용약관
  method: '서면 확인: 자사 사칭 피싱 사이트·문자 발견 시 신고 절차와 이력. 브라우저 보조 확인: 약관에 피해예방 조치 조항이 있는지, 사이트에 "사칭 주의" 안내가 있는지.'
  pass: 사칭 탐지·신고 절차와 이력이 있음.
  fail: 발견 후 신고하지 않음, 절차 없음.
  remediation: 자사 사칭 도메인·문자 모니터링과 KISA(118, 보호나라) 즉시 신고 절차를 만들고, 공지사항에 사칭 주의 안내를 게시한다.
  evidence: 서면 문서
  notes: 신고는 법령 의무. 이 조는 점검 주체인 Claude가 로그인 화면 등을 다룰 때도 지켜야 하는 금지 규정이므로 점검 중 이용자 정보 유도 행위를 하지 않는다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: NET-50-01
  title: 광고성 정보 사전 수신동의(명시적·채널별)
  basis:
  - 법 제50조제1항(L1929-1931)
  - 영 제61조제1항(L1948)
  - 과태료 법 제76조제2항제7호(L2606)
  requirement: '전자적 전송매체(문자, 이메일, 앱 푸시, 메신저 등)로 영리목적 광고성 정보를 보내려면 수신자의 명시적인 사전 동의를 받아야 한다. 예외: 거래관계로 직접 연락처를 받은 자가 거래 종료일부터 6개월 이내에 같은 종류 재화·용역 광고를 보내는 경우, 방문판매법상 전화권유판매자가 수집출처를 육성으로 고지하는 경우.'
  applies_when: 광고성 정보를 전송하는 모든 자
  type: 관찰
  type_note: null
  location:
  - 회원가입 약관동의 화면
  - 마이페이지 수신설정
  - 이벤트·뉴스레터 신청 화면
  - 앱 푸시 설정
  method: (1) 회원가입 동의 화면에서 광고성 정보 수신동의가 필수 약관과 분리된 [선택] 항목인지, 기본값이 체크 해제인지 DOM(`input[type=checkbox]`의 `checked` 속성)으로 확인. (2) "전체 동의"에 광고 수신이 포함될 때 개별 해제가 가능한지 확인. (3) 채널(SMS·이메일·푸시)별 동의 선택이 가능한지 확인. (4) 마이페이지 수신설정 화면에서 현재 동의 상태와 채널 구분을 읽기만 함. 제출·저장은 하지 않음.
  pass: 광고 수신동의가 선택 항목으로 분리되고 기본 미체크, 채널별로 선택 가능, 동의하지 않아도 가입 가능.
  fail: 광고 수신이 필수 약관에 포함, 기본 체크, 미동의 시 가입 불가, 이용약관 동의만으로 광고 발송.
  remediation: 가입 화면에 "[선택] 광고성 정보 수신 동의 □ 문자 □ 이메일 □ 앱 푸시"를 필수 약관과 분리해 두고 기본값을 해제한다. 동의 문구에 "동의하지 않아도 회원가입·서비스 이용이 가능합니다"를 넣는다. 동의 일시·채널·방법을 DB에 기록해 2년 재확인(NET-50-07)과 처리결과 통지(NET-50-06)에 쓴다.
  evidence: 동의 화면 스크린샷, 체크박스 DOM 속성, 수신설정 화면(개인정보 마스킹 필요)
  notes: 법령 의무. 마케팅 목적 개인정보 이용 동의(PIPA 제22조)와 광고 수신동의(망법 제50조)는 별개이므로 둘 다 확인 — PIPA-22과 관계, STD-12-01과 관계. 거래관계 예외 적용 여부는 서면 확인 필요.
  category: 광고성 정보
  strength: 의무
  default_risk: 중
- id: NET-50-02
  title: 야간(21시~08시) 광고 전송 별도 동의
  basis:
  - 법 제50조제3항(L1933)
  - 영 제61조제2항(L1949)
  - 과태료 법 제76조제2항제7호
  requirement: 오후 9시부터 다음 날 오전 8시 사이에 광고성 정보를 보내려면 일반 수신동의와 별도로 사전 동의를 받아야 한다. 전자우편은 예외.
  applies_when: 문자·앱 푸시·메신저 등 전자우편 외 매체로 야간 광고를 보내는 자
  type: 관찰
  type_note: null
  location:
  - 회원가입 동의 화면
  - 앱 푸시 설정
  - 마이페이지 수신설정
  method: (1) 수신동의 화면·설정에 야간 수신동의 항목이 일반 광고 수신동의와 분리되어 있는지 확인. (2) 야간 동의 항목 기본값이 해제인지 DOM 확인. (3) 야간 동의 없이 야간 광고가 오는지는 사용자 수신 이력(문자·푸시 수신 시각 스크린샷)으로 확인.
  pass: 야간 수신동의가 별도 선택 항목으로 있거나, 야간에는 광고를 보내지 않는 정책이 서면으로 확인됨.
  fail: 야간 동의 항목 없이 야간 광고 발송, 일반 동의에 야간 동의를 포함.
  remediation: '"[선택] 야간(21:00~08:00) 광고성 정보 수신 동의" 항목을 따로 두고 기본 해제한다. 발송 시스템에서 야간 동의자 외에는 21시~08시 광고 발송을 차단하는 스케줄 제한을 건다.'
  evidence: 동의 화면 스크린샷, 사용자 제공 수신 이력(전화번호 등 마스킹)
  notes: 법령 의무. 앱 푸시도 전자적 전송매체에 포함(방송통신위원회 안내서 해석 — 원문 미제공).
  category: 광고성 정보
  strength: 의무
  default_risk: 중
- id: NET-50-03
  title: 수신거부·철회 후 전송 금지와 철회 방해 금지
  basis:
  - 법 제50조제2항, 제5항제1호(L1932, L1938)
  - 과태료 법 제76조제2항제7호
  requirement: 수신자가 수신거부 의사를 표시하거나 동의를 철회하면 광고를 보내서는 안 되고, 수신거부·철회를 회피·방해해서는 안 된다.
  applies_when: 광고성 정보를 전송하는 모든 자
  type: 능동
  type_note: null
  location:
  - 마이페이지 수신설정
  - 광고 메일의 수신거부 링크 랜딩 페이지
  - 앱 알림 설정
  method: '(1) 관찰: 마이페이지에서 수신설정 변경 메뉴가 쉽게 찾을 수 있는 위치(2단계 이내)에 있는지, 로그인 없이 수신거부 링크로 거부 가능한지, 거부 절차에 불필요한 추가 정보(비밀번호 재입력, 사유 필수 등)를 요구하는지 확인. (2) 능동(승인): 사용자 승인 후 테스트 계정에서 사용자가 직접 수신거부를 저장하고, Claude는 처리 결과 화면과 이후 광고 수신 여부(사용자 보고)를 기록.'
  pass: 철회 메뉴가 쉽게 접근 가능하고 즉시 반영, 철회 후 광고 미수신.
  fail: 철회 메뉴 없음·숨김, 고객센터 전화로만 가능, 철회 후에도 광고 수신, 철회 시 과도한 절차.
  remediation: 마이페이지 [알림/수신 설정]에 채널별 토글을 두고 저장 즉시 반영한다. 광고 메일·문자의 수신거부 링크는 로그인 없이 원클릭으로 처리되게 한다. 발송 직전 수신동의 상태를 다시 조회하는 로직을 넣는다.
  evidence: 수신설정 메뉴 경로 스크린샷, 철회 처리 화면(사용자 테스트 계정)
  notes: 법령 의무. 철회 저장은 데이터 변경이므로 테스트 계정·사용자 직접 입력·항목별 승인 원칙 적용.
  category: 광고성 정보
  strength: 의무
  default_risk: 중
- id: NET-50-04
  title: 광고성 정보 표시사항((광고)·전송자·수신거부 방법)
  basis:
  - 법 제50조제4항(L1934-1936)
  - 영 제61조제3항·별표 6(L1950)
  - 과태료 법 제76조제2항제8호(L2607)
  requirement: 광고성 정보에 전송자 명칭·연락처와 수신거부·수신동의 철회를 쉽게 할 수 있는 조치·방법을 구체적으로 밝혀야 한다(표시 위치·방법은 영 별표 6).
  applies_when: 광고성 정보를 전송하는 모든 자
  type: 관찰
  type_note: null
  location:
  - 사용자가 받은 광고 문자·이메일·앱 푸시 샘플
  - 웹 이메일 수신함(사용자 계정)
  method: '사용자에게 최근 광고 문자·이메일·푸시 샘플(스크린샷 또는 사용자가 연 이메일 화면)을 받아 (1) 시작 부분 "(광고)" 표시, (2) 전송자 명칭·연락처, (3) 수신거부 방법(문자: 무료 수신거부 전화번호, 이메일: 수신거부 링크) 표시를 확인한다. "(광고)" 표기를 "(광/고)", "(광 고)" 등으로 변칙 표기했는지 확인.'
  pass: 3개 요소가 모두 있고 "(광고)"가 정확히 표기됨.
  fail: '"(광고)" 누락·변칙 표기, 전송자·연락처 누락, 수신거부 방법 누락.'
  remediation: 문자는 "(광고)[회사명] 본문… 무료거부 080-XXX-XXXX", 이메일은 제목 맨 앞 "(광고)"와 본문 하단에 전송자 명칭·주소·전화번호·수신거부 링크, 앱 푸시는 "(광고)" 표시와 앱 내 수신거부 경로 안내를 넣는다. 발송 템플릿에 고정 문구를 넣어 누락을 막는다.
  evidence: 광고 샘플 스크린샷(수신자 번호·이메일 마스킹 필요)
  notes: 법령 의무. 영 별표 6 원문은 소스 파일에 수록되지 않음 — 위 표시 위치(문자 시작 "(광고)", 이메일 제목 앞 "(광고)", 080 무료거부)는 일반적으로 알려진 별표 6 및 방송통신위원회 안내서 내용이므로 현행 별표 원문 대조 필요. 브라우저로 직접 수신 확인이 어려워 사용자 제공 샘플에 의존.
  category: 광고성 정보
  strength: 의무
  default_risk: 중
- id: NET-50-05
  title: 수신거부·철회 비용 무료 제공
  basis:
  - 법 제50조제6항(L1943)
  - 영 제62조·별표 6(L1951)
  - 과태료 법 제76조제2항제9호(L2608)
  requirement: 수신자가 수신거부·동의 철회를 할 때 전화요금 등 비용을 부담하지 않도록 무료전화서비스 등을 광고에 명시해 제공해야 한다.
  applies_when: 광고성 정보를 전송하는 모든 자
  type: 관찰
  type_note: null
  location:
  - 광고 샘플
  - 수신거부 링크 랜딩 페이지
  method: 광고 샘플의 수신거부 수단이 080 무료전화·무료 회신·수신거부 링크 등 무료인지 확인한다. 유료 전화번호(일반 대표번호, 1588 등)만 있으면 취약.
  pass: 무료 수신거부 수단이 명시됨.
  fail: 유료 전화로만 거부 가능, 거부 시 데이터 요금이 드는 유료 앱 접속만 안내.
  remediation: 080 수신거부 번호를 개통해 문자 하단에 "무료거부 080-XXX-XXXX"로 적고, 이메일·푸시는 로그인 없는 수신거부 링크·앱 설정 경로를 제공한다.
  evidence: 광고 샘플 스크린샷(마스킹)
  notes: 법령 의무. 별표 6 원문 미수록(NET-50-04 비고와 같음).
  category: 광고성 정보
  strength: 의무
  default_risk: 중
- id: NET-50-06
  title: 수신동의·거부·철회 처리결과 14일 내 통지
  basis:
  - 법 제50조제7항(L1944)
  - 영 제62조의2(L1952-1955)
  - 과태료 법 제76조제4항제12호의3(L2654)
  requirement: 수신자가 수신동의·거부·철회 의사를 표시하면 그 날부터 14일 이내에 전송자 명칭, 동의·거부·철회 사실과 의사표시 날짜, 처리 결과를 알려야 한다.
  applies_when: 광고성 정보를 전송하려는 모든 자
  type: 능동
  type_note: null
  location:
  - 마이페이지 수신설정 저장 직후 화면
  - 사용자 이메일·문자
  method: '(1) 관찰: 회원가입 완료 화면·수신설정 저장 화면에 처리결과 안내(명칭·사실·날짜·결과)가 표시되는지 기존 화면으로 확인. (2) 능동(승인): 사용자가 테스트 계정으로 수신설정을 직접 변경하고, 14일 이내 통지(화면 팝업·이메일·문자)를 받았는지 사용자가 공유한 화면으로 확인.'
  pass: 동의·거부·철회 때마다 3개 항목이 담긴 통지가 14일 이내 발송.
  fail: 통지 없음, 날짜·전송자 명칭 누락.
  remediation: '수신설정 변경 시 "○○(주) 광고성 정보 수신 동의/거부 처리 안내: 2026년 ○월 ○일 문자 수신 거부 처리되었습니다" 메시지를 즉시 화면과 이메일·문자로 보내도록 구현한다. 회원가입 시 동의 결과도 같은 형식으로 통지한다.'
  evidence: 통지 화면·메시지 스크린샷(마스킹)
  notes: 법령 의무. 설정 변경은 데이터 변경이므로 사용자 직접 수행·승인 필요.
  category: 광고성 정보
  strength: 의무
  default_risk: 중
- id: NET-50-07
  title: 수신동의 2년마다 재확인
  basis:
  - 법 제50조제8항(L1945)
  - 영 제62조의3(L1957-1961)
  - 과태료 법 제76조제2항제9호의2(L2609)
  requirement: 사전 동의를 받은 자는 동의일부터 2년마다 수신동의 여부를 확인해야 하며, 확인 시 전송자 명칭, 수신동의 사실과 동의 날짜, 동의 유지·철회 의사표시 방법을 밝혀야 한다.
  applies_when: 광고 수신동의를 받은 모든 자
  type: 서면
  type_note: null
  location:
  - 서면
  - 마이페이지 수신설정(동의일자 표시)
  method: '서면 확인: 수신동의 재확인 발송 정책·발송 이력(대상자 동의일 대비 발송일), 안내 문구. 브라우저 보조 확인: 마이페이지에 동의 일자가 표시되는지(권고).'
  pass: 동의일 기준 2년 이내 재확인 안내가 3개 항목을 담아 발송됨.
  fail: 재확인 미실시, 항목 누락, 2년 초과.
  remediation: 동의 일자별로 2년 도래 전 자동 안내("○○(주)입니다. 고객님은 20○○년 ○월 ○일 광고성 정보 수신에 동의하셨습니다. 수신 유지·철회는 [마이페이지 > 수신설정] 또는 080-XXX에서 가능합니다")를 보내는 배치를 운영하고 발송 로그를 남긴다.
  evidence: 서면 문서, 안내 메시지 샘플(마스킹)
  notes: 법령 의무. 재확인에 응답이 없다고 동의가 자동 철회되는 것은 아님(조문상 확인 의무만 규정).
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: NET-50-08
  title: 광고 전송 금지행위(자동생성·출처은닉·기망)
  basis:
  - 법 제50조제5항제2호~제5호(L1939-1942)
  - 법 제50조의8(L2017)
  requirement: 연락처 자동 생성, 광고 목적 연락처 자동 등록, 전송자 신원·출처 은닉, 기망 회신 유도를 해서는 안 되며, 법률상 금지 재화·서비스 광고를 보내서는 안 된다.
  applies_when: 광고성 정보를 전송하는 모든 자
  type: 서면
  type_note: null
  location:
  - 서면
  - 광고 샘플
  method: '서면 확인: 광고 대상자 추출 기준(수신동의자만), 발신번호·발신 도메인 등록 현황. 광고 샘플에서 발신번호·발신 주소가 실제 사업자 것인지 확인.'
  pass: 수신동의 DB에서만 대상 추출, 발신 정보가 실제 사업자.
  fail: 구매·수집 목록·자동 생성 연락처로 발송, 발신 정보 은닉·위장.
  remediation: 발송 시스템이 수신동의 DB 외 연락처를 쓰지 못하게 제한하고, 발신번호 사전등록·이메일 SPF/DKIM 설정으로 발신 출처를 명확히 한다.
  evidence: 서면 문서
  notes: 법령 의무(과징금 대상, 법 제50조의9).
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: NET-50C-01
  title: 광고 전송 위탁 시 자격 확인·관리감독
  basis:
  - 법 제50조의3(L1971-1973)
  - 과태료 법 제76조제2항제9호의3(L2610)
  requirement: 문자 대량발송(전기통신사업법 제2조제14호나목 역무) 광고 전송을 위탁하려면 전송자격인증을 받은 자에게 위탁해야 하고, 위탁자는 수탁자가 제50조를 위반하지 않도록 관리·감독해야 한다. 수탁자는 손해배상 책임에서 위탁자 직원으로 본다.
  applies_when: 광고 문자·메시지 발송을 외부 업체에 위탁하는 자
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 발송 대행 계약서, 수탁자 전송자격인증 증빙, 위탁자의 관리·감독 기록(발송 내역 점검).'
  pass: 인증받은 수탁자, 계약상 법 준수 의무와 점검 기록.
  fail: 무인증 업체 위탁, 관리·감독 기록 없음.
  remediation: 발송 대행사 선정 시 전송자격인증서를 받고, 계약서에 수신동의·야간·표시의무 준수 조항을 넣으며 분기별 발송 내역을 점검한다.
  evidence: 서면 문서
  notes: 법령 의무(제1항은 2026.3.31. 신설). 개인정보 처리 위탁(PIPA 제26조)과 함께 관리 — PIPA-26과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: NET-50D-01
  title: 전송 역무 제공 거부 시 계약 명시·통지
  basis:
  - 법 제50조의4(L1978-1989)
  - 영 제62조의4(L1992)
  - 과태료 법 제76조제2항제9호의4(L2611)
  requirement: 메시지·메일 전송 역무를 제공하는 정보통신서비스 제공자가 광고로 인한 장애·수신 거부를 이유로 역무를 거부하려면 이용계약에 그 사항을 포함하고 이해관계인에게 알려야 하며, 자기 서비스가 불법 광고 전송에 이용되면 즉시 중단·계약 해지·취약점 개선 등 조치를 해야 한다.
  applies_when: 문자·메일 발송 서비스 등 전송 역무 제공자
  type: 서면
  type_note: null
  location:
  - 이용약관
  - 서면
  method: '이용약관에 역무 제공 거부 사유가 있는지 확인. 서면 확인: 불법 광고 이용 시 조치 기준(별표 6의2)과 조치 이력.'
  pass: 약관에 거부 사유 명시, 위반 이용 시 조치 기록.
  fail: 약관 근거 없이 거부, 불법 광고 이용 방치.
  remediation: 이용약관에 "스팸 전송 시 서비스 제한" 조항을 두고, 위반 탐지 시 즉시 발송 중단·고객 통지·재발방지 계획 절차를 운영한다.
  evidence: 약관 조항 스크린샷
  notes: 법령 의무. 일반 웹서비스는 해당없음(메시징 플랫폼 등만).
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: NET-50E-01
  title: 광고·개인정보 수집 프로그램 설치 시 동의·용도·삭제방법 고지
  basis:
  - 법 제50조의5(L1995)
  - 영 제63조(L1997)
  - 과태료 법 제76조제2항제10호(L2612)
  requirement: 광고가 보이게 하거나 개인정보를 수집하는 프로그램을 이용자 컴퓨터·휴대전화 등에 설치하려면 이용자 동의를 받고 프로그램의 용도와 삭제방법을 알려야 한다.
  applies_when: 사이트 이용 과정에서 설치형 프로그램(실행파일, 브라우저 확장, 툴바, 앱, 보안·인증 모듈)을 설치하게 하는 자
  type: 관찰
  type_note: null
  location:
  - 로그인·결제·본인확인 등 설치 유도 화면
  - 다운로드 안내 페이지
  method: 설치 유도 화면이 있으면 설치 전에 용도와 삭제방법 안내, 동의 절차가 있는지 페이지 텍스트로 확인한다(설치·다운로드는 하지 않음). 자동 다운로드가 시작되는지는 네트워크 요청 목록에서 확인.
  pass: 설치 전 동의, 용도·삭제방법 안내가 있음.
  fail: 안내·동의 없이 설치 유도 또는 자동 다운로드, 광고 모듈 끼워 설치.
  remediation: 설치 안내 화면에 "이 프로그램은 ○○ 용도로 사용되며, [제어판 > 프로그램 제거]에서 삭제할 수 있습니다. 설치에 동의하십니까?"를 표시하고 동의 버튼 후 다운로드를 시작한다. 광고·수집 모듈 동봉을 금지한다.
  evidence: 설치 안내 화면 스크린샷, 네트워크 요청 목록
  notes: 법령 의무. 웹페이지에 삽입된 스크립트·쿠키(트래커)는 "설치"로 보기 어려워 이 조 대상인지 해석이 갈림 — 트래커·쿠키는 PIPA 처리방침 항목(STD-19-01 제6호)으로 점검하고 이 항목은 설치형 프로그램에 한정할지 사용자 결정 필요.
  category: 광고성 정보
  strength: 의무
  default_risk: 중
