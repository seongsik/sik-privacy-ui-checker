- id: STD-04-01
  title: 개인정보 보호 원칙(최소수집·목적 제한·익명/가명 우선)
  basis:
  - 지침 제4조제1항~제7항
  - 원문 p.2
  requirement: 처리 목적을 명확히 하고 필요한 최소한만 적법·정당하게 수집하며, 목적 범위에서 정확성·최신성을 유지하고, 위험에 상응하는 보호조치를 하며, 처리방침 공개와 권리행사 절차를 마련하고, 사생활 침해를 최소화하며, 익명·가명으로 목적 달성이 가능하면 익명(불가 시 가명)으로 처리해야 한다.
  applies_when: 모든 개인정보처리자
  type: 관찰
  type_note: null
  location:
  - 회원가입
  - 주문·결제
  - 이벤트·문의 등 개인정보 입력 화면
  - 마이페이지
  - 처리방침 페이지
  method: '(1) 각 입력 화면의 필수 표시(*, required 속성) 항목을 DOM으로 목록화하고 화면 목적(가입·배송·문의)에 비해 과도한 필수 항목(예: 문의에 생년월일·주소 필수, 가입에 직업·결혼여부 필수)이 있는지 판단. (2) 처리방침의 수집 항목·목적과 실제 입력 항목이 일치하는지 대조. (3) 목록·조회 화면에서 업무에 불필요한 정보까지 전체 표시되는지 확인(마스킹은 SAFE 항목). 값 입력·제출은 하지 않음.'
  pass: 필수 항목이 목적에 필요한 최소한이고, 선택 항목은 선택으로 표시되며 처리방침과 일치.
  fail: 목적과 무관한 항목을 필수로 수집, 처리방침에 없는 항목 수집, 선택 항목을 필수처럼 강제.
  remediation: '화면별로 "항목-목적-필수 여부" 표를 만들어 불필요 항목을 제거하거나 선택으로 바꾼다(예: 문의 양식은 이름·연락처·내용만 필수). 선택 항목에는 "[선택]" 표시와 "입력하지 않아도 서비스 이용 가능" 안내를 둔다. 분석·통계 목적은 가명·익명 데이터로 처리하는 정책을 내부관리계획에 넣는다.'
  evidence: 입력 화면 스크린샷, required 속성 목록, 처리방침 수집항목 부분
  notes: 고시 원칙 조항(제재 직접 근거는 법 제3조·제16조). PIPA-03·PIPA-16과 관계. 최소수집 판단은 서비스 맥락에 따라 달라 "의견" 수준 판정이 될 수 있음.
  category: 동의·고지
  strength: 의무
  default_risk: 중
- id: STD-06-01
  title: 수집·이용의 적법 근거
  basis:
  - 지침 제6조제1항·제2항
  - 원문 p.3
  requirement: 개인정보는 동의, 법률 규정, 법령상 의무 이행, 공공기관 소관업무, 계약 체결·이행, 급박한 생명·신체·재산 이익, 명백히 우선하는 정당한 이익, 공중위생 등 긴급의 8개 근거 중 하나가 있을 때만 수집하고 수집 목적 범위에서 이용해야 한다.
  applies_when: 모든 개인정보처리자
  type: 관찰
  type_note: null
  location:
  - 처리방침 페이지
  - 회원가입 동의 화면
  method: 처리방침에서 처리 목적·항목별 법적 근거(동의/계약/법령 등)가 적혀 있는지 확인하고, 동의 화면에서 동의 대상이 아닌 항목(계약 이행 필수 정보)까지 동의를 받는지, 반대로 동의가 필요한 항목(마케팅 등)을 근거 없이 처리하는지 대조한다. 실제 근거 적합성은 서면 확인.
  pass: 항목별 근거가 구분되어 공개되고 동의 화면과 일치.
  fail: 근거 불명확, 동의 필요 항목을 동의 없이 처리.
  remediation: 처리방침에 "처리 목적 | 항목 | 근거(법 제15조제1항 제○호)" 표를 둔다. 계약 이행에 필수인 정보는 동의 대신 근거를 고지하고, 마케팅·맞춤형 광고 등은 별도 선택 동의로 받는다.
  evidence: 처리방침 해당 표 스크린샷, 동의 화면
  notes: 법령 의무(법 제15조). 2023 개정 법은 계약 이행 등에 동의를 받지 않도록 하고 있음 — PIPA-15과 관계, STD-12-04과 관계.
  category: 동의·고지
  strength: 의무
  default_risk: 중
- id: STD-06-02
  title: 명함·공개 매체·대리인 정보의 이용 범위
  basis:
  - 지침 제6조제3항~제5항
  - 원문 p.3
  requirement: 명함 등으로 받은 정보와 인터넷 홈페이지 등 공개된 매체·장소에서 수집한 정보는 사회통념상 동의 의사가 있다고 인정되는 범위에서만 이용하고, 대리인의 개인정보는 대리권 확인 목적으로만 수집·이용해야 한다.
  applies_when: 해당 방식으로 수집하는 개인정보처리자
  type: 서면
  type_note: null
  location:
  - 대리인 신청 화면(있는 경우)
  - 서면
  method: '서면 확인: 명함·공개정보로 수집한 DB의 이용 현황(예: 공개 이메일로 광고 발송 여부). 브라우저 보조 확인: 대리인 신청 화면이 있으면 대리인 항목이 대리권 확인에 필요한 최소(성명·관계·연락처, 위임장)인지 확인.'
  pass: 공개·명함 정보를 수집 맥락 내에서만 이용, 대리인 정보 최소 수집.
  fail: 공개된 이메일·명함으로 광고 발송, 대리인 정보를 다른 목적에 사용.
  remediation: 공개 수집 정보의 이용 범위를 내부 지침으로 정하고, 광고 발송 DB에서 명함·공개 수집 연락처를 제외한다. 대리인 신청 양식은 대리권 확인 항목만 둔다.
  evidence: 서면 문서, 대리인 신청 화면 스크린샷
  notes: 고시 의무. 광고 발송은 NET-50-01(사전 수신동의)과도 관계. PIPA-15과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-07-01
  title: 제3자 제공·목적 외 제공 시 제공받는 자 명칭·연락처 고지
  basis:
  - 지침 제7조제3항, 제8조제3항
  - 원문 p.4
  requirement: 제3자 제공 동의(법 제17조제2항제1호) 또는 목적 외 제공 동의(법 제18조제3항제1호)를 받으면서 제공받는 자를 알릴 때 성명(법인·단체는 명칭)과 연락처를 함께 알려야 한다.
  applies_when: 제3자 제공 동의를 받는 개인정보처리자
  type: 관찰
  type_note: null
  location:
  - 회원가입·주문·이벤트의 제3자 제공 동의 화면
  - 처리방침 제3자 제공 조항
  method: 제3자 제공 동의 문구에 제공받는 자의 명칭과 연락처(전화번호 등)가 모두 있는지 확인한다. "제휴사", "협력업체 등" 같은 포괄 표현만 있는지 확인.
  pass: 제공받는 자 명칭·연락처가 개별로 명시.
  fail: 명칭 누락·포괄 표현, 연락처 누락.
  remediation: '동의 표를 "제공받는 자: ○○보험(주), 연락처 1588-XXXX | 목적 | 항목 | 보유기간 | 동의 거부 권리 및 불이익"으로 바꾸고, 제공받는 자가 많으면 목록 링크를 동의 화면 안에 둔다.'
  evidence: 동의 화면 스크린샷
  notes: 고시 의무(법 제17조제2항 고지사항 보완). PIPA-17·PIPA-18과 관계.
  category: 동의·고지
  strength: 의무
  default_risk: 중
- id: STD-08-01
  title: 목적 외 제공 시 보호조치 요청·책임관계 명확화
  basis:
  - 지침 제8조제1항·제2항
  - 원문 p.4
  requirement: 법 제18조제2항에 따라 목적 외로 제3자에게 제공할 때는 제공받는 자에게 이용 목적·방법·기간·형태 제한이나 안전성 확보 조치를 문서로 요청하고, 안전성 확보 책임관계를 명확히 해야 한다. 요청받은 자는 조치 후 문서로 회신해야 한다.
  applies_when: 목적 외 제공을 하는 개인정보처리자
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 목적 외 제공 건별 요청 문서, 제공받은 자의 회신 문서, 책임관계 정한 문서.'
  pass: 건별 요청·회신 문서가 있음.
  fail: 문서 없이 제공.
  remediation: 목적 외 제공 절차서에 "제한·보호조치 요청 공문 발송 → 회신 수령 → 대장 기록" 단계를 넣고 양식을 만든다.
  evidence: 서면 문서
  notes: 고시 의무. PIPA-18과 관계, 공공기관은 STD-59-01과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-09-01
  title: 수집 출처 통지 요구 시 3일 이내 통지
  basis:
  - 지침 제9조
  - 원문 p.4
  requirement: 정보주체 외로부터 수집한 개인정보에 대해 정보주체가 요구하면 3일 이내에 수집 출처, 처리 목적, 처리정지 요구권을 알려야 하며, 예외 사유로 거부하면 3일 이내에 거부 근거와 사유를 알려야 한다.
  applies_when: 정보주체 이외로부터 개인정보를 수집하는 개인정보처리자
  type: 서면
  type_note: null
  location:
  - 처리방침 페이지
  - 서면
  method: '서면 확인: 수집출처 통지 요구 처리 절차·처리 기록(요구일 대비 통지일). 브라우저 보조 확인: 처리방침에 제3자로부터 수집하는 항목과 출처 안내가 있는지.'
  pass: 3일 이내 처리 절차와 기록이 있음.
  fail: 절차 없음, 3일 초과.
  remediation: 고객 요청 접수 시스템에 "수집출처 통지" 유형과 3일 기한 알림을 두고 통지 문안을 준비한다.
  evidence: 서면 문서
  notes: 고시 의무(법 제20조 보완 — 법은 "즉시"). PIPA-20과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-12-01
  title: 동의 사항 구분·명확한 고지
  basis:
  - 지침 제12조제1항·제3항
  - 원문 p.5
  requirement: 동의를 받을 때 각각의 동의 사항을 구분해 명확히 인지할 수 있게 알리고, 법 제22조제1항 각 호(제3자 제공, 목적 외 이용, 민감정보, 고유식별정보, 마케팅 등)에 해당하면 동의 사항을 구분해 각각 동의를 받아야 한다.
  applies_when: 동의를 받는 모든 개인정보처리자
  type: 관찰
  type_note: null
  location:
  - 회원가입 약관동의 화면
  - 주문·결제 동의
  - 이벤트 응모 동의
  - 앱 가입 화면
  method: 동의 화면의 체크박스 구성을 DOM으로 확인해 이용약관·개인정보 수집이용(필수)·수집이용(선택)·제3자 제공·마케팅·민감정보·고유식별정보가 각각 별도 체크박스인지, 각 항목 내용을 펼쳐 볼 수 있는지 확인한다.
  pass: 동의 사항별 개별 체크박스와 내용 표시.
  fail: 여러 동의를 한 체크박스로 묶음, "약관 및 개인정보처리방침에 동의" 하나로 통합, 내용 확인 불가.
  remediation: 동의 화면을 "[필수] 이용약관 / [필수] 개인정보 수집·이용 / [선택] 개인정보 수집·이용 / [선택] 제3자 제공 / [선택] 마케팅 활용 / [선택] 광고성 정보 수신"으로 분리하고 각 항목에 [보기] 펼침을 둔다. "전체 동의"는 편의 기능으로만 두고 개별 해제 가능하게 한다.
  evidence: 동의 화면 스크린샷, 체크박스 DOM 구조
  notes: 법령·고시 의무. PIPA-22과 관계, NET-50-01(광고 수신동의 별도)과 관계.
  category: 동의·고지
  strength: 의무
  default_risk: 중
- id: STD-12-02
  title: 유효한 동의의 4가지 조건
  basis:
  - 지침 제12조제2항
  - 원문 p.5
  requirement: 동의는 (1) 자유로운 의사로 결정 가능, (2) 동의 내용이 구체적·명확, (3) 쉽게 읽고 이해할 수 있는 문구, (4) 동의 여부를 명확히 표시할 수 있는 방법 제공 — 네 조건을 모두 갖춰야 한다.
  applies_when: 동의를 받는 모든 개인정보처리자
  type: 관찰
  type_note: null
  location:
  - 모든 동의 화면
  method: (1) 선택 동의 체크박스가 기본 체크(`checked`)인지 확인. (2) 동의 문구가 "등", "기타" 위주로 모호한지 확인. (3) 글자 크기가 지나치게 작거나(계산된 font-size) 스크롤 박스에 숨어 있는지 확인. (4) 동의/미동의를 선택할 수단이 있는지, 미동의 시 진행이 막히는지(선택 항목) 확인. 제출은 하지 않음.
  pass: 기본 미체크, 구체적 문구, 읽기 쉬운 표시, 명확한 선택 수단.
  fail: 선택 동의 기본 체크, 모호한 포괄 문구, 동의 거부 수단 없음, 다크패턴(거부 버튼을 흐리게·숨김).
  remediation: 선택 동의 기본값을 해제하고, 목적·항목은 "등" 없이 구체적으로 열거하며, 본문 글자 크기를 화면 기본 크기 이상으로 맞춘다. 동의·미동의 버튼을 같은 크기·대비로 둔다.
  evidence: 동의 화면 스크린샷, checked 속성·font-size 값
  notes: 고시 의무(법 제22조, 영 제17조와 같은 취지). 문구의 구체성·가독성 판정은 정성 판단 — 개인정보 처리 동의 안내서(원문 미제공)의 기준과 함께 보는 것이 좋음. PIPA-22과 관계.
  category: 동의·고지
  strength: 의무
  default_risk: 중
- id: STD-12-03
  title: 선택 동의 거부 가능 사실 명시
  basis:
  - 지침 제12조제4항
  - 원문 p.5
  requirement: 구분해 동의를 받는 경우 정보주체에게 동의 또는 동의 거부를 선택할 수 있음을 명시적으로 알려야 한다.
  applies_when: 동의를 받는 모든 개인정보처리자
  type: 관찰
  type_note: null
  location:
  - 모든 동의 화면
  method: 각 동의 항목에 "동의를 거부할 권리가 있으며, 거부 시 ○○ 이용이 제한됩니다(또는 제한 없음)" 취지 문구가 있는지 확인한다.
  pass: 동의 항목별 거부 권리와 거부 시 불이익이 명시됨.
  fail: 거부 권리 안내 없음, 불이익을 실제보다 과장.
  remediation: 동의 항목마다 "귀하는 동의를 거부할 수 있습니다. 다만 [필수] 항목 거부 시 회원가입이 제한되며, [선택] 항목 거부 시에도 서비스 이용은 가능합니다" 문구를 넣는다.
  evidence: 동의 화면 스크린샷
  notes: 고시 의무(법 제15조제2항제4호 고지사항과 겹침). PIPA-15·PIPA-22과 관계.
  category: 동의·고지
  strength: 의무
  default_risk: 중
- id: STD-12-04
  title: 동의 없이 처리하는 개인정보의 항목·근거 구분 공개
  basis:
  - 지침 제12조제5항
  - 원문 p.5
  requirement: 동의 없이 처리할 수 있는 개인정보는 그 항목과 처리의 법적 근거를 동의받아 처리하는 개인정보와 구분해 처리방침에 공개하거나 서면등의 방법으로 알려야 하며, 동의 없이 처리할 수 있다는 입증책임은 처리자에게 있다.
  applies_when: 동의 없이 개인정보를 처리하는 모든 개인정보처리자
  type: 관찰
  type_note: null
  location:
  - 처리방침 페이지
  - 회원가입 안내 화면
  method: 처리방침에서 동의 기반 항목과 계약·법령 등 동의 외 근거 항목이 구분되어 항목·근거가 표시되는지 확인한다.
  pass: 동의/비동의 근거별로 항목이 구분 공개됨.
  fail: 구분 없음, 동의 없이 처리하는 항목의 근거 미기재.
  remediation: '처리방침에 "① 동의 없이 처리하는 개인정보(계약 이행: 이름·연락처·배송지, 법령: 전자상거래법상 거래기록) ② 동의를 받아 처리하는 개인정보(선택: 생년월일 등)"처럼 구분 표를 둔다.'
  evidence: 처리방침 해당 부분 스크린샷
  notes: 고시 의무. PIPA-22(제22조제3항)·PIPA-30과 관계.
  category: 동의·고지
  strength: 의무
  default_risk: 중
- id: STD-12-05
  title: 전화 동의 녹취 사실 고지
  basis:
  - 지침 제12조제6항
  - 원문 p.5
  requirement: 전화로 동의를 받으면서 통화 내용을 녹취할 때는 녹취 사실을 알려야 한다.
  applies_when: 전화(콜센터)로 동의를 받는 개인정보처리자
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 콜센터 스크립트에 녹취 고지 문구가 있는지, 녹취 파일 샘플.'
  pass: 녹취 전 고지 문구가 스크립트에 있음.
  fail: 고지 없이 녹취.
  remediation: 콜센터 인사말 스크립트에 "서비스 품질 향상과 동의 확인을 위해 통화 내용이 녹음됩니다"를 넣는다.
  evidence: 서면 문서
  notes: 고시 의무. 웹 점검 대상 아님.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-12-06
  title: 친목단체 운영 목적의 동의 없는 수집 범위
  basis:
  - 지침 제12조제7항
  - 원문 p.5
  requirement: 친목단체 운영 목적으로는 가입용 성명·연락처·회칙상 관련 인적사항, 회비 납부현황, 활동 참석·내용, 구성원이 알리기 원하는 생일·애경사 등만 동의 없이 수집·이용할 수 있다.
  applies_when: 동호회·동창회 등 친목단체(인터넷 커뮤니티 포함) 운영자
  type: 서면
  type_note: null
  location:
  - 커뮤니티 가입 화면(해당 시)
  - 서면
  method: '서면 확인: 친목단체 명목으로 동의 없이 수집하는 항목이 위 범위를 넘는지. 커뮤니티 가입 화면이 있으면 항목을 관찰.'
  pass: 허용 범위 내 항목만 동의 없이 수집.
  fail: 허용 범위를 넘는 항목(주민등록번호, 재산 등)을 동의 없이 수집.
  remediation: 범위를 넘는 항목은 별도 동의를 받거나 수집하지 않는다.
  evidence: 서면 문서
  notes: 고시상 특례(허용 규정)이며 범위 초과 시 위반. 일반 웹서비스는 대부분 해당없음.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-12-07
  title: 동의서 작성 시 개인정보 처리 동의 안내서 준수
  basis:
  - 지침 제12조제8항
  - 원문 p.5
  requirement: 동의서를 작성할 때는 개인정보 처리 동의 안내서를 준수해야 한다.
  applies_when: 동의서를 작성하는 모든 개인정보처리자
  type: 관찰
  type_note: null
  location:
  - 모든 동의 화면
  method: 동의 화면이 안내서의 형식(중요 내용 강조, 필수·선택 구분, 항목별 표 형식 고지)을 따르는지 STD-12-01~03 결과와 함께 종합 판단한다.
  pass: 안내서 형식 준수.
  fail: 안내서 형식과 다르게 장문 약관에 동의 사항을 묻어 둠.
  remediation: 개인정보 처리 동의 안내서의 표준 동의서 양식(목적·항목·보유기간·거부권 표, 중요사항 굵게·밑줄 강조)으로 동의 화면을 다시 만든다.
  evidence: 동의 화면 스크린샷
  notes: 고시 의무이나 세부 기준은 "개인정보 처리 동의 안내서"(원문 미제공)에 있음 — 구체 판정 기준은 안내서 추가 확보 필요. 중요내용 강조 표시 의무는 영 제17조제3항 — PIPA-22과 관계.
  category: 동의·고지
  strength: 의무
  default_risk: 중
- id: STD-13-01
  title: 14세 미만 아동의 법정대리인 정보 수집 시 고지
  basis:
  - 지침 제13조제1항
  - 원문 p.5
  requirement: 법정대리인 동의를 받기 위해 법정대리인의 성명·연락처를 아동에게서 수집할 때는 아동에게 처리자의 신분·연락처와 법정대리인 정보를 수집하는 이유를 알려야 한다.
  applies_when: 만 14세 미만 아동의 개인정보를 처리하는 개인정보처리자
  type: 관찰
  type_note: null
  location:
  - 회원가입(14세 미만 가입 분기)
  - 법정대리인 동의 화면
  method: 가입 첫 단계에서 14세 미만 선택 경로가 있는지, 법정대리인 정보 입력 화면에 처리자 명칭·연락처와 수집 이유 안내가 있는지 관찰한다(입력·제출하지 않음). 14세 미만 가입을 막는 서비스면 그 차단 방식을 기록.
  pass: 수집 이유와 처리자 신분·연락처를 아동이 이해하기 쉽게 안내.
  fail: 안내 없이 법정대리인 정보 입력 요구, 14세 미만 여부 확인 없음.
  remediation: 법정대리인 정보 입력 화면에 "○○(주, 연락처 ○○)는 만 14세 미만 회원 가입을 위해 보호자 동의를 받아야 합니다. 보호자 이름과 연락처는 동의를 받는 데만 사용합니다" 같은 아동 눈높이 문구를 둔다.
  evidence: 화면 스크린샷
  notes: 고시 의무. 아동에게 알리는 문구는 알기 쉬운 표현 요구(법 제22조의2제3항) — PIPA-22B과 관계.
  category: 동의·고지
  strength: 의무
  default_risk: 중
- id: STD-13-02
  title: 법정대리인 정보의 목적 제한·5일 내 파기
  basis:
  - 지침 제13조제2항
  - 원문 p.5~6
  requirement: 법정대리인 동의를 위해 수집한 법정대리인 정보는 동의 취득 목적으로만 이용하고, 동의 거부 또는 동의 의사 미확인 시 수집일부터 5일 이내에 파기해야 한다.
  applies_when: 만 14세 미만 아동의 개인정보를 처리하는 개인정보처리자
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 법정대리인 동의 대기 데이터의 자동 파기 설정(5일), 파기 기록.'
  pass: 미확인·거부 시 5일 내 자동 파기.
  fail: 파기 기한 없음, 법정대리인 연락처를 마케팅 등에 사용.
  remediation: 동의 대기 테이블에 수집일을 저장하고 5일 경과 미확인 건을 매일 파기하는 배치를 운영하며 파기 로그를 남긴다.
  evidence: 서면 문서
  notes: 고시 의무. PIPA-22B·PIPA-21과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-14-01
  title: 사전 동의 없이 처리한 후 사유 해소 시 중단·사후 고지
  basis:
  - 지침 제14조
  - 원문 p.6
  requirement: 급박한 생명·신체·재산 이익을 위해 동의 없이 수집·이용·제공한 경우 그 사유가 해소되면 처리를 즉시 중단하고, 동의 없이 처리한 사실·사유·이용내역을 정보주체에게 알려야 한다.
  applies_when: 해당 사유로 동의 없이 처리한 개인정보처리자
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 긴급 처리 사례 대장, 처리 중단·사후 통지 기록.'
  pass: 사례별 중단·통지 기록.
  fail: 사유 해소 후에도 계속 처리, 통지 없음.
  remediation: 긴급 처리 절차에 "사유 해소 확인 → 처리 중단 → 정보주체 통지(사실·사유·이용내역)" 단계를 둔다.
  evidence: 서면 문서
  notes: 고시 의무. PIPA-15·PIPA-18과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-15-01
  title: 개인정보취급자 최소화·권한 차등·보안서약·권한 회수
  basis:
  - 지침 제15조제1항~제3항
  - 원문 p.6
  requirement: 개인정보취급자를 업무상 필요한 최소 인원으로 두고 처리 범위를 최소로 제한하며, 처리시스템 접근권한을 업무 성격에 따라 차등 부여·관리하고, 보안서약서를 받는 등 관리·감독하며, 인사이동 시 접근권한을 변경·말소해야 한다.
  applies_when: 모든 개인정보처리자
  type: 서면
  type_note: null
  location:
  - 관리자 화면(권한 관리 메뉴)
  - 서면
  method: '서면 확인: 개인정보취급자 목록, 권한 부여·변경·말소 기록, 보안서약서, 인사이동자 권한 회수 기록. 관리자 계정 화면을 사용자가 열어 주면 권한 그룹(역할별 메뉴 차등)이 있는지 관찰(설정 변경 금지).'
  pass: 역할별 차등 권한, 서약서 징구, 이동·퇴직 시 지체 없는 권한 회수 기록.
  fail: 공용 관리자 계정, 전원 동일 최고 권한, 퇴직자 계정 잔존, 서약서 없음.
  remediation: 관리자 권한을 역할(조회·수정·다운로드·관리자)로 나누고 업무별 최소 권한을 배정한다. 인사 시스템과 연동해 이동·퇴직 시 권한을 즉시 회수하고 분기별 권한 검토를 한다. 취급자 전원에게 보안서약서를 받는다.
  evidence: 서면 문서, 관리자 권한 화면 스크린샷(개인정보 마스킹)
  notes: 고시 의무. 접근권한 관리 세부(기록 3년 보관 등)는 안전성 확보조치 기준 — SAFE 항목과 관계, PIPA-28·PIPA-29과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-16-01
  title: 수탁자 선정 시 보호 역량 고려
  basis:
  - 지침 제16조
  - 원문 p.6
  requirement: 처리 업무를 위탁할 때 수탁자의 인력·물적 시설, 재정 부담 능력, 기술 보유 정도, 책임능력 등 보호 역량을 종합 고려해 선정해야 한다.
  applies_when: 개인정보 처리를 위탁하는 개인정보처리자
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 수탁자 선정 평가표·보안 역량 검토 기록.'
  pass: 선정 시 보호 역량 평가 기록 존재.
  fail: 가격만으로 선정, 평가 기록 없음.
  remediation: 수탁자 선정 평가표에 보안 인증 보유, 보호조치 수준, 사고 이력, 재정 건전성 항목을 넣고 평가 결과를 보관한다.
  evidence: 서면 문서
  notes: 고시 의무. PIPA-26과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-17-01
  title: 수탁자의 안전성 확보조치
  basis:
  - 지침 제17조
  - 원문 p.6
  requirement: 수탁자는 위탁받은 개인정보 보호를 위해 「개인정보의 안전성 확보조치 기준」에 따른 관리적·기술적·물리적 조치를 해야 한다.
  applies_when: 수탁자(위탁자는 관리·감독 의무)
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 위탁계약서의 안전조치 조항, 수탁자 점검 결과(연 1회 이상 등).'
  pass: 계약에 안전조치 의무가 있고 위탁자 점검 기록 존재.
  fail: 계약 조항 없음, 점검 기록 없음.
  remediation: 위탁계약서에 안전성 확보조치 기준 준수 조항을 넣고 연 1회 이상 수탁자 점검표로 점검·개선 요구한다.
  evidence: 서면 문서
  notes: 고시 의무. PIPA-26·PIPA-29과 관계, SAFE 항목과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-18-01
  title: 처리방침 작성 기준(구분·알기 쉬운 용어·최소수집 명시)
  basis:
  - 지침 제18조제1항·제2항
  - 원문 p.6
  requirement: 처리방침은 법 제30조제1항 각 호와 영 제31조제1항 각 호 사항을 명시적으로 구분해 알기 쉬운 용어로 구체적·명확하게 작성하고, 처리하는 개인정보가 목적에 필요한 최소한이라는 점을 밝혀야 한다.
  applies_when: 모든 개인정보처리자
  type: 관찰
  type_note: null
  location:
  - 처리방침 페이지
  method: 처리방침 텍스트에서 법정 사항이 조항별로 구분되어 있는지(목차·제목), 전문용어·포괄 표현("등") 남용 여부, 최소 수집 취지 문구가 있는지 확인한다.
  pass: 사항별 구분, 구체적 표현, 최소수집 명시.
  fail: 구분 없이 장문 서술, 포괄 표현 위주, 최소수집 언급 없음.
  remediation: 처리방침 상단에 목차와 요약(라벨링)을 두고 조항별 제목을 붙인다. "회사는 서비스 제공에 필요한 최소한의 개인정보만 수집합니다" 문구를 넣고 항목은 구체적으로 열거한다.
  evidence: 처리방침 스크린샷
  notes: 고시 의무. PIPA-30과 관계.
  category: 처리방침·권리보장
  strength: 의무
  default_risk: 중
- id: STD-19-01
  title: 처리방침 필수 기재사항
  basis:
  - 지침 제19조제1호~제17호
  - 원문 p.6~7
  requirement: 처리방침에 (1) 처리 목적, (2) 처리 항목, (3) 처리·보유 기간, (4) 제3자 제공(해당 시), (5) 추가 이용·제공 판단기준(해당 시), (6) 쿠키 등 자동수집장치 설치·운영·거부(해당 시), (7) 파기절차·방법(법령 보존 시 근거·항목 포함), (8) 민감정보 공개 가능성·비공개 선택 방법(해당 시), (9) 처리 위탁(해당 시), (10) 가명정보 처리(해당 시), (11) 안전성 확보조치, (12) 처리방침 변경, (13) 보호책임자 성명 또는 담당 부서·연락처, (14) 국내대리인(해당 시), (15) 정보주체·법정대리인 권리와 행사방법, (16) 열람청구 접수·처리 부서, (17) 권익침해 구제방법을 모두 포함해야 한다.
  applies_when: 모든 개인정보처리자(해당 시 항목은 조건부)
  type: 관찰
  type_note: null
  location:
  - 처리방침 페이지
  - 전 화면(쿠키 사용 여부 확인용)
  method: '(1) 처리방침 텍스트에서 17개 항목 체크리스트로 유무 확인. (2) 조건부 항목 판단: `document.cookie`·localStorage와 네트워크 요청에서 분석·광고 스크립트(예: 외부 태그) 사용이 보이면 제6호 기재 필수, 제3자 제공 동의 화면이 있으면 제4호, 외부 결제·배송·클라우드 연동이 보이면 제9호 필수로 판단. (3) 처리방침의 위탁·제3자 목록과 실제 관찰된 외부 도메인 전송을 대조.'
  pass: 17개 항목 중 해당 항목이 모두 있고 실제 처리와 일치.
  fail: 필수 항목 누락, 쿠키를 쓰면서 제6호 누락, 관찰된 외부 전송(위탁·제공)이 처리방침에 없음.
  remediation: 보호위원회 처리방침 작성지침 목차에 맞춰 누락 항목을 추가한다. 쿠키 조항에는 사용 목적, 브라우저별 거부 방법(설정 경로), 거부 시 불편을 적는다. 신규 외부 연동 배포 시 처리방침 위탁·제공 목록을 갱신하는 체크리스트를 둔다.
  evidence: 처리방침 항목 체크리스트, 관찰된 외부 도메인·쿠키 목록(값 제외)
  notes: 고시 의무(법 제30조·영 제31조와 같은 내용을 고시가 정리). PIPA-30과 관계, 국내대리인은 NET-32E-01과 관계.
  category: 처리방침·권리보장
  strength: 의무
  default_risk: 중
- id: STD-20-01
  title: 처리방침 공개 방법(명칭·구분 표시·지속 게재)
  basis:
  - 지침 제20조제1항~제3항
  - 원문 p.7
  requirement: 처리방침은 인터넷 홈페이지에 지속적으로 게재하고, "개인정보 처리방침"이라는 명칭을 쓰며, 글자 크기·색상 등으로 다른 고지사항과 구분해 쉽게 확인할 수 있게 해야 한다. 홈페이지가 없거나 관리상 하자가 있으면 영 제31조제3항 방법(사업장 게시, 관보·신문, 간행물 등)으로 공개하고 간행물 등은 발행 때마다 게재한다.
  applies_when: 모든 개인정보처리자
  type: 관찰
  type_note: null
  location:
  - 전 화면 하단(푸터)
  - 앱 설정 메뉴
  - 처리방침 페이지
  method: (1) 메인 및 주요 하위 페이지 하단에 "개인정보 처리방침" 링크가 있는지 확인(명칭이 "개인정보보호정책", "Privacy" 등 다른 명칭이 아닌지). (2) 읽기 전용 JS로 해당 링크와 인접 링크(이용약관 등)의 계산된 font-weight·color를 비교해 구분 표시 여부 확인. (3) 링크가 정상 열리는지(404 아님), 로그인 없이 볼 수 있는지 확인.
  pass: 모든 페이지에서 "개인정보 처리방침" 명칭 링크가 굵게·다른 색 등으로 구분 표시되고 로그인 없이 열림.
  fail: 링크 없음·일부 페이지 누락, 명칭 상이, 다른 링크와 동일 스타일, 로그인해야 열람 가능, 링크 깨짐.
  remediation: '공통 푸터에 "개인정보 처리방침" 링크를 두고 `font-weight:700`과 구분 색상(예: 강조색)을 적용한다. 앱은 설정 메뉴와 가입 화면에 같은 명칭으로 링크한다.'
  evidence: 푸터 스크린샷, 링크 텍스트와 계산된 스타일 값
  notes: 고시 의무(명칭·구분 표시는 이 고시가 구체화). 제2항·제3항은 홈페이지 미운영·하자 시에만 해당. PIPA-30과 관계.
  category: 처리방침·권리보장
  strength: 의무
  default_risk: 중
- id: STD-21-01
  title: 처리방침 변경 시 변경 전·후 비교 공개
  basis:
  - 지침 제21조
  - 원문 p.7
  requirement: 처리방침을 변경하면 변경 및 시행 시기, 변경 내용을 지속적으로 공개하고, 변경 전·후를 비교해 쉽게 확인할 수 있게 공개해야 한다.
  applies_when: 처리방침을 변경한 개인정보처리자
  type: 관찰
  type_note: null
  location:
  - 처리방침 페이지(시행일
  - 이전 버전 선택)
  - 공지사항
  method: 처리방침에 시행일자 표시가 있는지, 이전 버전을 열람할 수 있는 목록·드롭다운이 있는지, 최근 변경에 대한 변경 전·후 대비표가 공개되어 있는지 확인한다.
  pass: 시행일 표시, 이전 버전 열람 가능, 변경 전·후 대비표 공개.
  fail: 시행일 없음, 이전 버전 열람 불가, 대비표 없음.
  remediation: '처리방침 상단에 "시행일자: 2026.○.○"와 [이전 처리방침 보기] 목록을 두고, 변경 시 공지사항과 처리방침 하단에 "변경 전 | 변경 후 | 사유" 대비표를 게시한다.'
  evidence: 시행일·이전 버전 목록·대비표 스크린샷
  notes: 고시 의무. PIPA-30과 관계.
  category: 처리방침·권리보장
  strength: 의무
  default_risk: 중
- id: STD-22-01
  title: 개인정보 보호책임자 공개
  basis:
  - 지침 제22조제1항·제2항
  - 원문 p.8
  requirement: 보호책임자를 지정·변경하면 지정·변경 사실, 성명과 부서명, 전화번호 등 연락처를 공개해야 하며, 고충처리·상담을 실제로 처리할 수 있는 연락처를 공개해야 한다(담당자 정보를 함께 공개 가능).
  applies_when: 모든 개인정보처리자
  type: 관찰
  type_note: null
  location:
  - 처리방침 페이지(보호책임자 조항)
  method: 처리방침에서 보호책임자 성명·부서·연락처가 있는지, 연락처가 대표번호만이 아니라 실제 개인정보 고충 처리 창구(전용 이메일·전화)인지 확인한다. 연락처로 실제 연락은 하지 않음.
  pass: 성명·부서·실제 처리 가능한 연락처 공개.
  fail: 성명 또는 연락처 누락, 연락처가 일반 대표번호뿐이거나 무효 주소.
  remediation: '처리방침에 "개인정보 보호책임자: 성명 ○○○, 직책 ○○, 부서 ○○팀, 전화 02-XXX, 이메일 privacy@○○ / 담당자: ○○○"를 적고 변경 시 즉시 갱신한다.'
  evidence: 처리방침 해당 조항 스크린샷
  notes: 고시 의무(법 제31조제6항과 관계). PIPA-31과 관계.
  category: 처리방침·권리보장
  strength: 의무
  default_risk: 중
- id: STD-10-01
  title: 불필요한 개인정보 5일 이내 파기
  basis:
  - 지침 제10조제1항·제2항
  - 원문 p.4
  requirement: 보유기간 경과, 처리 목적 달성, 가명정보 처리기간 경과, 서비스 폐지, 사업 종료 등으로 불필요하게 되면 정당한 사유가 없는 한 5일 이내에 복원이 불가능한 방법(현재 기술 수준에서 사회통념상 적정 비용으로 복원 불가)으로 파기해야 한다.
  applies_when: 모든 개인정보처리자(공공기관 파일 파기는 STD-55-01도 적용)
  type: 서면
  type_note: null
  location:
  - 처리방침 페이지(파기 조항)
  - 회원 탈퇴 안내 화면
  - 서면
  method: '서면 확인: 탈퇴·보유기간 만료 데이터 파기 배치 주기(5일 이내인지), 파기 방법(DB 삭제·덮어쓰기, 백업 포함). 브라우저 보조 확인: 처리방침 파기 조항과 탈퇴 안내 화면의 파기 시점 문구(예: "탈퇴 즉시 파기" vs "30일 후 파기")가 5일 원칙과 맞는지, 다르면 정당한 사유가 적혀 있는지 확인(탈퇴는 실행하지 않음).'
  pass: 불필요 시점부터 5일 이내 파기되고 처리방침·안내와 일치.
  fail: 탈퇴 후 장기간 보관(사유 없음), 처리방침과 실제 불일치, 복원 가능한 방법(논리 삭제 플래그만)으로 처리.
  remediation: 파기 배치를 일 단위로 돌려 파기 사유 발생 후 5일 내 물리 삭제하고, 탈퇴 유예기간을 두는 경우 사유와 기간을 처리방침·탈퇴 화면에 적는다. 논리 삭제 데이터도 기한 내 물리 삭제한다.
  evidence: 처리방침·탈퇴 안내 스크린샷, 서면 문서
  notes: 고시 의무(법 제21조는 "지체 없이", 고시가 5일로 구체화). PIPA-21과 관계, 공공기관 파일 파기 STD-55-01과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-10-02
  title: 파기 기록·관리와 보호책임자 결과 확인
  basis:
  - 지침 제10조제3항·제4항
  - 원문 p.4
  requirement: 파기에 관한 사항을 기록·관리하고, 보호책임자는 파기 시행 후 결과를 확인해야 한다.
  applies_when: 모든 개인정보처리자
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 파기 대장·배치 로그(파기 일시, 대상, 건수, 방법), 보호책임자 확인(결재) 기록.'
  pass: 파기 건별 기록과 보호책임자 확인 기록.
  fail: 기록 없음, 보호책임자 확인 없음.
  remediation: 자동 파기 배치 결과를 월별 파기 대장으로 집계해 보호책임자가 결재하도록 한다.
  evidence: 서면 문서
  notes: 고시 의무. PIPA-21과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-11-01
  title: 법령 보존 정보의 분리 저장·공개
  basis:
  - 지침 제11조제1항·제2항
  - 원문 p.4
  requirement: 법령에 따라 파기하지 않고 보존하는 개인정보는 물리적·기술적으로 분리해 저장·관리하고, 법령 근거로 보존한다는 점을 처리방침 등으로 알려야 한다.
  applies_when: 법령상 보존 의무가 있는 개인정보처리자(전자상거래 거래기록, 통신사실확인자료 등)
  type: 관찰
  type_note: null
  location:
  - 처리방침 파기·보유기간 조항
  - 서면
  method: 처리방침에 법령 보존 항목·근거 법령·보존 기간이 적혀 있는지 확인한다. 분리 저장 여부는 서면 확인(별도 DB·테이블·접근권한).
  pass: 처리방침에 근거·항목·기간 공개, 분리 저장 확인.
  fail: 근거 미기재, 운영 DB에 그대로 보관.
  remediation: '처리방침에 "전자상거래법: 계약·청약철회 기록 5년, 대금결제 기록 5년, 소비자 불만 기록 3년 / 통신비밀보호법: 로그인 기록 3개월" 등 표를 두고, 보존 데이터는 별도 보관 DB로 옮겨 접근권한을 최소화한다.'
  evidence: 처리방침 해당 부분, 서면 문서
  notes: 고시 의무. PIPA-21과 관계, STD-19-01 제7호와 관계.
  category: 처리방침·권리보장
  strength: 의무
  default_risk: 중
- id: STD-26-01
  title: 유출등 통지 시기·항목(72시간)
  basis:
  - 지침 제25조, 제26조제1항~제4항
  - 원문 p.8~9
  requirement: 개인정보 유출등(분실·도난·유출로 관리·통제권을 벗어나 제3자가 알 수 있게 된 상태)을 알게 되면 72시간 이내에 정보주체에게 (1) 유출 항목, (2) 시점·경위, (3) 피해 최소화 방법, (4) 대응조치·피해구제절차, (5) 신고 접수 부서·연락처를 알려야 한다. 긴급 조치가 필요하거나 천재지변 등으로 곤란하면 사유 해소 후 지체 없이, 일부만 확인되면 유출 사실과 확인된 사항을 우선 알리고 추후 통지한다. 사고를 늦게 인지해 72시간을 넘긴 경우 실제 인지 시점을 입증해야 한다.
  applies_when: 모든 개인정보처리자
  type: 서면
  type_note: null
  location:
  - 서면
  - 공지사항(과거 유출 공지)
  method: '서면 확인: 유출 대응 절차의 통지 기한(72시간)·5개 통지 항목 템플릿, 과거 사고의 인지 시각·통지 시각 기록. 브라우저 보조 확인: 공지사항의 과거 유출 공지가 5개 항목을 담았는지.'
  pass: 절차·템플릿이 고시와 일치하고 실제 사고 시 기한 내 통지.
  fail: 통지 절차 없음, 항목 누락, 72시간 초과(입증 없음).
  remediation: 유출 통지 템플릿("유출 항목 / 유출 시점·경위 / 이용자 조치 방법(비밀번호 변경 등) / 회사 대응·피해구제 / 문의처")을 만들고, 사고 인지 시각을 기록하는 사고 접수 절차를 둔다.
  evidence: 서면 문서, 과거 공지 스크린샷
  notes: 고시 의무(법 제34조·영 제39조 구체화). PIPA-34과 관계, 침해사고 통지 NET-48C-02과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-27-01
  title: 유출등 통지 방법
  basis:
  - 지침 제27조제1항·제2항
  - 원문 p.9
  requirement: 통지는 서면·전자우편·팩스·전화·문자 등 서면등의 방법으로 하며, 연락처를 알 수 없는 등 정당한 사유가 있으면 홈페이지에 30일 이상 게시로 갈음할 수 있다(홈페이지가 없으면 사업장 등 보기 쉬운 장소에 30일 이상 게시).
  applies_when: 모든 개인정보처리자
  type: 서면
  type_note: null
  location:
  - 공지사항
  - 서면
  method: '서면 확인: 개별 통지 수단과 발송 기록. 홈페이지 게시로 갈음한 경우 게시 기간(30일 이상)과 정당한 사유 기록. 브라우저 보조 확인: 과거 유출 공지 게시일·현재 게시 여부.'
  pass: 개별 통지 원칙, 게시 갈음 시 사유와 30일 이상 게시.
  fail: 연락처가 있는데 홈페이지 게시만, 30일 미만 게시.
  remediation: 통지 채널(이메일·문자) 일괄 발송 절차를 마련하고, 게시 갈음 시 메인 팝업·공지 상단 고정으로 30일 이상 유지한다.
  evidence: 서면 문서, 공지 스크린샷
  notes: 고시 의무. PIPA-34과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-28-01
  title: 유출등 신고(1천명·민감·외부 불법접근, 72시간)
  basis:
  - 지침 제28조제1항~제4항
  - 원문 p.9
  requirement: 1천명 이상 유출, 민감정보·고유식별정보 유출, 처리시스템·취급자 기기에 대한 외부 불법 접근으로 인한 유출의 경우 72시간 이내에 통지 항목을 보호위원회 또는 KISA에 신고서(별지 제1호서식)로 신고해야 한다(개인정보 포털 이용 가능). 천재지변 등은 사유 해소 후 지체 없이, 회수·삭제로 권익침해 가능성이 현저히 낮아지면 신고하지 않을 수 있으며, 확인 못 한 사항은 우선 신고 후 추가 신고한다.
  applies_when: 모든 개인정보처리자(신고 요건 해당 시)
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 유출 대응 절차에 신고 요건 3가지·72시간·신고처(privacy.go.kr)가 있는지, 과거 신고 이력.'
  pass: 절차가 고시와 일치하고 해당 사고 시 기한 내 신고.
  fail: 신고 요건·기한 미숙지, 신고 누락·지연.
  remediation: 유출 대응 체크리스트에 "규모 1천명 이상? 민감·고유식별? 외부 불법접근?" 판단 단계와 72시간 신고, 망법 침해사고 24시간 신고(NET-48C-01) 병행 여부 판단을 넣는다.
  evidence: 서면 문서
  notes: 고시 의무(법 제34조제3항·영 제40조). PIPA-34과 관계, NET-48C-01과 관계(기한 24시간 vs 72시간 차이 주의).
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-29-01
  title: 유출등 사고 대응 매뉴얼
  basis:
  - 지침 제29조제1항~제3항
  - 원문 p.10
  requirement: 공공기관과 1천명 이상의 정보주체 개인정보를 처리하는 처리자는 유출 통지·조회 절차, 영업점·인터넷회선 확충 등 민원 대응, 현장 혼잡 최소화, 고객불안 해소, 피해자 구제조치를 포함한 「개인정보 유출등 대응 매뉴얼」을 마련해야 하며, 피해복구 시 정보주체의 불편·경제적 부담을 최소화하도록 노력해야 한다.
  applies_when: 공공기관, 1천명 이상 정보주체의 개인정보를 처리하는 개인정보처리자
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 매뉴얼 문서와 필수 5개 요소, 최근 개정·훈련 기록.'
  pass: 필수 요소를 갖춘 매뉴얼이 있고 현행화됨.
  fail: 매뉴얼 없음, 요소 누락.
  remediation: 유출 대응 매뉴얼에 통지·조회 페이지 개설 절차, 콜센터·서버 증설, 고객 안내 FAQ, 피해구제 기준을 넣고 연 1회 모의훈련으로 점검한다.
  evidence: 서면 문서
  notes: 고시 의무(제3항은 노력의무). NET-48I-01(침해사고 매뉴얼)과 통합 운영 가능. PIPA-34과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-31-01
  title: 열람 연기 사유 소멸 후 10일 이내 열람
  basis:
  - 지침 제31조제1항·제2항
  - 원문 p.10
  requirement: 열람을 연기한 뒤 사유가 소멸하면 10일 이내에 열람하게 해야 한다. 제3자 제공 현황 열람청구가 국가안보 업무에 중대한 지장을 주는 경우 제3자 의견을 조회해 결정할 수 있다.
  applies_when: 모든 개인정보처리자(제2항은 해당 업무 수행 기관)
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 열람 청구 처리 대장(연기 사유·소멸일·열람일).'
  pass: 사유 소멸 후 10일 이내 열람 기록.
  fail: 연기 후 장기 미처리.
  remediation: 열람 요청 관리 시스템에 연기 상태와 사유 소멸일, 10일 기한 알림을 둔다.
  evidence: 서면 문서
  notes: 고시 의무. PIPA-35과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-32-01
  title: 정정·삭제 요구 10일 이내 처리
  basis:
  - 지침 제32조제1항·제2항
  - 원문 p.10
  requirement: 정정·삭제 요구를 받으면 10일 이내에 조사해 조치하고 결과를 알려야 하며, 법령상 삭제할 수 없는 경우 10일 이내에 근거 법령 내용을 알려야 한다.
  applies_when: 모든 개인정보처리자
  type: 관찰
  type_note: null
  location:
  - 마이페이지(회원정보 수정)
  - 처리방침 권리행사 조항
  - 고객센터
  method: (1) 마이페이지에서 정정 가능한 항목과 정정 메뉴가 있는지 관찰(저장하지 않음). (2) 처리방침에 정정·삭제 요구 방법과 처리 기한이 안내되는지 확인. (3) 처리 기한 준수는 서면(요청 대장) 확인.
  pass: 온라인 정정 기능 또는 요청 창구가 있고 10일 이내 처리 기록.
  fail: 정정 수단 없음, 10일 초과, 삭제 거부 시 근거 미통지.
  remediation: 마이페이지에서 주요 정보를 직접 정정할 수 있게 하고, 직접 정정이 안 되는 항목은 온라인 요청 양식과 10일 처리 기한을 둔다. 삭제 불가 시 "전자상거래법 제6조에 따라 5년 보관" 같은 근거를 통지하는 템플릿을 둔다.
  evidence: 마이페이지 정정 메뉴 스크린샷(개인정보 마스킹), 처리방침 해당 부분
  notes: 고시 의무(10일 기한은 영 제43조와 같음). PIPA-36과 관계.
  category: 처리방침·권리보장
  strength: 의무
  default_risk: 중
- id: STD-33-01
  title: 처리정지 요구 10일 이내 처리
  basis:
  - 지침 제33조제1항·제2항
  - 원문 p.10~11
  requirement: 처리정지 요구를 받으면 10일 이내에 처리의 전부 또는 일부를 정지하고(법 제37조제2항 단서 사유 시 거절 가능), 정지된 개인정보는 10일 이내에 파기 등 상응 조치를 하고 결과를 알려야 한다.
  applies_when: 모든 개인정보처리자
  type: 서면
  type_note: null
  location:
  - 처리방침 권리행사 조항
  - 서면
  method: '서면 확인: 처리정지 요청 대장(접수일·정지일·파기일·통지일). 브라우저 보조 확인: 처리방침에 처리정지 요구 방법이 안내되는지.'
  pass: 10일 이내 정지·조치·통지 기록.
  fail: 절차 없음, 기한 초과.
  remediation: 처리정지 요청 유형을 고객 요청 시스템에 두고 정지 플래그·파기 처리와 결과 통지 템플릿을 연결한다.
  evidence: 서면 문서
  notes: 고시 의무. PIPA-37과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-34-01
  title: '권리행사 방법: 수집 방법과 같거나 더 쉽게, 추가 증빙 금지'
  basis:
  - 지침 제34조제1항·제2항
  - 원문 p.11
  requirement: 열람·정정·삭제·처리정지·동의철회 등 권리 행사는 개인정보를 수집한 방법과 같거나 더 쉬운 간편한 방법으로 제공해야 하며, 수집 시 요구하지 않던 증빙서류나 추가 절차를 요구해서는 안 된다. 본인·대리인 확인과 수수료·우송료 정산에도 같다.
  applies_when: 모든 개인정보처리자
  type: 관찰
  type_note: null
  location:
  - 마이페이지(정보 조회·수정·탈퇴·동의 철회)
  - 고객센터
  - 처리방침 권리행사 조항
  method: (1) 온라인 회원가입으로 수집했다면 마이페이지에서 열람·정정·탈퇴·동의철회가 온라인으로 가능한지 메뉴 존재를 관찰(실행하지 않음). (2) 탈퇴·철회 메뉴의 접근 단계 수, 전화·방문·서면 제출만 허용하는지, 신분증 사본 등 가입 때 없던 증빙을 요구하는지 확인. (3) 가입 단계 수와 탈퇴 단계 수를 비교 기록.
  pass: 가입과 같은 채널(온라인)에서 열람·정정·탈퇴·철회 가능, 추가 증빙 요구 없음.
  fail: 온라인 가입인데 탈퇴는 전화·이메일·방문만, 탈퇴 메뉴를 찾기 어렵게 숨김, 가입 시 없던 서류 요구, 과도한 재확인 단계.
  remediation: 마이페이지에 [회원정보 조회/수정], [동의 내역 관리], [회원 탈퇴] 메뉴를 두고 로그인 상태에서 본인 재인증(비밀번호 등 가입 때 수단) 한 번으로 처리되게 한다. 처리방침 권리행사 조항에 온라인 경로를 적는다.
  evidence: 메뉴 경로 스크린샷, 단계 수 기록
  notes: 고시 의무(영 제41조제2항 등과 같은 취지). 탈퇴 실행은 데이터 삭제이므로 관찰만 하고 실행은 금지(필요 시 테스트 계정·사용자 직접 수행·승인). PIPA-38과 관계, NET-50-03과 관계.
  category: 처리방침·권리보장
  strength: 의무
  default_risk: 중
- id: STD-36-01
  title: 고정형 영상정보처리기기 운영·관리 방침 공개
  basis:
  - 지침 제36조제1항·제2항
  - 원문 p.11
  requirement: 고정형 영상정보처리기기(CCTV·네트워크 카메라) 운영자는 운영·관리 방침을 마련·변경하면 정보주체가 쉽게 확인할 수 있게 공개해야 한다. 처리방침에 해당 사항을 포함하면 별도 방침을 두지 않아도 된다.
  applies_when: 공개된 장소 등에 고정형 영상정보처리기기를 설치·운영하는 자
  type: 관찰
  type_note: null
  location:
  - 처리방침 페이지(영상정보 조항) 또는 별도 영상정보처리기기 운영·관리 방침 페이지
  method: 사업장 CCTV를 운영하는 경우 홈페이지에 운영·관리 방침(또는 처리방침 내 조항)이 공개되어 있는지와 설치 근거·목적, 대수·위치·촬영범위, 관리책임자, 촬영시간·보관기간·장소·처리방법, 확인 방법, 열람 요구 조치, 보호조치 항목이 있는지 확인한다.
  pass: 방침이 홈페이지에 공개되고 주요 항목 포함.
  fail: CCTV를 운영하는데 방침 미공개, 보관기간·관리책임자 누락.
  remediation: 처리방침에 "영상정보처리기기 운영·관리" 조항을 추가하거나 별도 방침 페이지를 만들어 푸터에 링크한다.
  evidence: 방침 페이지 스크린샷
  notes: 고시 의무(법 제25조제7항). 사업장 CCTV 운영 여부는 서면 확인 필요. PIPA-25과 관계.
  category: 처리방침·권리보장
  strength: 의무
  default_risk: 중
- id: STD-37-01
  title: 영상정보 관리책임자 지정·업무
  basis:
  - 지침 제37조제1항~제3항
  - 원문 p.11~12
  requirement: 고정형 영상정보처리기기 운영자는 관리책임자를 지정하고, 관리책임자는 보호계획 수립, 정기 실태조사, 불만·피해구제, 내부통제, 교육, 파일 보호·파기 감독 등을 수행한다(보호책임자 겸임 가능).
  applies_when: 고정형 영상정보처리기기 운영자
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 관리책임자 지정 문서, 업무 수행 기록.'
  pass: 지정 및 업무 기록 존재.
  fail: 미지정.
  remediation: 보호책임자를 관리책임자로 겸임 지정하고 연간 영상정보 보호계획을 세운다.
  evidence: 서면 문서
  notes: 고시 의무. PIPA-25·PIPA-31과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-38-01
  title: 설치 목적 변경·추가 설치 시 의견수렴
  basis:
  - 지침 제38조
  - 원문 p.12
  requirement: 설치 목적 변경에 따른 추가 설치 등의 경우에도 영 제23조제1항에 따라 관계 전문가·이해관계인 의견을 수렴해야 한다.
  applies_when: 영 제23조제1항 의견수렴 대상인 고정형 영상정보처리기기 운영자(주로 공공기관)
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 추가 설치 시 공청회·설명회·의견조회 기록.'
  pass: 의견수렴 기록 존재.
  fail: 의견수렴 없이 추가 설치.
  remediation: 추가 설치 결재 절차에 의견수렴 단계(행정예고, 설명회 등)를 넣는다.
  evidence: 서면 문서
  notes: 고시 의무. PIPA-25과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-39-01
  title: 고정형 영상정보처리기기 안내판
  basis:
  - 지침 제39조제1항~제3항
  - 원문 p.12
  requirement: 정보주체가 쉽게 알아볼 수 있도록 설치 목적·장소, 촬영 범위·시간, 관리책임자 연락처, 위탁 시 수탁자 명칭·연락처를 적은 안내판을 촬영범위 내 보기 쉬운 곳에 판독 가능하게 설치해야 한다. 공공기관 통합관리 시 통합관리 내용을 안내판에 적어야 한다.
  applies_when: 고정형 영상정보처리기기 운영자
  type: 서면
  type_note: null
  location:
  - 현장(사업장)
  method: '서면 확인: 안내판 현장 사진(기재 항목 확인).'
  pass: 필수 항목이 기재된 안내판이 보기 쉬운 곳에 설치.
  fail: 안내판 없음, 항목 누락.
  remediation: 표준 안내판(목적·장소, 범위·시간, 관리책임자 연락처, 수탁자)을 출입구 등 촬영범위 내에 설치한다.
  evidence: 현장 사진(서면)
  notes: 고시 의무. 웹 점검 대상 아님. PIPA-25과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-39B-01
  title: 이동형 영상정보처리기기 촬영 사실 표시
  basis:
  - 지침 제39조의2제1항·제2항
  - 원문 p.12
  requirement: 이동형 기기(바디캠·차량 카메라·드론 등)로 사람 또는 관련 사물을 촬영할 때 불빛·소리·안내판·안내서면·안내방송 등으로 촬영 사실을 표시하고 알려야 한다. 드론 등 알리기 어려우면 보호위원회 운영 사이트에 촬영 사실·목적·일시·장소를 공지할 수 있다.
  applies_when: 업무 목적 이동형 영상정보처리기기 운영자
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 기기별 표시 수단, 드론 촬영 공지 이력.'
  pass: 촬영 시 표시 수단 운영.
  fail: 표시 없이 촬영.
  remediation: 기기에 촬영 표시등·음성 안내를 켜고, 드론 촬영은 보호위원회 지정 사이트에 사전 공지한다.
  evidence: 서면 문서
  notes: 고시 의무. PIPA-25B과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-39C-01
  title: 이동형 영상정보처리기기 운영·관리 방침
  basis:
  - 지침 제39조의3제1항~제3항
  - 원문 p.12~13
  requirement: 이동형 기기 운영자는 운영 근거·목적, 운영 대수, 관리책임자·담당 부서·접근권한자, 촬영시간·보관기간·장소·처리방법, 영상 확인 방법·장소, 열람 요구 조치, 보호조치 등을 담은 운영·관리 방침을 마련해 쉽게 확인할 수 있게 공개해야 한다(처리방침에 포함하면 생략 가능).
  applies_when: 업무 목적 이동형 영상정보처리기기 운영자
  type: 관찰
  type_note: null
  location:
  - 처리방침 페이지 또는 별도 방침 페이지
  method: 이동형 기기를 운영하는 경우 홈페이지에 방침이 공개되어 있고 8개 항목이 있는지 확인한다.
  pass: 방침 공개, 항목 포함.
  fail: 미공개, 항목 누락.
  remediation: 처리방침에 "이동형 영상정보처리기기 운영" 조항을 추가해 8개 항목을 적는다.
  evidence: 방침 스크린샷
  notes: 고시 의무. 운영 여부는 서면 확인. PIPA-25B과 관계.
  category: 처리방침·권리보장
  strength: 의무
  default_risk: 중
- id: STD-40-01
  title: 개인영상정보 목적 외 이용·제3자 제공 제한
  basis:
  - 지침 제40조
  - 원문 p.13
  requirement: 동의, 다른 법률 규정, 급박한 생명·신체·재산 이익, 가명처리한 통계·연구·공익기록, (공공기관 한정) 소관업무·조약·수사·재판·형 집행, 공중위생 긴급 등 경우를 제외하고 개인영상정보를 목적 외로 이용하거나 제3자에게 제공해서는 안 된다.
  applies_when: 영상정보처리기기 운영자
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 영상 제공 요청 처리 기록과 제공 근거.'
  pass: 제공 건마다 허용 근거가 기록됨.
  fail: '근거 없는 제공(예: 단순 민원인 요청에 타인 영상 제공).'
  remediation: 영상 제공 요청서 양식에 근거 조항 확인란을 두고 근거 없는 요청은 거절한다.
  evidence: 서면 문서
  notes: 고시 의무. PIPA-18·PIPA-25과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-41-01
  title: 개인영상정보 보관기간·파기
  basis:
  - 지침 제41조제1항~제3항
  - 원문 p.13~14
  requirement: 방침에 명시한 보관기간 경과, 목적 달성 등으로 불필요해지면 지체 없이 파기해야 하며, 최소 기간 산정이 곤란하면 보관기간을 수집 후 30일 이내로 한다. 출력물은 파쇄·소각, 전자파일은 복원 불가능하게 영구 삭제한다.
  applies_when: 영상정보처리기기 운영자
  type: 서면
  type_note: null
  location:
  - 방침 페이지(보관기간 표기)
  - 서면
  method: '서면 확인: 녹화기 덮어쓰기 주기 설정. 브라우저 보조 확인: 방침의 보관기간 표기(30일 초과 시 사유 기재 여부).'
  pass: 보관기간 설정이 방침과 일치하고 30일 원칙 준수(초과 시 사유).
  fail: 보관기간 미정·무기한, 방침과 실제 불일치.
  remediation: 녹화장치 자동 덮어쓰기를 30일 이내로 설정하고 방침에 보관기간을 적는다.
  evidence: 서면 문서, 방침 스크린샷
  notes: 고시 의무. PIPA-21·PIPA-25과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-42-01
  title: 개인영상정보 이용·제공·파기 기록
  basis:
  - 지침 제42조제1항·제2항, 제45조
  - 원문 p.14~15
  requirement: 목적 외 이용·제3자 제공 시 파일 명칭, 받은 자, 목적, 법령 근거, 기간, 형태, 담당자를 기록하고, 파기 시 파일 명칭, 파기 일시(자동삭제면 주기·확인 시기), 담당자를 기록·관리해야 한다(별지 제3호 개인영상정보 관리대장 활용 가능).
  applies_when: 영상정보처리기기 운영자
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 개인영상정보 관리대장.'
  pass: 이용·제공·파기 기록이 항목별로 있음.
  fail: 기록 없음, 항목 누락.
  remediation: 별지 제3호 관리대장 양식으로 기록하고 자동 삭제는 주기와 확인 시기를 월 1회 기록한다.
  evidence: 서면 문서
  notes: 고시 의무(관리대장 사용은 선택).
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-43-01
  title: 영상정보처리기기 운영 위탁 시 공개·관리감독
  basis:
  - 지침 제43조제1항~제3항
  - 원문 p.14
  requirement: 설치·운영 사무를 위탁하면 안내판과 운영·관리 방침(이동형은 방침)에 수탁자 명칭 등을 공개하고, 수탁자가 안전하게 처리하는지 관리·감독해야 한다.
  applies_when: 영상정보처리기기 운영을 위탁한 운영자(보안업체 등)
  type: 관찰
  type_note: null
  location:
  - 영상정보 방침 페이지
  - 서면
  method: 방침에 수탁자 명칭·연락처가 있는지 확인. 관리·감독 기록은 서면 확인.
  pass: 수탁자 공개, 감독 기록.
  fail: 위탁하면서 수탁자 미공개.
  remediation: '방침·안내판에 "위탁: ○○보안(주), 연락처" 기재, 연 1회 수탁자 점검.'
  evidence: 방침 스크린샷, 서면 문서
  notes: 고시 의무. PIPA-26과 관계.
  category: 처리방침·권리보장
  strength: 의무
  default_risk: 중
- id: STD-44-01
  title: 개인영상정보 열람등 요구 처리
  basis:
  - 지침 제44조제1항~제5항
  - 원문 p.15
  requirement: 정보주체가 자신이 촬영된 영상의 열람·존재확인을 요구하면 지체 없이 조치하되 신분증으로 본인·대리인을 확인하고, 제한·거부 시 10일 이내 서면 등으로 사유를 통지하며, 요구자·파일·목적·거부사유·사본 제공 내용·담당자를 기록해야 한다. 공공기관은 별지 제2호 청구서로 받는다.
  applies_when: 영상정보처리기기 운영자
  type: 서면
  type_note: null
  location:
  - 방침 페이지(열람 요구 안내)
  - 서면
  method: '서면 확인: 열람 처리 기록. 브라우저 보조 확인: 방침에 열람 요구 방법 안내.'
  pass: 지체 없이 처리, 거부 시 10일 내 통지, 기록.
  fail: 처리 절차 없음, 본인 확인 없이 제공.
  remediation: 열람 요청 절차·양식을 정하고 방침에 안내한다.
  evidence: 서면 문서
  notes: 고시 의무. PIPA-35과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-46-01
  title: 열람 시 타인 영상 보호조치
  basis:
  - 지침 제46조
  - 원문 p.15
  requirement: 열람등 조치 시 정보주체 외의 사람을 알아볼 수 있거나 사생활 침해 우려가 있으면 그 사람의 영상을 알아볼 수 없도록 보호조치(모자이크 등)를 해야 한다.
  applies_when: 영상정보처리기기 운영자
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 열람·사본 제공 시 마스킹 절차와 도구.'
  pass: 타인 마스킹 후 제공.
  fail: 원본 그대로 제공.
  remediation: 영상 마스킹 도구를 도입하고 사본 제공 전 마스킹 확인을 의무화한다.
  evidence: 서면 문서
  notes: 고시 의무.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-47-01
  title: 개인영상정보 안전성 확보조치
  basis:
  - 지침 제47조
  - 원문 p.16
  requirement: 내부 관리계획(1만명 미만 소상공인·개인·단체는 생략 가능), 접근 통제·권한 제한, 안전한 저장·전송(네트워크 카메라 전송 암호화, 파일 저장 시 비밀번호), 처리기록 보관·위변조 방지(생성 일시, 열람 목적·열람자·일시), 보관시설·잠금장치를 갖춰야 한다.
  applies_when: 영상정보처리기기 운영자
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 녹화기 접근 계정·비밀번호 정책, 네트워크 카메라 전송 암호화 설정, 열람 기록, 보관 장소 잠금.'
  pass: 5개 조치 이행.
  fail: 기본 비밀번호 사용, 평문 전송, 열람 기록 없음, 녹화기 개방 장소 보관.
  remediation: 녹화기·카메라 기본 계정 비밀번호를 바꾸고 원격 접속 시 암호화 프로토콜만 허용하며, 열람 대장을 운영하고 녹화기를 잠금 공간에 둔다.
  evidence: 서면 문서
  notes: 고시 의무. 네트워크 카메라 관리 웹 화면이 외부에 노출되어 있으면 보안 이슈이나 이 점검 도구의 대상 URL 범위 밖. PIPA-29과 관계, SAFE 항목과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-48-01
  title: 영상정보처리기기 설치·운영 자체점검
  basis:
  - 지침 제48조제1항~제3항
  - 원문 p.16
  requirement: 공공기관은 고정형 기기 운영에 대해 이 지침 준수 여부를 자체점검해 다음 해 3월 31일까지 보호위원회에 통보하고 시스템에 등록하며, 결과를 홈페이지 등에 공개해야 한다. 공공기관 외 운영자는 침해 우려가 있으면 자체점검 등 노력을 해야 한다.
  applies_when: 공공기관(의무), 그 외 운영자(노력)
  type: 관찰
  type_note: null
  location:
  - 공공기관 홈페이지(영상정보처리기기 자체점검 결과 게시)
  - 서면
  method: 공공기관이면 홈페이지에 직전 연도 자체점검 결과가 공개되어 있는지 확인. 통보·등록은 서면 확인.
  pass: 기한 내 통보·등록과 홈페이지 공개.
  fail: 미점검, 미공개.
  remediation: 매년 1분기 자체점검(8개 고려사항)을 실시해 3월 31일 전 통보·등록하고 홈페이지 공지에 결과를 게시한다.
  evidence: 게시물 스크린샷, 서면 문서
  notes: 공공기관 고시 의무, 민간은 노력의무.
  category: 처리방침·권리보장
  strength: 의무
  default_risk: 중
- id: STD-51-01
  title: 개인정보파일 등록·변경등록(60일 이내)
  basis:
  - 지침 제49조, 제50조, 제51조제1항~제4항, 제52조제1항~제3항, 제53조제1항~제4항
  - 원문 p.17~19
  requirement: 개인정보파일을 운용하는 공공기관(지침 제49조 대상, 제50조 제외 파일 제외)의 개인정보취급자는 보호책임자에게 등록·변경을 신청하고(기관명, 파일명, 운영 근거·목적, 항목, 정보주체 수, 처리방법, 보유기간, 통상 제공받는 자, 담당 부서, 열람 접수 부서, 열람 제한 범위·사유, 영향평가 결과), 보호책임자는 적정성을 검토해 직접 또는 교육부·상위기관을 거쳐 60일 이내 보호위원회에 등록해야 한다.
  applies_when: 지침 제49조의 공공기관(중앙행정기관·지자체, 인권위, 공공기관운영법상 공공기관, 지방공사·공단, 특수법인, 각급 학교)
  type: 서면
  type_note: null
  location:
  - 서면(개인정보 포털 등록 현황)
  method: '서면 확인: 운용 중인 개인정보파일 목록과 등록 현황 대조, 신청서, 등록일(운용 개시·변경일 대비 60일 이내).'
  pass: 운용 파일이 모두 등록되고 변경 사항이 60일 이내 반영.
  fail: 미등록 파일 존재, 변경 미반영, 기한 초과.
  remediation: 연 1회 파일 전수조사로 미등록 파일을 찾아 등록하고, 시스템 신규·변경 시 등록 신청 단계를 개발 절차에 넣는다.
  evidence: 서면 문서
  notes: 고시 의무(법 제32조). 처리방침 공개는 STD-61-01. PIPA-32과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-54-01
  title: 개인정보파일 표준목록에 따른 등록
  basis:
  - 지침 제54조제1항·제2항
  - 원문 p.19
  requirement: 전국 단일 공통업무를 집행하는 특별지방행정기관·지자체·교육기관 등은 중앙행정기관이 제공하는 표준목록에 따라 등록하고, 표준목록은 해당 중앙행정기관이 등록·관리해야 한다.
  applies_when: 전국 공통업무를 수행하는 공공기관
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 표준목록 대비 등록 현황.'
  pass: 표준목록에 따라 등록.
  fail: 표준목록과 다르게 개별 등록·누락.
  remediation: 소관 중앙행정기관 표준목록을 받아 등록 현황을 맞춘다.
  evidence: 서면 문서
  notes: 고시 의무.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-55-01
  title: 공공기관 개인정보파일 파기 절차
  basis:
  - 지침 제55조제1항~제4항, 제10조제5항
  - 원문 p.4, p.19
  requirement: 공공기관은 파일이 불필요해지면 지체 없이 파기하고(법령 보존 제외), 보유기간·목적을 반영한 파기계획(내부 관리계획에 포함 가능)을 수립·시행하며, 취급자는 파기요청서(별지 제4호)로 보호책임자 승인을 받아 파기하고, 보호책임자는 결과를 확인해 파기 관리대장(별지 제5호)을 작성해야 한다.
  applies_when: 공공기관
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 파기계획, 파기요청서·승인, 파기 관리대장.'
  pass: 계획·요청·승인·대장이 갖춰짐.
  fail: 계획 없음, 승인 없이 파기, 대장 없음.
  remediation: 내부 관리계획에 파기계획을 넣고 별지 서식으로 요청·승인·대장을 운영한다.
  evidence: 서면 문서
  notes: 고시 의무. STD-10-01·STD-10-02(일반 파기)와 관계, PIPA-21과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-56-01
  title: 파기 후 등록사실 삭제·통보
  basis:
  - 지침 제56조제1항·제2항
  - 원문 p.19
  requirement: 파일을 파기하면 취급자는 등록사실 삭제를 보호책임자에게 요청하고, 보호책임자는 확인 후 지체 없이 삭제하고 보호위원회에 통보해야 한다.
  applies_when: 공공기관
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 파기 파일과 등록 삭제 현황 대조.'
  pass: 파기 파일의 등록사실이 삭제됨.
  fail: 파기했는데 등록 유지, 또는 삭제했는데 파일 계속 보유.
  remediation: 파기 관리대장과 등록 현황을 분기별로 대조한다.
  evidence: 서면 문서
  notes: 고시 의무(제57조제3항제3호 개선권고 사유와 관계).
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-58-01
  title: 개인정보파일대장 작성
  basis:
  - 지침 제58조
  - 원문 p.20
  requirement: 공공기관은 개인정보파일 1개마다 개인정보파일대장 1개를 작성해야 한다.
  applies_when: 공공기관
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 파일 목록과 대장 1:1 대응.'
  pass: 모든 파일에 대장이 있음.
  fail: 대장 누락·통합 작성.
  remediation: 파일별 대장을 작성하고 등록 현황과 연동한다.
  evidence: 서면 문서
  notes: 고시 의무.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-59-01
  title: 목적 외 이용·제공대장 기록
  basis:
  - 지침 제59조
  - 원문 p.20
  requirement: 공공기관은 제3자가 법 제18조제2항에 따라 파일 이용·제공을 요청하면 건별 가능 여부를 확인하고 별지 제6호 개인정보 목적 외 이용·제공대장에 기록해야 한다.
  applies_when: 공공기관
  type: 서면
  type_note: null
  location:
  - 서면
  method: '서면 확인: 목적 외 이용·제공대장.'
  pass: 건별 기록.
  fail: 기록 없음.
  remediation: 별지 제6호 서식으로 대장을 운영한다.
  evidence: 서면 문서
  notes: 고시 의무. STD-08-01과 관계, PIPA-18과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-60-01
  title: 개인정보파일 보유기간 산정
  basis:
  - 지침 제60조제1항·제2항, 별표 1
  - 원문 p.20
  requirement: 보유기간은 개별 개인정보의 수집~삭제 생애주기로서 목적에 맞는 최소 기간으로 산정하되 개별 법령 보존기간에 따르고, 법령에 없으면 보호책임자 협의 후 기관장 결재로 정하며, 별표 1 책정 기준표와 공공기록물법 시행령 기록관리기준표를 넘을 수 없다.
  applies_when: 공공기관
  type: 서면
  type_note: null
  location:
  - 처리방침(파일별 보유기간)
  - 서면
  method: '서면 확인: 파일별 보유기간 산정 근거(법령 또는 기관장 결재). 브라우저 보조 확인: 처리방침의 보유기간 표기가 "영구" 등 과도하지 않은지.'
  pass: 근거 있는 최소 기간, 기준표 이내.
  fail: 근거 없는 장기·영구 보유, 기준표 초과.
  remediation: 파일별로 근거 법령 또는 기관장 결재 문서를 갖추고 처리방침 보유기간을 맞춘다.
  evidence: 서면 문서
  notes: 고시 의무. 별표 1 원문 미수록(추출 메모). PIPA-21과 관계.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: STD-61-01
  title: 개인정보파일 보유·파기 현황의 처리방침 공개
  basis:
  - 지침 제61조제1항
  - 원문 p.20
  requirement: 공공기관 보호책임자는 개인정보파일 보유·파기 현황을 주기적으로 조사해 그 결과를 처리방침에 포함해 관리해야 한다.
  applies_when: 공공기관
  type: 관찰
  type_note: null
  location:
  - 처리방침 페이지
  method: 공공기관 처리방침에 개인정보파일 등록 현황(파일명, 운영 근거, 항목, 보유기간 등) 또는 개인정보 포털 링크가 있는지 확인한다.
  pass: 파일 현황이 처리방침에 포함되거나 링크로 연결되고 최신화됨.
  fail: 파일 현황 누락, 오래된 현황.
  remediation: 처리방침에 "개인정보파일 현황" 조항을 두고 개인정보 포털(www.privacy.go.kr) 등록 현황 링크와 주요 파일 목록을 싣는다.
  evidence: 처리방침 해당 부분 스크린샷
  notes: 고시 의무. STD-19-01과 관계, PIPA-30·PIPA-32과 관계.
  category: 처리방침·권리보장
  strength: 의무
  default_risk: 중
