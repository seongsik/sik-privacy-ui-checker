- id: SAFE-03-01
  title: 환경에 맞는 안전조치 적용 원칙
  basis:
  - 개인정보의 안전성 확보조치 기준 제3조
  - 안내서 p.34
  - 부록 FAQ 1-1 (p.134)
  requirement: 개인정보 보유 수·유형·정보주체 영향을 고려해 스스로의 환경에 맞는 안전조치를 적용해야 한다. 고시는 최소 기준이며, 고시 사항을 모두 포함하고 필요하면 추가 조치(이름·휴대전화번호 암호화, 내부망 접속에도 안전한 인증수단, KMS/HSM, 상시 취약점진단·모의해킹 등)를 수립·적용·점검한다.
  applies_when: 모든 개인정보처리자 (수탁자 포함, FAQ 1-2)
  type: 서면
  type_note: null
  location: []
  method: '서면 확인: 내부 관리계획 또는 보안정책에 처리 규모·유형을 고려한 위험 기반 안전조치 기준이 있는지, 고시 외 추가 조치를 정했는지.'
  pass: 고시 항목을 모두 반영하고 처리 환경을 고려한 자체 기준·추가 조치가 문서화되어 있다.
  fail: 고시 문구를 그대로 옮기기만 하고 자체 환경 분석·기준이 없거나 고시 항목 일부가 빠져 있다.
  remediation: 개인정보 보유 현황(건수·항목·민감도)과 처리 환경을 정리하고, 이를 근거로 고시 항목별 자체 기준(수치 포함)과 추가 조치를 내부 관리계획에 반영한다. 추가 조치 예시는 안내서 p.34 예시(이름·전화·주소 암호화, 내부망 MFA, KMS/HSM, PbD, 상시 진단·레드티밍, 월간 이행점검)를 참고한다.
  evidence: 서면 자료 목록(문서명·버전·승인일)
  notes: 법령 의무(원칙 규정). 이 원칙 때문에 비밀번호 규칙·실패 횟수·세션 시간 등 수치는 처리자가 스스로 정하게 되어 있다. 브라우저 점검에서 수치 판정 시 "처리자가 정한 기준과 실제 화면 동작이 일치하는지"를 함께 본다(SAFE-05-05-01, SAFE-05-06-01, SAFE-06-04-01).
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-04-01-01
  title: 내부 관리계획 수립·승인·필수 포함 항목
  basis:
  - 기준 제4조제1항제1호~제18호
  - 안내서 p.35~38, p.46~49, p.53~54
  - FAQ 3-1, 3-4 (p.138~139)
  requirement: 내부 의사결정 절차(최고경영층 결재 등)를 거쳐 제1항 18개 사항을 포함한 내부 관리계획을 수립·시행하고 임직원에게 알린다. 해당 없는 항목은 목차 제외 또는 "해당 없음"으로 쓰고 사유는 15호(위험 분석)에 적을 수 있다. 문서 제목은 다른 이름이어도 된다.
  applies_when: 모든 개인정보처리자. 단, 1만명 미만 정보주체를 처리하는 소상공인·개인·단체는 생략 가능(그 외 안전조치는 이행). 공공기관·대기업·중견·중소기업은 수량과 무관하게 수립
  type: 서면
  type_note: null
  location: []
  method: '서면 확인: 내부 관리계획 최신본, 결재 문서, 임직원 공지 기록. 18개 항목(조직, CPO 자격·지정, 역할·책임, 취급자 관리·감독·교육, 접근 권한, 접근통제, 암호화, 접속기록, 악성프로그램, 취약점 점검, 물리적 조치, 출력·복사, 파기, 유출사고 대응, 위험 분석, 수탁자 관리·감독, 계획 수립·변경·승인, 그 밖의 사항)을 대조표로 확인.'
  pass: 18개 항목이 모두 있거나 "해당 없음" 사유가 기재되어 있고, 최고경영층 승인과 전파 기록이 있다.
  fail: 계획이 없음, 승인 기록 없음, 필수 항목 누락, 처리방침을 내부 관리계획으로 대신함.
  remediation: 안내서 p.37~38 목차 예시(총칙/수립·시행·점검/조직/교육/기술적·관리적·물리적 안전조치/그 밖의 사항)에 따라 문서를 작성하고 대표이사 등 결재 후 사내 게시·공지한다. 처리방침(법 제30조, 대외 공개)과 내부 관리계획(법 제29조, 내부용)을 별도 문서로 둔다.
  evidence: 문서 표지·목차·결재란 사본(서명·개인 연락처 마스킹)
  notes: 법령 의무. 제12호(출력·복사), 제13호(파기)는 안내서상 '26.11.1 시행으로 표기(추출 메모 참고). 제5~9, 11~13호의 실제 이행은 각 조문 항목(SAFE-05~06, 다른 담당 범위의 제7조 이하)에서 점검한다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-04-01-02
  title: 개인정보 보호책임자 지정·자격요건·역할
  basis:
  - 기준 제4조제1항제1호~제3호
  - 안내서 p.39~44
  - 법 제31조, 영 제32조·별표1
  requirement: 보호 조직을 구성하고 업무분장을 명시한다. CPO를 의사결정 가능한 지위에서 지정하고(소상공인은 대표자가 CPO), 영 제32조제4항 대상은 개인정보보호·정보보호·정보기술 경력 합 4년 이상(개인정보보호 2년 이상)인 사람으로 지정한다. CPO·취급자의 역할과 책임, CPO 독립성 보장을 계획에 포함한다.
  applies_when: 모든 개인정보처리자. 자격요건은 연매출 1,500억원 이상이면서 5만명 이상 민감·고유식별정보 또는 100만명 이상 개인정보 처리, 재학생 2만명 이상 대학, 상급종합병원, 공공시스템운영기관
  type: 서면
  type_note: null
  location:
  - 처리방침 페이지(보조 관찰)
  method: '서면 확인: 조직도, CPO 지정 문서, 경력 증빙, 역할·책임 규정. 보조로 처리방침 페이지에 CPO 성명·직책·연락처가 표시되어 있는지 관찰해 서면 자료와 일치하는지 대조.'
  pass: 지정 문서와 자격 증빙이 있고, 계획에 역할·책임·독립성 보장(정보 접근, 대표·이사회 직접 보고 체계, 자원 제공)이 적혀 있다.
  fail: CPO 미지정, 자격요건 미충족, 역할·책임 미기재, 처리방침의 CPO와 실제 지정자가 다르다.
  remediation: 임원급(또는 대표) CPO를 지정하고 인사발령·내부결재로 남긴다. 대상 기업은 별표1 경력 기준을 충족하는 사람으로 지정한다. CPO 보고 체계(정기 이사회 보고)와 예산·인력 지원을 규정한다. CPO와 CISO 겸직 시 업무분장을 명확히 한다(안내서 p.42).
  evidence: 처리방침 CPO 표시부 스크린샷(공개 정보), 서면 자료 목록
  notes: 법령 의무. 처리방침 기재 자체는 법 제30조 범위(다른 담당 PIPA 항목)와 겹치므로 여기서는 대조용으로만 쓴다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-04-01-03
  title: 개인정보취급자 관리·감독
  basis:
  - 기준 제4조제1항제4호
  - 안내서 p.44~45
  - 법 제28조
  requirement: 취급자 범위와 업무를 최소화하고, 권한 차등부여·변경 시 지체 없는 변경·말소·보안서약서 징구 등으로 관리·감독한다.
  applies_when: 모든 개인정보처리자
  type: 서면
  type_note: null
  location: []
  method: '서면 확인: 취급자 명단, 보안서약서, 관리·감독 기록.'
  pass: 취급자 명단이 최신이고 서약서·감독 기록이 있다.
  fail: 취급자 현황을 파악하지 못하거나 서약서·감독 기록이 없다.
  remediation: 취급자 대장(소속·담당업무·권한·시스템) 작성 및 분기별 현행화, 입사·권한 부여 시 보안서약서 징구, 감독 결과 기록.
  evidence: 서면 자료 목록
  notes: 법령 의무. 교육 부분은 SAFE-04-02-01.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-04-01-04
  title: 개인정보 유출·도난 방지를 위한 취약점 점검 계획
  basis:
  - 기준 제4조제1항제10호
  - 안내서 p.48~49
  - 부록 위험도 분석 점검항목 25 (p.184~185)
  requirement: 처리 환경·시스템·애플리케이션의 취약점을 정기 점검하고 개선한다. 신규 도입·변경 시 시큐어 코딩 등 보안 요구사항을 반영한다. 홈페이지는 웹 취약점 점검과 웹셸 점검을 정기적으로 하고 기록을 남긴다.
  applies_when: 모든 개인정보처리자
  type: 서면
  type_note: null
  location: []
  method: '서면 확인: 연간 취약점 점검 계획·결과 보고서·조치 내역, 웹셸 점검 기록, 개발 보안 요구사항.'
  pass: 정기(부록 기준 연 1회 이상) 웹 취약점 점검과 조치 이행 기록이 있다. 또는 웹방화벽 등 상시 차단 조치가 있다.
  fail: 점검 기록이 없거나 발견 취약점이 장기간 미조치 상태다.
  remediation: KISA 보호나라·NCSC·OWASP 기준으로 연 1회 이상 웹 취약점 진단과 긴급 취약점 수시 진단, 웹셸 탐지 점검을 계획에 넣고 결과·조치 이력을 보관한다(안내서 p.48, 부록 p.184 권고).
  evidence: 서면 자료 목록
  notes: 법령 의무(계획 포함)이며 "연 1회"는 안내서 부록 위험도 분석 기준의 권고 수치. 이 웹 점검 결과 발견된 문제는 SAFE-06-03-xx 항목으로 판정한다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-04-01-05
  title: 개인정보 유출사고 대응 계획
  basis:
  - 기준 제4조제1항제14호
  - 안내서 p.50~51
  requirement: 신속대응팀 구성, 원인 파악·추가 유출 방지, 72시간 내 신고(1천명 이상, 민감·고유식별정보, 외부 불법 접근)와 정보주체 통지, 피해구제·재발 방지를 담은 대응 계획을 수립·시행한다.
  applies_when: 모든 개인정보처리자
  type: 서면
  type_note: null
  location: []
  method: '서면 확인: 유출사고 대응 계획(매뉴얼), 비상연락망, 모의훈련 기록.'
  pass: 신고·통지 기한과 절차, 책임자가 명시되어 있다.
  fail: 계획이 없거나 신고·통지 절차가 빠져 있다.
  remediation: 개인정보 포털의 「개인정보 유출 등 사고 대응 매뉴얼」을 기반으로 대응 계획을 만들고 연 1회 이상 훈련한다(안내서 p.51 예시).
  evidence: 서면 자료 목록
  notes: 법령 의무. 신고·통지 자체는 법 제34조 범위.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-04-01-06
  title: 위험 분석 및 관리
  basis:
  - 기준 제4조제1항제15호
  - 안내서 p.51
  requirement: 처리 방법·종류에 따른 침해 가능성과 정보주체 영향을 분석하고 관리 방안을 포함한다. 방법은 자체 마련 가능.
  applies_when: 모든 개인정보처리자 (제6조의2 예외 적용 시 필수 전제)
  type: 서면
  type_note: null
  location: []
  method: '서면 확인: 위험 분석 방법론, 최근 분석 결과, 위험 처리 계획.'
  pass: 분석 결과와 후속 조치가 문서화되어 있다.
  fail: 위험 분석을 하지 않았거나 결과가 조치로 이어지지 않는다.
  remediation: 자산·위협·영향도 기반 위험 분석 절차를 정하고 연 1회 이상 수행해 결과를 내부 관리계획에 반영한다. 고유식별정보 암호화 범위 판단에는 부록 위험도 분석 기준을 사용할 수 있다.
  evidence: 서면 자료 목록
  notes: 법령 의무. SAFE-06B-02-01과 연결.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-04-01-07
  title: 수탁자 관리·감독
  basis:
  - 기준 제4조제1항제16호
  - 안내서 p.51~52
  - 법 제26조제4항, 영 제28조
  requirement: 수탁자 교육, 처리 현황·목적 외 이용·재위탁·안전조치 이행을 정기 점검하고 기록·개선한다. 계약서·제안요청서에 안전조치 사항을 명시한다.
  applies_when: 처리업무를 위탁하는 개인정보처리자
  type: 서면
  type_note: null
  location: []
  method: '서면 확인: 위탁 계약서, 수탁자 교육·점검 결과, 개선 조치 기록.'
  pass: 정기(안내서 예시 분기·반기) 점검 기록과 후속 조치가 있다.
  fail: 계약서에 안전조치 조항이 없거나 점검·교육 기록이 없다.
  remediation: 수탁자 점검 체크리스트를 만들고 분기 또는 반기별로 점검·기록하며, 계약서에 영 제28조 사항(목적·범위, 재위탁 제한, 안전조치, 감독)을 넣는다(안내서 p.52 예시).
  evidence: 서면 자료 목록
  notes: 법령 의무. 수탁자 목록 공개는 처리방침(법 제26조제2항) 범위.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-04-01-08
  title: 그 밖의 보호 조치(공격표면관리 등)
  basis:
  - 기준 제4조제1항제18호
  - 안내서 p.53~54
  requirement: '처리 환경에 따라 추가 조치를 할 수 있고 계획에 넣을 수 있다. 예: ISMS-P 인증, 상시 취약점 점검·모의해킹, PET, 도메인·IP·클라우드·웹서비스·API·설정정보 등 정보자산 외부 노출 점검(공격표면관리).'
  applies_when: 모든 개인정보처리자(선택 사항)
  type: 서면
  type_note: null
  location: []
  method: '서면 확인: 추가 조치 목록, 공격표면 점검 결과.'
  pass: 처리 규모에 맞는 추가 조치가 정해져 있다.
  fail: 대규모 처리자인데 외부 노출 자산 관리가 전혀 없다(권고 미이행으로 기록).
  remediation: 외부 노출 자산 목록(도메인·서브도메인·API·관리 콘솔) 관리와 정기 스캔을 도입한다(안내서 p.53~54 예시).
  evidence: 서면 자료 목록
  notes: '"할 수 있다" 규정이므로 미이행은 취약이 아니라 권고 사항으로 보고한다. 브라우저 점검에서 발견한 노출 자산(SAFE-06-03-07)이 근거가 된다.'
  category: 관리체계(서면)
  strength: 권고
  default_risk: 하
- id: SAFE-04-02-01
  title: 개인정보보호 교육 계획·실시
  basis:
  - 기준 제4조제2항
  - 안내서 p.44~45, p.54~56
  - FAQ 3-3 (p.139)
  requirement: 교육 목적·대상, 내용, 일정·방법을 정해 CPO와 취급자에게 사업규모·보유 수·업무성격에 따라 차등화한 교육을 정기적으로 실시하고 결과(일시·내용·참석자)를 기록한다.
  applies_when: 모든 개인정보처리자
  type: 서면
  type_note: null
  location: []
  method: '서면 확인: 연간 교육 계획, 교육 자료, 참석자 명단·수료증, 결과 보고.'
  pass: 연 1회 이상 대상별 차등 교육 실시 기록이 있다.
  fail: 교육 계획·결과가 없거나 일괄 동일 교육만 한다.
  remediation: '"○○년 개인정보보호 교육 계획(안)"과 "결과" 문서를 만들고, 대상별(CPO·담당자·취급자·수탁자·개발자·신규입사자) 과정을 편성한다. 개인정보배움터(edu.privacy.go.kr) 활용 가능(안내서 p.45, p.55 예시).'
  evidence: 서면 자료 목록
  notes: '"정기적"은 법령 문언, "연 1회 이상"은 안내서 해설(p.54).'
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-04-03-01
  title: 내부 관리계획 변경 반영·이력 관리
  basis:
  - 기준 제4조제3항
  - 안내서 p.53, p.56
  - FAQ 3-2 (p.138)
  requirement: 제1항 사항에 중요한 변경이 있으면 즉시 반영해 수정·시행(재승인 포함)하고 수정 이력(내용·시행 시기)을 관리하며 취급자에게 전파한다.
  applies_when: 내부 관리계획 수립 대상자
  type: 서면
  type_note: null
  location: []
  method: '서면 확인: 개정 이력표, 개정 결재, 전파 기록. 최근 법령·고시 개정(2026-9호 등)과 시스템 변경이 반영됐는지 대조.'
  pass: 개정 이력과 재승인 기록이 있고 최신 고시를 반영했다.
  fail: 이력 관리 없음, 고시 개정·시스템 변경 미반영.
  remediation: 문서 앞부분에 개정 이력표(버전·일자·변경 내용·승인자)를 두고, 연 1회 이상 법령 변경을 검토해 반영한다.
  evidence: 서면 자료 목록
  notes: 법령 의무.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-04-04-01
  title: 내부 관리계획 이행 실태 연 1회 점검
  basis:
  - 기준 제4조제4항
  - 안내서 p.57
  - FAQ 3-2 (p.138)
  requirement: CPO 책임 하에 접근 권한, 접속기록, 암호화 등 이행 실태를 연 1회 이상 점검·관리하고, 중대 사안은 최고경영자에게 보고해 대책을 마련한다.
  applies_when: 내부 관리계획 수립 대상자
  type: 서면
  type_note: null
  location: []
  method: '서면 확인: 이행 점검 계획(대상·시기·조직·항목·방법·결과 보관·후속조치), 점검 결과 보고서, 경영진 보고 기록.'
  pass: 최근 1년 이내 점검 결과와 후속 조치 기록이 있다.
  fail: 점검 기록이 없거나 1년을 넘겼다.
  remediation: '"○○년 개인정보 보호조치 이행 점검 계획(안)"과 "이행실태 점검 결과"를 작성하고(안내서 p.57 예시), 이 웹 점검 보고서를 점검 결과의 일부로 활용한다.'
  evidence: 서면 자료 목록
  notes: 법령 의무(연 1회 수치는 고시 문언).
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-05-01-01
  title: 접근 권한 최소·차등 부여(관리자 화면 메뉴·기능 권한)
  basis:
  - 기준 제5조제1항
  - 안내서 p.58~59
  - FAQ 4-1 (p.140)
  - 제4조제1항제5호
  requirement: 개인정보처리시스템 접근 권한을 업무 수행에 필요한 최소 범위로 차등 부여한다. 메뉴와 상세 권한(열람·입력·수정·삭제·다운로드·인쇄)을 세분화하고 열람만 필요한 자에게는 열람만 준다. 오픈마켓 판매자 등 제3자에게 주는 권한도 최소화한다.
  applies_when: 모든 개인정보처리자
  type: 관찰
  type_note: null
  location:
  - 관리자 화면(권한 관리
  - 계정 관리 메뉴)
  - 판매자·파트너 센터
  method: (1) 사용자가 업무 권한이 서로 다른 테스트 관리자 계정으로 각각 로그인하게 하고, 메뉴 트리와 화면 버튼(다운로드·엑셀·인쇄·삭제)을 접근성 트리로 수집해 비교한다. (2) 권한 관리 메뉴가 있으면 조회만 해서 권한 체계(역할별 메뉴×조회/쓰기/수정/삭제/다운로드 매트릭스)가 있는지 본다. 저장 버튼은 누르지 않는다. (3) 열람 권한 계정에 다운로드 버튼이 보이거나 다운로드 API 엔드포인트가 응답 목록에 있는지 네트워크 요청으로 확인한다(호출하지 않음). (4) 숨겨진 메뉴 URL을 GET으로 직접 열어보는 것은 개인정보 조회가 따르지 않는 화면에 한해 사용자 승인 후 한다.
  pass: 역할별로 메뉴·기능 권한이 구분되고 열람과 다운로드가 분리되어 있다. 하위 권한 계정에서 상위 기능이 보이지 않고 서버도 거부한다.
  fail: 모든 관리자 계정이 동일한 최고 권한, 권한 체계 자체가 없음, 열람 권한에 다운로드가 자동 포함, 부서 단위 일괄 부여로 개인정보 업무가 없는 직원도 개인정보 화면 접근, 단순 조회 아르바이트에게 관리자 권한(안내서 p.59 미조치 사례).
  remediation: '역할 기반 권한(RBAC) 매트릭스를 정의하고(안내서 p.59 "담당자 업무별 접근 권한 부여 예시": 메뉴별 조회/쓰기/수정/삭제/다운로드 분리), 다운로드·인쇄 권한을 별도 승인 권한으로 분리한다. 서버 측에서 기능별 권한 검사를 한다(화면 숨김만으로 끝내지 않음). 개발·설치 시 기본 관리자 권한 일괄 부여를 해제하고 장기 미사용 권한을 회수한다.'
  evidence: 계정별 메뉴 트리 스크린샷 비교, 권한 매트릭스 화면 캡처(다른 직원 이름·ID 마스킹 필요)
  notes: 법령 의무. 안내서는 제1항을 '26.11.1 시행으로 표기(추출 메모 참고). 다른 정보주체 데이터 조회가 따르는 권한 우회 시험(IDOR, 파라미터 변조)은 하지 않는다. 테스트 계정이 1개뿐이면 "부분 점검"으로 보고.
  category: 인증·접근통제
  strength: 의무
  default_risk: 중
- id: SAFE-05-01-02
  title: DB 직접 접근 제한과 가명정보·추가정보 권한 분리
  basis:
  - 기준 제5조제1항
  - 안내서 p.60
  requirement: DB 직접 접근 권한은 DB 운영·관리자에게만 준다. 가명정보 처리 시 가명정보 담당자와 추가정보 담당자를 구분하고 저장도 물리적(불가피하면 논리적) 분리한다. 분리 곤란 시 최소 권한·이력 상호 검토 등 보완통제를 한다.
  applies_when: 모든 개인정보처리자(가명정보 부분은 법 제28조의2·3에 따라 가명정보를 처리하는 자)
  type: 서면
  type_note: null
  location: []
  method: '서면 확인: DB 계정 목록·권한, DB 접근제어 정책, 가명정보 처리 담당자 지정 문서와 저장 위치 구성도.'
  pass: DB 계정이 DBA로 한정되고 가명/추가정보 권한이 분리되어 있다.
  fail: 개발자·일반 취급자에게 운영 DB 직접 접근 권한, 가명·추가정보 동일인 접근.
  remediation: DB 접근제어 솔루션 도입 또는 DBMS 역할 분리, 가명·추가정보 분리 저장소와 별도 계정 운영, 분리 불가 시 접근 이력 상호 검토 기록(안내서 p.60).
  evidence: 서면 자료 목록
  notes: 법령 의무(해설 해석).
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-05-02-01
  title: 인사이동·업무 변경 시 접근 권한 지체 없는 변경·말소
  basis:
  - 기준 제5조제2항
  - 안내서 p.60~61
  - FAQ 4-2 (p.140)
  - 부록 점검항목 18 (p.179~180)
  requirement: 전보·퇴직·휴직, 수탁 계약 변경·종료, 업무 조정 시 지체 없이(정당한 사유 없으면 즉시) 계정·권한을 변경·회수한다. 일부 시스템·일부 권한만 회수하거나, 계정 삭제 후에도 인증값으로 우회 접근 가능하거나, 계정은 두고 비밀번호만 초기화하는 것은 미조치다.
  applies_when: 모든 개인정보처리자
  type: 서면
  type_note: null
  location:
  - 관리자 화면 계정 목록(보조 관찰)
  method: '서면 확인: 최근 퇴사자·전보자 명단과 시스템 계정 목록 대조, 퇴직 점검표. 보조 관찰로 관리자 화면 계정 목록에 장기 미접속 계정(최종 접속일 표시가 있으면)이 많은지 조회만 한다.'
  pass: 퇴사·전보자 계정이 처리일 기준 즉시 비활성화·삭제되고 모든 연관 시스템에서 회수됐다.
  fail: 퇴사자 계정 활성 상태, 일부 시스템만 회수, 장기 미사용 계정 다수 방치.
  remediation: 인사시스템 연계 자동 회수 또는 퇴직 점검표에 "전 시스템 계정 말소 확인" 항목 추가(안내서 p.61), 월 1회 이상 계정 현행화 점검, 회수 시 세션·토큰·API 키도 함께 폐기.
  evidence: 계정 목록 화면(이름·ID 마스킹 필요), 서면 대조표
  notes: 법령 의무. 계정이 누구 것인지는 브라우저로 판단 불가하므로 판정은 서면 대조로 한다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-05-03-01
  title: 권한 부여·변경·말소 내역 기록 및 3년 보관
  basis:
  - 기준 제5조제3항
  - 안내서 p.61~62
  requirement: 권한 부여·변경·말소 내역(신청자, 신청일시, 승인자·발급자, 권한 정보, 사유)을 기록하고 최소 3년간 보관한다.
  applies_when: 모든 개인정보처리자
  type: 서면
  type_note: null
  location:
  - 관리자 화면 권한 이력 메뉴(보조 관찰)
  method: '서면 확인: 권한 신청·승인 기록, 이력 데이터 보관 기간. 보조 관찰로 관리자 화면에 권한 변경 이력 메뉴가 있으면 조회만 해서 항목(일시·작업자·사유)과 가장 오래된 기록 일자를 확인.'
  pass: 사유·승인자 포함 이력이 3년 이상 조회된다(시스템 운영 3년 미만이면 운영 개시 이후 전부).
  fail: 이력 없음, 2년치만 보관, 사유·승인자 누락, 부서 이동 후 변경 이력 없음(안내서 p.62 미조치 예시).
  remediation: 권한 변경 시 자동으로 이력 테이블에 기록(번호·사용자ID·권한ID·유형·일시·작업자·사유, 안내서 p.62 예시 형식)하고 3년 이상 삭제 금지 정책을 설정한다. 전자결재 신청·승인 기록과 연계한다.
  evidence: 이력 화면 스크린샷(ID·이름 마스킹 필요)
  notes: 법령 의무(3년은 고시 수치).
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-05-04-01
  title: 취급자별 계정 발급, 계정 공유 금지
  basis:
  - 기준 제5조제4항
  - 안내서 p.62
  - 제4조제1항제5호
  requirement: 정당한 사유(root 등 기술적으로 개별 발급 불가)가 없으면 취급자별로 계정을 발급하고 공유하지 않는다. 불가피한 공용 계정은 계정 관리대장·접근제어시스템으로 실제 사용자를 식별할 수 있게 한다.
  applies_when: 모든 개인정보처리자
  type: 관찰
  type_note: null
  location:
  - 관리자 로그인 화면
  - 관리자 화면 계정 목록
  - 관리자 화면 상단 사용자 표시
  method: (1) 사용자에게 점검용 관리자 계정이 개인 명의인지 공용인지 묻고 기록한다. (2) 관리자 계정 목록을 조회만 해서 admin, administrator, manager, test, guest, master, 부서명·팀명 같은 공용 형태 ID가 있는지 본다. (3) 로그인 후 화면에 사용자 이름이 표시되는지, 접속기록 화면이 있으면 개인 단위로 기록되는지 본다. (4) 로그인 화면·안내문에 "공용 ID/비밀번호" 안내나 소스 주석에 기본 계정 정보가 있는지 DOM을 검색한다.
  pass: 계정이 개인 단위이고 공용 형태 계정이 없거나, 있어도 사용자 식별 보완통제(관리대장, 접근제어 솔루션 경유)가 서면으로 확인된다.
  fail: 여러 사람이 같은 관리자 계정 사용, 공용 ID 존재 및 식별 수단 없음, 화면·소스에 공용 계정 정보 노출.
  remediation: 취급자별 개인 계정 발급, 공용 계정 비활성화 또는 접근제어 솔루션(개인 인증 후 공용 계정 대리 접속) 적용, 공용 계정 사용 대장 운영(안내서 p.62). 동시 로그인 제한(같은 계정 중복 세션 차단·알림)을 보조 조치로 둔다.
  evidence: 계정 목록 스크린샷(ID 일부·이름 마스킹 필요), 사용자 답변 기록
  notes: 법령 의무. 동시 로그인 차단은 고시·안내서에 없는 보조 조치(권고). 같은 계정 이중 로그인 시험은 사용자 승인 시 사용자가 직접 두 브라우저에서 로그인한다.
  category: 인증·접근통제
  strength: 의무
  default_risk: 중
- id: SAFE-05-05-01
  title: 이용자 비밀번호 작성 규칙(회원가입·비밀번호 변경)
  basis:
  - 기준 제5조제5항, 제2조제8호
  - 안내서 p.63
  - FAQ 4-5 (p.141)
  - 부록 점검항목 19 (p.180~181)
  requirement: 정보주체 인증수단을 유추·탈취되지 않도록 안전하게 적용·관리한다. 비밀번호 구성·변경 기준은 고시가 정하지 않으며 처리자가 환경에 맞게 정한다. 안내서는 추측하기 쉬운 비밀번호(1234, 생년월일 등)와 다크웹 노출 비밀번호 사용 금지, NIST SP 800-63B 참고를 예로 든다.
  applies_when: 모든 개인정보처리자(정보주체 인증 기능이 있는 웹서비스)
  type: 관찰
  type_note: null
  location:
  - 회원가입 화면
  - 비밀번호 변경 화면
  - 비밀번호 재설정 화면
  method: '(1) 화면 안내 문구(최소 길이, 문자 종류, 금지 규칙)를 텍스트로 수집한다. (2) 비밀번호 input의 type, minlength, maxlength, pattern, autocomplete 속성과 연결된 검증 JS(정규식)를 읽기 전용으로 조회한다. (3) maxlength가 짧게(예: 12~16자) 잘려 긴 비밀번호를 막는지 본다. (4) 실제 거부 여부는 사용자가 테스트 계정 비밀번호 변경 화면에서 약한 값(예: 1234, 아이디와 동일, 생년월일)을 직접 입력할 때 저장 전 클라이언트 경고가 나오는지 관찰한다. 저장 버튼 클릭(서버 검증 확인)은 테스트 계정 데이터 변경이므로 사용자가 별도 승인한 경우에만 사용자가 누른다.'
  pass: 처리자가 정한 규칙이 화면에 안내되고 클라이언트·서버에서 일관 적용된다. 최소한 추측 쉬운 값(연속숫자, 아이디·생년월일·전화번호 포함)을 거부한다. 판정 참고값은 아래 비고.
  fail: 규칙 안내·검증이 전혀 없음, 4~6자 숫자만 허용, 아이디와 같은 값 허용, 클라이언트 검증만 있고 서버가 약한 값을 저장(승인 시험에서 확인된 경우), 최대 길이를 지나치게 제한.
  remediation: '비밀번호 정책을 문서로 정하고 화면에 안내한다. 구현 예: `<input type="password" autocomplete="new-password" minlength="8">`와 서버 측 동일 검증, 연속·반복 문자와 아이디·생년월일·전화번호 포함 금지, 유출 비밀번호 목록(예: 노출 비밀번호 해시 대조) 차단(안내서 FAQ 예시), 최대 길이 64자 이상 허용(NIST 외부 참고), 강도 표시기 제공. MFA 선택 제공.'
  evidence: 안내 문구·input 속성 스크린샷 또는 DOM 텍스트, 검증 JS 정규식 발췌(비밀번호 값은 기록하지 않음)
  notes: '고시는 수치를 정하지 않음(안내서 FAQ 4-5). 판정 수치는 사용자 결정 필요. 참고값: (a) NIST SP 800-63B(외부 참고): 최소 8자(단일요소 인증이면 개정판 기준 15자), 64자 이상 허용, 조합 강제·주기 변경 강제보다 유출·취약 목록 차단 우선. (b) 구 「개인정보의 기술적·관리적 보호조치 기준」 해설서 관행(외부 참고, 현행 근거 아님): 2종류 이상 조합 10자리 이상 또는 3종류 이상 8자리 이상. 처리자가 내부 관리계획에 정한 값이 있으면 그 값과 화면이 일치하는지로 판정한다.'
  category: 인증·접근통제
  strength: 의무
  default_risk: 상
- id: SAFE-05-05-02
  title: 관리자(개인정보취급자) 비밀번호 규칙·변경 주기
  basis:
  - 기준 제5조제5항
  - 안내서 p.63
  - FAQ 4-5 (p.141)
  - 부록 점검항목 19 (p.180~181)
  requirement: 취급자 인증수단도 안전하게 적용·관리한다. 안내서 부록은 비밀번호 사용 시 추가 인증수단 적용과, 장기간 동일 비밀번호 사용 위험을 이유로 변경 주기를 정해 적용할 수 있다고 설명한다.
  applies_when: 모든 개인정보처리자
  type: 관찰
  type_note: null
  location:
  - 관리자 로그인 화면
  - 관리자 비밀번호 변경 화면
  - 관리자 최초 로그인
  method: '(1) 관리자 비밀번호 변경 화면의 안내 문구와 input 속성·검증 JS를 수집한다. (2) 사용자에게 관리자 비밀번호 변경 주기 알림(예: "비밀번호를 변경한 지 90일이 지났습니다") 경험 여부와 초기 비밀번호 강제 변경 여부를 묻는다. (3) 관리자 계정 생성 화면이 있으면 초기 비밀번호를 관리자가 일괄 고정값으로 주는 구조인지 조회만 한다.'
  pass: 이용자보다 같거나 강한 규칙, 초기 비밀번호 최초 로그인 시 변경 강제, 처리자가 정한 변경 주기(정했다면) 적용 또는 MFA 적용.
  fail: 관리자 비밀번호 규칙 없음, 초기 비밀번호가 공통 고정값이고 변경 강제 없음, 기본 계정(admin/admin 등) 사용 정황.
  remediation: 관리자 비밀번호 정책(길이·금지 규칙·재사용 금지·변경 주기) 문서화와 시스템 적용, 최초 로그인 시 변경 강제, 관리자 MFA 적용(SAFE-06-02-01). 변경 주기는 안내서 부록 p.181이 "정하여 적용할 수 있다"고 한 권고 사항이다.
  evidence: 안내 문구·속성 캡처, 사용자 답변 기록
  notes: 변경 주기 수치는 고시·안내서 모두 정하지 않음. 구 해설서 관행 "반기 1회 이상"은 외부 참고이며, NIST는 주기 변경 강제를 권하지 않음(유출 시 변경). 판정 기준 사용자 결정 필요.
  category: 인증·접근통제
  strength: 외부참고
  default_risk: 하
- id: SAFE-05-05-03
  title: 비밀번호 분실·재발급 절차의 안전성
  basis:
  - 기준 제5조제5항
  - 안내서 p.63
  requirement: 인증정보 재발급 시 정당한 사용자 확인 수단(SMS, 이메일 등)으로 임시 인증정보를 주고, 이용자가 확인 후 접속해 변경하게 한다.
  applies_when: 모든 개인정보처리자
  type: 능동
  type_note: null
  location:
  - 비밀번호 찾기·재설정 화면
  - 아이디 찾기 화면
  method: '(1) 관찰: 찾기 화면의 입력 항목과 안내 문구, 결과 화면 구조(DOM)를 확인한다. (2) 능동(승인): 사용자가 본인 테스트 계정으로 재설정을 진행하고 Claude는 화면과 네트워크 응답을 관찰한다. 기존 비밀번호가 화면·메일·응답에 평문으로 나오는지, 임시 비밀번호가 본인확인 없이 화면에 바로 표시되는지, 재설정 링크가 일회용·만료되는지(사용자가 재사용 시도), 임시 비밀번호로 로그인 후 변경이 강제되는지 본다. (3) 아이디 찾기 결과가 전체 ID를 본인확인 없이 보여주는지(마스킹 여부) 관찰한다.'
  pass: 등록된 휴대전화·이메일로 본인 확인 후 일회용 링크나 임시 비밀번호를 발송하고, 로그인 후 변경을 강제한다. 기존 비밀번호를 보여주지 않는다.
  fail: 기존 비밀번호 평문 회신(저장 암호화 위반 정황, 제7조와 연계), 이름·생년월일 등 공개 가능 정보만으로 재설정, 임시 비밀번호를 화면에 즉시 표시, 재설정 링크 무기한 재사용 가능, 응답 JSON에 임시 비밀번호 포함.
  remediation: '등록 연락처로 일회용 토큰 링크(유효시간 예: 30분 이내, 1회 사용) 발송, 임시 비밀번호 사용 시 첫 로그인에서 변경 강제(안내서 p.63 예시), 재설정 완료 시 알림 발송과 기존 세션 무효화. 아이디 찾기 결과는 일부 마스킹 또는 등록 연락처로만 발송.'
  evidence: 각 단계 화면 스크린샷(연락처·ID 마스킹 필요), 네트워크 응답 본문 발췌(토큰 값 마스킹)
  notes: 법령 의무 + 안내서 예시. 재설정은 테스트 계정 상태 변경과 메시지 발송이 따르므로 사용자 승인과 직접 입력이 필수. 유효시간 수치는 원문에 없음(권고).
  category: 인증·접근통제
  strength: 의무
  default_risk: 중
- id: SAFE-05-05-04
  title: 인증정보 입력·전달 방식(화면 표시·URL·계정 정보 노출)
  basis:
  - 기준 제5조제5항
  - 안내서 p.63, p.71(로그인 시 정당 사용자 확인 수단, 인증 우회 대비)
  requirement: 인증수단이 쉽게 유추·탈취되지 않도록 적용한다.
  applies_when: 모든 개인정보처리자
  type: 관찰
  type_note: null
  location:
  - 로그인 화면(이용자·관리자)
  - 회원가입
  - 비밀번호 변경
  method: (1) 비밀번호 칸이 type="password"인지 확인. (2) 사용자가 로그인할 때 네트워크 요청을 관찰해 비밀번호가 URL 쿼리스트링(GET)으로 전송되지 않는지, 응답·리다이렉트 URL·로그·localStorage에 비밀번호나 장기 토큰이 평문 저장되지 않는지 확인(값은 기록하지 않고 존재 여부만). (3) 로그인 실패 메시지가 "존재하지 않는 아이디"와 "비밀번호 오류"를 구분해 계정 존재를 알려주는지 화면 문구로 확인(사용자가 실패 시험에 승인한 경우 SAFE-05-06-01과 함께). (4) "로그인 상태 유지(자동 로그인)" 기능이 관리자 화면에 있는지 확인.
  pass: 비밀번호 마스킹, POST 본문 전송, 저장소에 평문 인증정보 없음, 실패 메시지가 일반화되어 있음, 관리자 화면에 자동 로그인 없음.
  fail: URL에 비밀번호 포함, localStorage에 비밀번호 저장, 관리자 자동 로그인 제공, 계정 존재 여부를 그대로 알려줌(권고 수준).
  remediation: 비밀번호는 POST 본문으로만 전송, 저장소에는 HttpOnly·Secure·SameSite 세션 쿠키만 사용, 실패 문구는 "아이디 또는 비밀번호가 올바르지 않습니다"로 통일, 관리자 화면에서 자동 로그인 제거(안내서 p.74는 재접속 시 자동 로그인을 접속 차단 미조치 예시로 듦).
  evidence: input 속성, 로그인 요청 메서드·URL(값 마스킹), 저장소 키 목록 캡처
  notes: 계정 존재 노출(사용자 열거)은 안내서에 직접 수치·예시가 없는 권고 사항. 전송 구간 암호화(HTTPS)는 제7조 담당 범위에서 판정.
  category: 인증·접근통제
  strength: 권고
  default_risk: 하
- id: SAFE-05-06-01
  title: 인증 실패 시 접근 제한(이용자 로그인)
  basis:
  - 기준 제5조제6항
  - 안내서 p.64, p.71(캡차·임계치 모니터링 예시)
  - FAQ 4-3, 4-4 (p.140~141)
  - 제6조제1항(크리덴셜 스터핑 탐지, 안내서 p.68)
  requirement: 일정 횟수 이상 인증에 실패하면 접근을 제한한다. 웹사이트 일반 이용자도 대상이다(FAQ 4-3). 횟수는 시스템 특성·위험 분석으로 처리자가 정한다. 방법은 즉시 계정 잠금 또는 재시도 지연이며, 캡차는 봇 차단의 부수 수단이다. 지연·캡차만 쓰면 무제한 재시도가 되지 않도록 일정 횟수 이상 실패 시 잠금 등 추가 제한이 필요하다(FAQ 4-4).
  applies_when: 모든 개인정보처리자(이용자 로그인 기능이 있는 웹서비스)
  type: 능동
  type_note: null
  location:
  - 이용자 로그인 화면
  - 앱·API 로그인 엔드포인트(네트워크 요청으로 식별)
  method: '(1) 관찰: 로그인 화면·도움말에 "N회 실패 시 잠금" 안내가 있는지 수집. (2) 능동(승인): 사용자가 테스트 계정으로 틀린 비밀번호를 직접 반복 입력한다(최대 10회 등 사전 합의한 횟수). Claude는 매 시도의 응답 메시지, 남은 횟수 표시, 캡차 등장 시점, 지연 시간, 잠금 메시지를 기록한다. (3) 잠금 후 사용자가 올바른 비밀번호로 로그인해 실제로 차단되는지 확인한다. (4) 잠금이 시간 경과 해제 방식이면 해제까지 시간을 기록한다. (5) 웹 로그인과 별도로 모바일 API 로그인 경로가 네트워크 목록에 보이면 같은 정책인지 사용자와 상의(추가 시도는 별도 승인).'
  pass: 처리자가 정한 횟수 이내에서 계정 잠금 또는 지연+최종 잠금이 동작하고, 잠금 후 올바른 비밀번호로도 로그인되지 않으며, 해제 시 본인확인을 거친다.
  fail: 10회 이상(사전 합의 상한) 실패해도 아무 제한 없음, 캡차만 있고 캡차 통과 후 무제한 재시도, 지연만 있고 잠금 없음, 잠금 표시만 나오고 올바른 비밀번호로는 로그인됨, 실패 횟수를 클라이언트(쿠키·localStorage)에만 저장해 초기화로 우회 가능(관찰로 확인된 경우).
  remediation: '서버 측 계정 단위 실패 카운터와 잠금(예: 5회 연속 실패 시 잠금 또는 단계적 지연 후 잠금), 일정 횟수 이후 캡차 적용(안내서 p.71 예시), 잠금 시 이용자 알림, IP·기기 단위 속도 제한, 로그인 실패 급증 탐지(크리덴셜 스터핑, 안내서 p.68 예시). 잠금 해제는 본인확인(SMS·이메일 인증) 후 처리.'
  evidence: 시도 회차별 화면 메시지 스크린샷, 로그인 요청·응답 상태코드 목록(비밀번호 값 제외), 잠금 안내 화면
  notes: 법령 의무. 횟수 수치는 고시·안내서에 없음(처리자 결정, 안내서 p.64). 참고값 "5회"는 구 보호조치 기준 해설서·업계 관행(외부 참고)으로 판정 기준 채택은 사용자 결정 필요. 테스트 계정이 실제로 잠기므로 해제 방법을 사전에 확인한다. 안내서는 제6항을 '26.11.1 시행으로 표기.
  category: 인증·접근통제
  strength: 의무
  default_risk: 상
- id: SAFE-05-06-02
  title: 인증 실패 시 접근 제한(관리자·취급자 로그인)
  basis:
  - 기준 제5조제6항
  - 안내서 p.64
  - 부록 점검항목 20 (p.181)
  requirement: 개인정보취급자 로그인도 일정 횟수 이상 실패 시 접근을 제한하고, 재허용은 정당한 자 확인 후 한다. DB 직접 접속은 DBMS 입력 횟수 제한 기능을 쓴다(부록).
  applies_when: 모든 개인정보처리자
  type: 능동
  type_note: null
  location:
  - 관리자 로그인 화면
  - 판매자·파트너 센터 로그인
  method: SAFE-05-06-01과 같은 절차를 점검 전용 관리자 계정으로 사용자가 직접 수행. 운영 관리자 계정으로는 하지 않는다. DB·서버 계정은 서면 확인(DBMS 잠금 정책 설정 화면 캡처 요청).
  pass: 처리자가 정한 횟수에서 잠금되고, 해제는 상위 관리자 승인 또는 본인확인 절차를 거친다.
  fail: 실패 제한 없음, 잠금 해제가 무조건 자동(짧은 시간 후)이고 무제한 재시도 가능, 관리자 화면에 캡차·지연도 없음.
  remediation: '관리자 계정 잠금(예: 5회) 및 관리자 승인 해제 절차, 잠금 이벤트 알림·로그, 관리자 MFA(SAFE-06-02-01), DBMS 프로파일(예: 실패 로그인 횟수 제한) 설정.'
  evidence: 회차별 메시지 스크린샷, 서면 자료(DBMS 정책)
  notes: 법령 의무. 횟수 수치 사용자 결정 필요(SAFE-05-06-01 비고와 같음).
  category: 인증·접근통제
  strength: 의무
  default_risk: 상
- id: SAFE-05-06-03
  title: 잠금 해제 시 정당한 사용자 확인
  basis:
  - 기준 제5조제6항
  - 안내서 p.64
  - 부록 점검항목 20 (p.181)
  requirement: 접근이 제한된 자를 재허용할 때는 반드시 정당한 자인지 확인한 뒤 해제한다. 신속한 해제 절차를 마련한다.
  applies_when: 모든 개인정보처리자
  type: 능동
  type_note: null
  location:
  - 계정 잠금 안내 화면
  - 잠금 해제 화면
  method: SAFE-05-06-01·02 시험으로 잠긴 테스트 계정을 사용자가 해제하는 과정을 관찰한다. 해제 수단(SMS·이메일 인증, 고객센터, 관리자 승인)과 본인확인 없이 "잠금 해제" 버튼만으로 풀리는지 확인.
  pass: 등록 연락처 인증 또는 관리자 승인 후 해제된다.
  fail: 본인확인 없이 해제되거나, 아이디만 입력하면 해제 메일이 아닌 즉시 해제된다.
  remediation: 해제 시 등록 휴대전화·이메일 인증 후 비밀번호 재설정 동반, 관리자 계정은 상위 관리자 승인과 이력 기록.
  evidence: 해제 단계 스크린샷(연락처 마스킹 필요)
  notes: 법령 의무(해설 해석).
  category: 인증·접근통제
  strength: 의무
  default_risk: 중
- id: SAFE-06-01-01
  title: 관리자 화면(개인정보처리시스템) 접속 IP 제한
  basis:
  - 기준 제6조제1항제1호
  - 안내서 p.65~67, p.71(관리자 페이지 노출 금지)
  - FAQ 5-1 (p.142)
  requirement: 개인정보처리시스템 접속 권한을 IP·포트·MAC 등으로 제한해 인가받지 않은 접근을 막는다(침입차단 기능).
  applies_when: 모든 개인정보처리자
  type: 관찰
  type_note: null
  location:
  - 관리자 화면 URL
  - 판매자·파트너 센터
  - API 관리 콘솔
  method: '(1) 사용자에게 관리자 URL과, 점검 PC가 허용 IP 목록에 들어 있는지 확인한다. (2) 허용 대역 밖 PC(사용자 협조: 모바일 데이터망 등)에서 관리자 URL을 GET으로 열어 로그인 화면이 노출되는지, 403·연결 거부·사내망 전용 안내가 나오는지 관찰한다. (3) 응답 헤더·오류 페이지로 차단 주체(WAF, 웹서버)를 기록한다. (4) 관리자 로그인 API를 외부망에서 호출하지는 않는다.'
  pass: 허용 IP 외에서 관리자 화면 접근이 차단된다(로그인 화면도 보이지 않음). 업무상 외부 접속이 필요하면 VPN 경유 등으로만 열려 있다.
  fail: 인터넷 어디서나 관리자 로그인 화면에 접근 가능하고 IP 제한이 없다.
  remediation: '웹서버·WAF·보안그룹에서 관리자 경로 IP 허용목록 적용. 예: Nginx `location /admin { allow 203.0.113.0/24; deny all; }`, 클라우드 보안그룹·ALB 규칙, 관리자 화면을 별도 도메인·포트·내부망으로 분리. 원격 접속은 VPN+MFA. 정책은 정기 검토(안내서 p.68 정책검토 예시).'
  evidence: 외부망 접속 결과 화면, 응답 상태코드·헤더(내부 IP 등 마스킹)
  notes: 법령 의무(IP "등"이므로 다른 동등 수단도 인정). 외부망 접속이 불가하면 "점검 불가(서면 확인)"로 남기고 방화벽 정책 사본을 요청한다. 외부 접근 가능하면 SAFE-06-02-01(안전한 인증수단) 적용이 필수 판단 대상이 된다.
  category: 인증·접근통제
  strength: 의무
  default_risk: 상
- id: SAFE-06-01-02
  title: 접속 IP 분석에 의한 유출 시도 탐지·대응
  basis:
  - 기준 제6조제1항제2호
  - 안내서 p.66~68
  - FAQ 5-1, 5-2 (p.142)
  - 부록 점검항목 6~10 (p.183 부근)
  requirement: 접속 IP·포트·MAC과 이상행위(과도한 접속 성공·실패, 부적절한 명령어 패킷)를 분석해 유출 시도를 탐지하고 차단 등 대응한다. 장비 설치만으로는 부족하고 정책 갱신·이상행위 대응·로그 분석을 운영해야 한다. 아웃바운드 통제도 포함.
  applies_when: 모든 개인정보처리자
  type: 서면
  type_note: null
  location: []
  method: '서면 확인: 방화벽·IPS·WAF 정책 목록과 최근 갱신일, 탐지 이벤트·대응 기록, 정책 검토 기록, 해외 IP·비인가 IP 차단 정책, 로그인 실패 급증 탐지 규칙.'
  pass: 차단·탐지 기능이 모두 있고 정책 갱신과 이벤트 대응 기록이 있다.
  fail: 장비는 있으나 기본 정책 방치, 탐지 이벤트 미검토, 아웃바운드 무제한.
  remediation: 방화벽/WAF/IPS(또는 클라우드 보안서비스) 운영, 신규 취약점 시 룰 업데이트, 미사용·과다 허용 정책 정기 정리, 크리덴셜 스터핑·과다 트래픽 탐지·차단(안내서 p.67~68 예시), 네트워크 세분화와 RDP·SSH 외부 차단.
  evidence: 서면 자료 목록
  notes: 법령 의무. 브라우저에서 확인 가능한 정황(로그인 실패 반복 시 차단·캡차 등장)은 SAFE-05-06-01에서 함께 기록한다. 공격성 트래픽 발생 시험은 하지 않는다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-06-02-01
  title: 외부 접속 시 안전한 인증수단(관리자 2차 인증)
  basis:
  - 기준 제6조제2항
  - 안내서 p.68~69
  - FAQ 5-4, 5-10 (p.143~144)
  requirement: 정당한 접근 권한자(정보주체 제외)가 정보통신망으로 외부에서 개인정보처리시스템에 접속할 때 인증서·보안토큰·일회용 비밀번호(OTP) 등 안전한 인증수단을 적용한다(비밀번호 외 추가 인증). 이용자가 아닌 정보주체(임직원 등)만 처리하는 시스템은 VPN·전용선 등 안전한 접속수단 또는 안전한 인증수단 중 하나 이상을 적용할 수 있다.
  applies_when: 모든 개인정보처리자. 이용자(정보통신서비스 이용자) 개인정보를 처리하는 시스템은 안전한 인증수단 필수
  type: 관찰
  type_note: null
  location:
  - 관리자 로그인 화면·로그인 후 단계
  - 판매자·파트너 센터
  - 원격 접속(VPN) 포털
  method: (1) 사용자가 외부(점검 PC) 환경에서 관리자 로그인하는 과정을 관찰해 ID/비밀번호 다음에 OTP 입력, 인증서 선택, 보안토큰, 푸시 승인 등 2단계가 있는지 기록한다. (2) 2단계 화면을 건너뛰고 관리자 메인 URL을 GET으로 직접 열 때 접근이 막히는지 확인(1단계만 통과한 세션 상태에서). (3) "이 기기 기억하기" 등으로 2차 인증이 장기간 생략되는지 확인. (4) 외부 접속 경로가 VPN이면 VPN 로그인에도 2차 인증이 있는지 사용자 답변·화면으로 확인.
  pass: 외부에서 관리자 화면 접속 시 비밀번호 외 OTP·인증서·보안토큰 등 추가 인증이 강제되고, 2단계를 우회할 수 없다. 임직원 정보만 처리하는 시스템은 VPN 또는 추가 인증 중 하나 이상.
  fail: 외부에서 ID/비밀번호만으로 관리자 화면 접속 가능, 2단계 URL 직접 접근으로 우회 가능, 이용자 정보 처리 시스템에 VPN(비밀번호만)만 있고 추가 인증 없음.
  remediation: '관리자 로그인에 TOTP(OTP 앱)·하드웨어 토큰·인증서 기반 MFA 적용, 서버 측에서 MFA 완료 플래그가 없는 세션의 관리자 API 접근 거부, "기기 기억" 기간 최소화. VPN에도 MFA 적용(FAQ 5-10 권고: VPN 계정 도용 사고 증가). 안내서 p.34 추가 조치 예시처럼 내부망 접속에도 MFA를 권장.'
  evidence: 로그인 단계별 화면 스크린샷(OTP 값·ID 마스킹), 우회 시도 응답 상태코드
  notes: 법령 의무. 안내서는 제2항을 '26.11.1 시행으로 표기. SMS 인증번호를 "일회용 비밀번호"로 인정할지는 원문에 명시가 없어 사용자 결정 필요(안내서 p.68 OTP 정의는 "무작위 생성 일회용 값"). 외부 접속 자체가 차단되어 있으면(SAFE-06-01-01 양호) 이 항목은 "해당 없음"이 아니라 "외부 접속 경로(VPN 등)에 대해 서면 확인"으로 처리.
  category: 인증·접근통제
  strength: 의무
  default_risk: 상
- id: SAFE-06-03-01
  title: 검색엔진을 통한 개인정보·관리자 페이지 노출
  basis:
  - 기준 제6조제3항
  - '안내서 p.70(유·노출 유형: 검색엔진), p.72(검색엔진 노출 방지)'
  requirement: 홈페이지 설계·개발 오류나 취급자 부주의로 검색엔진(구글링 등)을 통해 관리자 페이지와 개인정보가 노출되지 않도록 조치한다.
  applies_when: 모든 개인정보처리자(인터넷 홈페이지 운영)
  type: 관찰
  type_note: null
  location:
  - robots.txt
  - sitemap.xml
  - 검색엔진 결과
  - 개인정보 포함 페이지의 메타 태그
  method: (1) /robots.txt, /sitemap.xml을 GET으로 열어 관리자·업로드·마이페이지 경로가 차단되는지, 반대로 robots.txt가 숨겨진 관리자 경로를 드러내는지 본다. (2) 사용자 동의 하에 검색엔진에서 `site:대상도메인` 과 `filetype:xls|xlsx|csv|pdf|hwp`, `inurl:admin`, "주민등록번호", "연락처", "명단" 등 조합으로 검색하고 결과 목록(제목·스니펫)만 확인한다. 결과 파일은 내려받지 않는다. (3) 로그인 후 화면(마이페이지, 주문 상세)에 `<meta name="robots" content="noindex">` 또는 X-Robots-Tag 헤더가 있는지, 인증 없이 열리는지 확인.
  pass: 검색 결과에 개인정보·관리자 화면·내부 문서가 나오지 않는다. 개인정보 화면은 인증이 필요하다.
  fail: 검색 결과에 개인정보가 담긴 페이지·첨부파일·관리자 로그인 화면이 색인되어 있다.
  remediation: '노출 페이지 즉시 삭제·접근통제 후 검색엔진 삭제 요청(구글 Search Console 삭제 도구 등), robots.txt에 업로드·관리 경로 Disallow(단 robots.txt는 보안 수단이 아니므로 인증·IP 제한 병행), 개인정보 화면에 `X-Robots-Tag: noindex, nofollow`, 정기적 검색엔진 노출 점검(안내서 p.71 운영·관리 예시).'
  evidence: 검색 결과 목록 스크린샷(개인정보 스니펫 마스킹 필요), robots.txt 내용
  notes: 법령 의무(조치 방법은 안내서 예시). 검색 결과에서 개인정보가 보이면 열람을 최소화하고 URL만 기록한다.
  category: 노출·출력
  strength: 의무
  default_risk: 상
- id: SAFE-06-03-02
  title: 관리자 페이지 노출(링크·추측 가능한 주소)
  basis:
  - 기준 제6조제3항
  - 안내서 p.71(관리자 페이지 링크 생성 금지, 추측 어려운 주소, 노출 금지), p.72
  requirement: 홈페이지에 관리자 페이지 링크를 만들지 않고, 관리자 주소는 쉽게 추측하기 어렵게 하며, 관리자 페이지를 노출하지 않는다.
  applies_when: 모든 개인정보처리자(인터넷 홈페이지 운영)
  type: 관찰
  type_note: null
  location:
  - 전 화면(헤더·푸터·소스)
  - 흔한 관리자 경로
  method: (1) 공개 화면의 DOM·JS 번들·주석에서 admin, manager, adm, mng, backoffice, cms, console 등 관리자 경로 문자열을 검색한다. (2) 흔한 경로(/admin, /administrator, /adm, /manager, /mng, /backoffice, /cms, /wp-admin, /admin/login.jsp 등)를 GET으로 소수만 열어 관리자 로그인 화면이 나오는지 확인한다(대량 스캔 금지, 사용자와 목록 합의). (3) 서브도메인(admin.도메인 등)은 사용자가 알려준 것만 확인.
  pass: 공개 화면·소스에 관리자 링크가 없고, 흔한 경로로 관리자 화면이 나오지 않거나 IP 제한으로 차단된다.
  fail: 푸터 등에 "관리자" 링크, JS·주석에 관리자 URL·API 경로 노출, /admin 등으로 외부에서 관리자 로그인 화면 접근 가능.
  remediation: 공개 페이지에서 관리자 링크·주석 제거, 프런트 번들에서 관리자 라우트 분리(별도 앱·도메인), 관리자 주소를 추측 어렵게 변경하되 IP 제한(SAFE-06-01-01)·MFA(SAFE-06-02-01)를 함께 적용(안내서 p.71 예시).
  evidence: 소스 발췌(파일명·줄), 경로별 응답 상태코드 목록
  notes: 안내서 예시 기반. 주소 은닉만으로는 보안 수단이 아니므로 IP 제한 결과와 함께 판정.
  category: 노출·출력
  strength: 권고
  default_risk: 상
- id: SAFE-06-03-03
  title: 디렉터리 리스팅·백업/임시 파일·미관리 URL 노출
  basis:
  - 기준 제6조제3항
  - 안내서 p.71(임시 저장 페이지에 개인정보 사용 금지, 서비스하지 않거나 관리되지 않는 사이트·URL 점검·삭제·차단, Security Misconfiguration)
  requirement: 임시 페이지·미사용 URL·설정 오류로 개인정보가 노출되지 않도록 점검하고 삭제·차단한다.
  applies_when: 모든 개인정보처리자(인터넷 홈페이지 운영)
  type: 관찰
  type_note: null
  location:
  - 업로드·첨부 디렉터리
  - 정적 자원 경로
  - 구버전·테스트 페이지
  method: '(1) 첨부파일·이미지 URL에서 상위 디렉터리(예: /upload/, /files/, /data/)를 GET으로 열어 "Index of" 등 목록이 표시되는지 확인한다. (2) 사용자와 합의한 소수 경로(/test, /dev, /backup, /old, /temp, .git/HEAD, /.env, /phpinfo.php, /server-status)를 GET으로 열어 존재 여부만 기록한다. 내용에 개인정보·자격증명이 있으면 더 열람하지 않고 즉시 중단·보고. (3) 사이트 내 링크 중 구 도메인·종료된 이벤트 페이지가 응답하는지 확인.'
  pass: 디렉터리 목록이 표시되지 않고, 테스트·백업·설정 파일이 외부에서 열리지 않는다.
  fail: 디렉터리 리스팅 활성, 백업·설정 파일·.git 노출, 종료된 이벤트 페이지에 참여자 명단 등 개인정보 잔존.
  remediation: 웹서버 디렉터리 리스팅 비활성(Apache `Options -Indexes`, Nginx `autoindex off;`, IIS 디렉터리 검색 해제), 업로드 파일을 웹 루트 밖에 저장하고 인증된 다운로드 핸들러로 제공, 배포물에서 .git·.env·백업 파일 제외, 미사용 사이트·URL 정기 점검·폐쇄(안내서 p.71 예시).
  evidence: 해당 URL과 응답 상태코드, 목록 화면 스크린샷(파일명에 개인정보가 있으면 마스킹 필요)
  notes: '"디렉터리 리스팅"이라는 용어는 안내서에 직접 없음(Security Misconfiguration·미관리 URL 예시로 포섭). 경로 탐색은 GET만, 소수만, 사용자 합의 목록으로 한정.'
  category: 노출·출력
  strength: 의무
  default_risk: 상
- id: SAFE-06-03-04
  title: 게시판 게시글·첨부파일을 통한 개인정보 노출
  basis:
  - 기준 제6조제3항
  - 안내서 p.70(인터넷 게시판 유·노출), p.71(게시글·첨부파일 개인정보 포함 금지·정기 점검·삭제, 엑셀 숨기기 기능에 의한 유·노출 금지)
  requirement: 게시글·첨부파일에 개인정보가 포함되지 않게 하고 정기 점검·삭제한다. 엑셀 숨긴 행·열·시트로 개인정보가 유출되지 않게 한다.
  applies_when: 모든 개인정보처리자(게시판 운영)
  type: 관찰
  type_note: null
  location:
  - 공지사항
  - 자유게시판
  - Q&A
  - 당첨자 발표
  - 자료실
  - 공개 첨부파일
  method: (1) 공개 게시판 목록·본문 텍스트를 수집해 주민등록번호·휴대전화·이메일·주소·계좌번호 패턴을 정규식으로 검색한다. (2) 당첨자·합격자 발표 글에서 성명·연락처가 마스킹되어 있는지 본다. (3) 첨부파일은 파일명·확장자·크기만 기록하고, 내용 확인이 필요하면 다운로드 전에 사용자 승인을 받는다(파일명·출처·크기 고지). 받은 엑셀은 숨김 행·열·시트 여부를 확인한다. (4) 비밀글 표시 글이 목록에서 제목·작성자 전체를 드러내는지 관찰만 한다(타인 비밀글 열람 시도 금지).
  pass: 공개 영역에 식별 가능한 개인정보가 없고, 발표 글은 마스킹되어 있으며, 첨부파일에 숨김 개인정보가 없다.
  fail: 게시글·댓글·첨부에 주민등록번호·연락처 등 원문 노출, 당첨자 명단 미마스킹, 엑셀 숨김 시트에 개인정보.
  remediation: '게시 시 개인정보 패턴 필터(등록 차단·자동 마스킹), 관리자 정기 점검·삭제 절차(안내서 p.71 예시), 발표 글 마스킹 기준(예: 홍*동, 010-****-1234), 첨부 업로드 전 개인정보 검출 도구 적용, 엑셀 공개 전 숨김 시트·행 제거 확인.'
  evidence: 해당 게시글 URL·화면(개인정보 마스킹 필요), 정규식 매칭 건수
  notes: 법령 의무(방법은 안내서 예시). 첨부파일 다운로드는 사용자 승인 필수. 마스킹 위치 기준은 제12조(출력 시 안전조치) 담당 항목과 맞춘다.
  category: 노출·출력
  strength: 의무
  default_risk: 상
- id: SAFE-06-03-05
  title: URL·소스코드·주석·숨은 필드·응답 데이터에 포함된 개인정보
  basis:
  - 기준 제6조제3항
  - 안내서 p.71(URL·소스코드·임시 저장 페이지 개인정보 사용 금지, 웹서버로부터 전달받는 정보에 불필요한 개인정보 포함 금지), p.70(설계·구현 오류)
  requirement: 홈페이지 주소(URL), 소스코드, 임시 저장 페이지에 개인정보를 쓰지 않고, 화면 출력을 위해 서버가 보내는 데이터에 불필요한 개인정보를 넣지 않는다.
  applies_when: 모든 개인정보처리자(인터넷 홈페이지·앱 운영)
  type: 관찰
  type_note: null
  location:
  - 마이페이지
  - 주문·예약 상세
  - 회원정보 수정
  - 관리자 회원 목록·상세
  - 검색 결과
  - 전 화면 URL
  method: (1) 탐색 중 주소창·네트워크 요청 URL의 쿼리스트링에 이름·전화번호·이메일·주민등록번호·주소·생년월일이 들어가는지 기록한다. (2) 페이지 HTML의 주석(<!-- -->), hidden input, data-* 속성, 인라인 스크립트 변수에 개인정보가 있는지 DOM을 검색한다. (3) API 응답 본문(JSON)을 읽어 화면에 표시되지 않는 필드(주민등록번호, 전체 전화번호, 비밀번호 해시, 내부 메모, 다른 회원 정보)가 있는지, 화면은 마스킹인데 응답은 원문인지 비교한다. (4) localStorage·sessionStorage·쿠키 값에 개인정보가 평문 저장되는지 확인. (5) 콘솔 로그에 응답 객체·개인정보가 출력되는지 확인.
  pass: URL·소스·저장소에 개인정보가 없고, 응답은 화면 표시에 필요한 최소 필드만 마스킹된 상태로 내려온다.
  fail: 'URL에 개인정보(예: ?phone=010...), 주석·hidden 필드에 개인정보·테스트 계정, 화면은 마스킹이지만 응답 JSON에 원문, 응답에 비밀번호(해시 포함)·주민등록번호 등 불필요 항목, 콘솔에 개인정보 출력.'
  remediation: 개인정보는 POST 본문·서버 세션으로 전달하고 URL에는 불투명 식별자만 사용, 서버에서 응답 DTO를 화면별로 정의해 필요한 필드만 직렬화, 마스킹은 서버에서 수행(클라이언트 마스킹 금지), 운영 빌드에서 주석·console.log 제거, 저장소에는 개인정보 저장 금지(안내서 p.71 예시 + 구현 예시).
  evidence: 해당 URL(값 마스킹), 응답 본문 필드 목록(값 마스킹 필요), DOM 발췌 위치
  notes: 법령 의무(방법은 안내서 예시). 점검자 본인(테스트 계정) 데이터만 대상으로 하며 타인 데이터 조회 시험은 하지 않는다. 관리자 화면 응답에 실제 고객 정보가 보이면 필드 구조만 기록하고 값은 남기지 않는다.
  category: 노출·출력
  strength: 의무
  default_risk: 상
- id: SAFE-06-03-06
  title: 화면 노출 최소화·조회 범위 제한·마스킹
  basis:
  - 기준 제6조제3항
  - 안내서 p.71(홈페이지·관리자 페이지 개인정보 최소 노출, 조회 범위 제한, 중요 개인정보 마스킹)
  requirement: 홈페이지와 관리자 페이지에서 정보주체 개인정보가 최소한으로 노출되도록 하고, 과도하게 노출되지 않게 조회 범위를 제한하며 중요 개인정보를 마스킹한다.
  applies_when: 모든 개인정보처리자
  type: 관찰
  type_note: null
  location:
  - 관리자 회원 목록·검색
  - 주문·배송 관리
  - 이용자 마이페이지
  - 아이디 찾기 결과
  method: (1) 관리자 회원 목록이 검색 조건 없이 전체 회원을 기본 표시하는지, 페이지당 건수 상한이 있는지 관찰. (2) 목록 화면에서 전화번호·이메일·주소·생년월일이 마스킹되는지, 상세 보기(마스킹 해제)는 별도 권한·사유 입력이 필요한지 확인(해제 버튼은 누르지 않거나 사용자 승인 후 테스트 데이터로만). (3) 응답 본문과 화면 마스킹이 일치하는지 SAFE-06-03-05와 함께 확인.
  pass: 기본 조회는 검색 조건 필수이거나 범위가 제한되고, 목록은 마스킹, 원문 조회는 권한·사유·로그가 남는다.
  fail: 전체 회원 무조건 일괄 표시, 목록에 원문 개인정보, 누구나 마스킹 해제 가능.
  remediation: '검색 조건 필수·최대 조회 건수 제한, 목록 마스킹(예: 홍*동, 010-****-5678, ab***@ex.com), 마스킹 해제는 별도 권한과 사유 입력·접속기록 남김(안내서 p.71 예시).'
  evidence: 목록 화면 구조 스크린샷(실제 개인정보는 마스킹 필요)
  notes: 법령 의무(방법은 안내서 예시). 출력 시 마스킹 기준은 제12조 담당 항목과 중복되므로 보고서에서 하나로 묶을 수 있다.
  category: 노출·출력
  strength: 의무
  default_risk: 중
- id: SAFE-06-03-07
  title: 회원정보 열람·수정 시 추가 본인 확인
  basis:
  - 기준 제6조제3항
  - 안내서 p.71(열람·수정 가능 시 정보 노출 최소화, 수정 시 인증정보 외 추가 본인확인, 개인정보 페이지 로그인 시 SMS·이메일 등 정당 사용자 확인 수단)
  requirement: 홈페이지에서 회원정보를 열람·수정할 수 있으면 노출을 최소화하고, 수정 시 로그인 인증정보 외 추가 본인확인 절차를 둔다.
  applies_when: 모든 개인정보처리자(회원 서비스)
  type: 관찰
  type_note: null
  location:
  - 마이페이지
  - 회원정보 수정
  - 연락처·이메일·비밀번호 변경
  method: (1) 로그인 상태에서 회원정보 수정 메뉴 진입 시 비밀번호 재확인 또는 휴대폰·이메일 인증이 요구되는지 관찰(입력은 사용자). (2) 연락처·이메일 변경 시 새 연락처 인증이 필요한지 화면 흐름만 확인(저장 금지). (3) 회원정보 화면에서 주요 항목이 마스킹되어 있는지 확인.
  pass: 수정 화면 진입 또는 저장 전 추가 본인확인이 있고, 열람 화면은 마스킹된다.
  fail: 로그인 세션만으로 비밀번호·연락처 변경 가능(현재 비밀번호 확인 없음), 회원정보 전체 원문 노출.
  remediation: 회원정보 수정 진입 시 비밀번호 재입력, 비밀번호 변경 시 현재 비밀번호 확인, 연락처·이메일 변경 시 신규 수단 인증, 변경 완료 알림 발송(안내서 p.71 예시).
  evidence: 진입 흐름 스크린샷(개인정보 마스킹 필요)
  notes: 안내서 예시 기반 권고에 가까움. 판정 시 "취약" 대신 "권고"로 낮출지 사용자 결정 필요.
  category: 노출·출력
  strength: 권고
  default_risk: 하
- id: SAFE-06-03-08
  title: 오류 메시지·인증 우회·안전한 설계 결함으로 인한 노출
  basis:
  - 기준 제6조제3항
  - 안내서 p.70(설계·구현 오류), p.71(인증 우회 대비, 시큐어 코딩), p.72(에러 처리, 세션 관리, 시큐어 코딩 항목)
  requirement: 에러·오류 처리 미흡, 인증 우회, 잘못된 세션에 의한 정보 노출 등 설계·구현 오류로 개인정보가 노출되지 않도록 시큐어 코딩을 적용한다.
  applies_when: 모든 개인정보처리자
  type: 관찰
  type_note: null
  location:
  - 존재하지 않는 URL
  - 잘못된 형식의 GET 파라미터
  - 로그아웃 후 화면
  - 인증 필요 화면
  method: (1) 존재하지 않는 경로를 GET으로 열어 오류 페이지에 스택트레이스·SQL 문·서버 버전·내부 경로가 나오는지 확인. (2) 로그아웃 후 뒤로가기·이전 URL 직접 열기로 마이페이지·관리자 화면이 다시 보이는지(캐시 포함) 확인하고 응답 헤더 Cache-Control을 기록. (3) 로그인하지 않은 상태에서 마이페이지·주문내역 URL을 GET으로 열어 로그인 화면으로 이동하는지 확인. (4) 응답 헤더의 Server·X-Powered-By 버전 노출을 기록(참고).
  pass: '일반화된 오류 페이지, 로그아웃 후 개인정보 화면 접근 불가, 개인정보 화면에 `Cache-Control: no-store`, 비로그인 접근 시 인증 요구.'
  fail: 상세 오류(스택트레이스·쿼리) 노출, 로그아웃 후에도 서버가 개인정보 화면 제공, 비로그인으로 개인정보 화면 접근 가능.
  remediation: '공통 오류 페이지와 서버 로그 분리, 로그아웃 시 서버 세션 무효화, 개인정보 응답에 `Cache-Control: no-store, no-cache` / `Pragma: no-cache`, 서버 측 인증 필터 일괄 적용, Server·X-Powered-By 헤더 제거, 시큐어코딩 가이드(과기정통부·행안부) 준수(안내서 p.72).'
  evidence: 오류 화면 스크린샷, 응답 헤더 발췌
  notes: 안내서 예시 기반. 파라미터 변조로 타인 데이터에 접근하는 시험(IDOR)·SQL 삽입 시험은 하지 않는다.
  category: 노출·출력
  strength: 권고
  default_risk: 하
- id: SAFE-06-03-09
  title: 정기 웹 취약점 점검·시큐어 코딩·운영 관리
  basis:
  - 기준 제6조제3항
  - 안내서 p.70~72
  - 부록 점검항목 25 (p.184~185)
  requirement: 홈페이지 보안대책을 정기 검토하고 침투 테스트·취약점 점검 결과를 신속 개선하며, 정기 웹 취약점 점검을 권고한다. 서버 간 필요한 트래픽만 허용하고 상시 모니터링한다.
  applies_when: 모든 개인정보처리자(인터넷 홈페이지 운영)
  type: 서면
  type_note: null
  location: []
  method: '서면 확인: 최근 웹 취약점 점검·모의해킹 보고서와 조치 결과, 시큐어 코딩 기준, 웹방화벽 운영 현황.'
  pass: 연 1회 이상 점검과 조치 완료 기록, 또는 웹방화벽 상시 차단.
  fail: 점검 이력 없음, 고위험 취약점 미조치.
  remediation: OWASP Top 10(Broken Access Control, Security Misconfiguration, Software Supply Chain Failures 등)·KISA 기준 연 1회 이상 진단, 긴급 취약점 수시 진단, 개발 단계 시큐어 코딩 점검 도입(안내서 p.71~72).
  evidence: 서면 자료 목록
  notes: 권고(안내서 "권고한다", 부록 연 1회). SAFE-04-01-04와 같은 증적으로 함께 판정 가능.
  category: 관리체계(서면)
  strength: 권고
  default_risk: 하
- id: SAFE-06-03-10
  title: P2P·공유설정·외부 저장소를 통한 유출 방지
  basis:
  - 기준 제6조제3항, 제2조제5호·제6호
  - 안내서 p.73
  requirement: 처리시스템·취급자 PC·모바일에 P2P·공유설정을 원칙적으로 쓰지 않고, 불가피하면 권한 설정·사용 후 해제·읽기 전용 등으로 통제한다. 원격접속 프로그램, 파일서버, 웹메일, 웹하드, 메신저, 클라우드 저장소, SNS를 통한 유출도 막는다. 단순 금지가 아니라 프로토콜·IP·포트 차단 등 기술적 조치를 한다.
  applies_when: 모든 개인정보처리자
  type: 서면
  type_note: null
  location: []
  method: '서면 확인: PC 보안 정책(P2P·웹하드 차단 정책, 공유폴더 점검 결과), 원격접속 프로그램 통제, 클라우드 저장소 공유 링크 관리 기준.'
  pass: 기술적 차단과 정기 공유폴더 점검 기록이 있다.
  fail: 사용 금지 공지만 있고 기술적 차단·점검이 없다.
  remediation: 네트워크·엔드포인트에서 P2P·웹하드 차단, 공유폴더 정기 점검(Everyone 권한 제거), 원격접속 도구 화이트리스트, 클라우드 공유 링크 만료 설정(안내서 p.73 예시).
  evidence: 서면 자료 목록
  notes: '법령 의무. 웹서비스 자체에 파일 공유 링크 기능(예: 누구나 접근 가능한 공유 URL)이 있으면 SAFE-06-03-03 방식으로 관찰해 보조 증적으로 쓴다.'
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-06-04-01
  title: 관리자(취급자) 세션 자동 차단 시간
  basis:
  - 기준 제6조제4항
  - 안내서 p.74
  - FAQ 5-3 (p.142)
  requirement: 개인정보취급자가 일정 시간 이상 업무처리를 하지 않으면 개인정보처리시스템 접속이 자동으로 완전히 차단되어야 한다(화면보호기는 해당하지 않음). 최대 접속시간은 처리 방법·환경·업무특성을 고려해 최소한으로 정한다. 차단 후 재접속은 최초 접속과 같은 수준 이상의 절차(자동 로그인 금지)를 거친다.
  applies_when: 모든 개인정보처리자
  type: 능동
  type_note: null
  location:
  - 관리자 화면
  - 판매자·파트너 센터
  - 고객상담 시스템 등 취급자용 웹 화면
  method: '(1) 관찰: 세션 만료 안내 UI(남은 시간 카운트다운, "N분 후 자동 로그아웃"), 프런트 JS의 타이머 값, 세션 쿠키의 Expires/Max-Age, 서버 세션 연장 API(keep-alive 주기 호출) 존재를 읽기 전용으로 확인. (2) 능동(승인): 사용자 로그인 후 아무 조작 없이 처리자가 정한 시간(모르면 10·30·60분 순서로 합의) 동안 둔 뒤, Claude가 메뉴 GET 이동으로 접근해 로그인 화면으로 돌아가는지, 서버가 401/리다이렉트를 주는지 기록한다. (3) 화면에서만 로그아웃 표시하고 서버 세션은 살아 있는지, 다른 탭의 백그라운드 폴링이 세션을 계속 연장하는지 네트워크 요청으로 확인. (4) 만료 후 재접속 시 ID·비밀번호(와 MFA)를 다시 요구하는지, "자동 로그인" 쿠키로 바로 들어가지는지 확인.'
  pass: 처리자가 정한 시간(내부 관리계획 값) 경과 후 서버 세션이 만료되고 재접속에 최초와 같은 인증이 필요하다. 백그라운드 요청이 무활동 세션을 무기한 연장하지 않는다.
  fail: '무활동 자동 차단 없음(장시간 방치 후에도 개인정보 화면 조회 가능), 화면 잠금만 있고 서버 세션 유지, 자동 로그인으로 재접속, 정기 점검 등 예외로 늘린 시간(예: 24시간)을 작업 후 원복하지 않음(안내서 p.74 미조치 예시).'
  remediation: '서버 세션 무활동 만료 설정(예: Tomcat `<session-config><session-timeout>30</session-timeout></session-config>`, Spring `server.servlet.session.timeout=30m`, 토큰 방식은 짧은 액세스 토큰과 무활동 기준 리프레시 제한), 만료 전 경고와 재인증, 자동 로그인 제거, 폴링 요청이 무활동 타이머를 연장하지 않게 분리, 장시간 접속 예외는 사유·기간 기록 후 원복(안내서 p.74). 서버접근제어 솔루션 경유 접속에도 무활동 차단 적용.'
  evidence: 시간 경과 전후 화면·요청 상태코드, 세션 쿠키 속성(값 마스킹), 타이머 설정 발췌
  notes: '법령 의무. 시간 수치는 고시·안내서에 없음(처리자가 "최소한"으로 정함, FAQ 5-3). 업계 관행 10~30분(외부 참고, ISMS-P 심사 관행 등)을 판정 기준으로 쓸지 사용자 결정 필요. 기본안: 처리자가 정한 값과 실제 동작 일치 여부로 판정하고, 정한 값이 없거나 60분 초과면 "권고 이상 확인 필요"로 표시. 이용자(정보주체) 세션 만료는 고시 의무 대상이 아니므로 참고로만 기록.'
  category: 인증·접근통제
  strength: 의무
  default_risk: 중
- id: SAFE-06-04-02
  title: 장시간 접속 예외 관리
  basis:
  - 기준 제6조제4항
  - 안내서 p.74
  - FAQ 5-3 (p.142)
  requirement: 정기 점검 등 특별한 상황에서 장시간 접속이 필요하면 사유·접속기간 기록을 보관하고, 작업 종료 후 원래 시간으로 복원한다. 업무특성별 최대 접속시간을 내부 관리계획에 정할 수 있다.
  applies_when: 모든 개인정보처리자
  type: 서면
  type_note: null
  location: []
  method: '서면 확인: 내부 관리계획의 시스템별 최대 접속시간, 예외 신청·승인 기록, 원복 확인 기록.'
  pass: 시스템별 시간 기준과 예외 기록·원복 이력이 있다.
  fail: 기준 시간이 정해지지 않았거나, 예외 연장이 기록 없이 유지된다.
  remediation: 시스템별(관리자 웹, DB 접근제어, 서버 접근제어) 최대 무활동 시간을 내부 관리계획에 명시, 예외 신청 양식(사유·기간·승인자)과 종료 시 원복 체크.
  evidence: 서면 자료 목록
  notes: 법령 의무(해설 해석). 브라우저 측정값(SAFE-06-04-01)과 문서상 값 비교에 쓴다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-06-05-01
  title: 업무용 모바일 기기 보호조치
  basis:
  - 기준 제6조제5항, 제2조제7호
  - 안내서 p.75
  - FAQ 2-4 (p.137)
  requirement: 업무용 모바일 기기(개인 기기라도 업무 앱·회사 메일로 개인정보를 처리하면 포함)에 비밀번호 등 화면 잠금, 기기 암호화, 원격 잠금·삭제, 필요 시 MDM 등 보호조치를 한다.
  applies_when: 모바일 기기로 개인정보를 처리하는 개인정보처리자
  type: 서면
  type_note: null
  location: []
  method: '서면 확인: 모바일 기기 보안 정책, MDM 적용 현황, 분실 신고·원격 삭제 절차.'
  pass: 화면 잠금·암호화 필수화와 분실 대응 절차가 있다.
  fail: 업무 모바일 기기 관리 기준이 없다.
  remediation: 화면 잠금(비밀번호·PIN·생체) 의무화, 기기 암호화, 원격 잠금·삭제, 중요 개인정보 처리 기기 MDM 적용(안내서 p.75 예시).
  evidence: 서면 자료 목록
  notes: 법령 의무. 관리자 모바일 웹·앱이 있으면 SAFE-06-02-01·06-04-01 관찰을 모바일 화면에도 적용할 수 있다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-06B-01-01
  title: 인터넷망 차단 의무 대상 여부 판단
  basis:
  - 기준 제6조의2제1항
  - 안내서 p.76~78
  - FAQ 5-5, 5-6, 5-9 (p.143~144)
  requirement: 전년도 말 기준 직전 3개월간 개인정보가 저장·관리되는 이용자 수가 일일평균 100만명 이상이면 인터넷망 차단 의무 대상이다. 10~12월 일별 이용자 수 합계를 92로 나누고, 서비스가 여럿이면 서비스별로 계산해 합산한다. 이용자 수에는 활성 회원뿐 아니라 분리보관된 탈퇴·휴면 회원, 비회원 배송정보도 포함한다. 임직원 등 이용자가 아닌 정보주체만 처리하는 시스템은 대상이 아니다(분리·엄격 통제 필요).
  applies_when: 정보통신서비스 이용자 개인정보를 처리하는 개인정보처리자
  type: 서면
  type_note: null
  location: []
  method: '서면 확인: 전년도 10~12월 일별 저장 이용자 수 산정 자료(서비스별, 휴면·탈퇴 분리보관·비회원 포함 여부).'
  pass: 산정 근거가 문서화되어 있고 결과에 따라 대상 여부를 정했다.
  fail: 산정하지 않았거나 휴면·비회원을 빼서 기준 미만으로 판단했다.
  remediation: FAQ 5-5 방식으로 매년 1월 산정하고 결과를 내부 관리계획에 기록한다.
  evidence: 서면 자료 목록
  notes: 법령 의무. 대상이 아니면 SAFE-06B-01-02, 06B-02-01은 "해당 없음".
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-06B-01-02
  title: 권한 설정·다운로드·파기 가능 취급자 PC의 인터넷망 차단
  basis:
  - 기준 제6조의2제1항제1호·제2호
  - 안내서 p.77~78
  - FAQ 5-7, 5-8 (p.143~144)
  requirement: 대상 처리자는 (1) 처리시스템 접근 권한을 설정할 수 있는 취급자(최고관리자, DBA, 보호담당자, 부서별 권한 담당자 등)와 (2) 개인정보를 다운로드(엑셀·워드·텍스트·이미지 등 파일 저장) 또는 파기(삭제)할 수 있는 취급자의 컴퓨터 등에 인터넷망 차단을 적용한다. 다운로드 건수가 적어도 대상이다. 클라우드로 처리시스템을 운영하면 해당 클라우드 서비스 접속 외 인터넷을 차단한다.
  applies_when: SAFE-06B-01-01에서 대상(일일평균 이용자 100만명 이상)으로 판단된 개인정보처리자
  type: 관찰
  type_note: null
  location:
  - 관리자 화면의 권한 설정 메뉴
  - 엑셀·파일 다운로드 기능
  - 개인정보 삭제·파기 기능
  method: (1) 사용자에게 점검용 관리자 접속 PC가 일반 인터넷 사용이 가능한 PC인지 확인한다(점검자가 외부 사이트를 열 수 있는 같은 브라우저에서 관리자 화면에 접속 중이면 인터넷 연결 PC라는 정황). (2) 그 PC의 관리자 화면에서 권한 설정 메뉴, 개인정보 다운로드 버튼, 회원 삭제·파기 기능이 활성 상태로 보이는지 조회만 한다(누르지 않음). (3) 인터넷 PC에서 해당 기능이 노출·동작 가능하면 망분리 예외 근거(SAFE-06B-02-01)를 서면으로 요청한다. (4) 망분리 구성(VDI, 물리 분리, 클라우드 전용 접속)은 서면으로 확인.
  pass: 권한 설정·다운로드·파기 기능은 인터넷이 차단된 PC(VDI·업무망)에서만 접근 가능하고, 인터넷 PC에서는 접근이 막히거나 기능이 비활성이다. 또는 제2항 예외 요건이 서면으로 입증된다.
  fail: 인터넷 사용 PC에서 권한 설정 기능이나 민감정보·암호화 대상 정보의 다운로드·파기 기능을 쓸 수 있다.
  remediation: 해당 취급자에게 물리적·논리적 망분리(VDI 등) 적용, 관리자 화면의 권한 설정·다운로드·파기 기능을 망분리 구간 IP에서만 허용(서버 측 IP 조건 검사), 클라우드 환경은 클라우드 콘솔·서비스 외 인터넷 차단(안내서 p.78).
  evidence: 인터넷 PC에서 보이는 해당 기능 화면 스크린샷(개인정보 마스킹 필요), 사용자 답변
  notes: 법령 의무. 브라우저로는 "인터넷 PC에서 기능이 보인다"는 정황까지만 확인 가능하며 최종 판정은 서면(망 구성도) 필요. 접근 권한 설정자 PC는 위험 분석 예외가 없다(제2항은 제1항제2호에만 적용, 안내서 p.80).
  category: 인증·접근통제
  strength: 의무
  default_risk: 상
- id: SAFE-06B-02-01
  title: 인터넷망 차단 예외(위험 분석·별표 보호조치)
  basis:
  - 기준 제6조의2제2항, [별표] (고시 본문 별표는 원문 파일에 없음, 안내서 p.76 수록)
  - 안내서 p.79~80
  - FAQ 5-8 (p.144)
  requirement: '다운로드·파기 가능 취급자 PC는 내부 관리계획에서 정한 위험 분석 결과 위험이 현저히 낮거나 위험 감소 보호조치를 적용하면 차단하지 않을 수 있다. 단, 민감정보(법 제23조) 또는 제7조제1항·제2항 암호화 대상(인증정보, 주민·여권·운전면허·외국인등록번호, 신용카드·계좌번호, 생체인식정보)을 다운로드·파기할 수 있는 PC는 예외 불가. 별표 보호조치 예시: (다운로드) 안전한 인증수단, 파일 암호화 저장, 다운로드 건수 제한, 다운로드 권한자 최소화, 출력 시 마스킹·안심번호 / (파기) 파기 권한자 최소화, 파기 시 관리자 별도 승인.'
  applies_when: 인터넷망 차단 대상 처리자 중 예외를 적용하는 경우
  type: 서면
  type_note: null
  location:
  - 관리자 화면 다운로드·파기 기능(보조 관찰)
  method: '서면 확인: 위험 분석 결과(안내서 p.80 예시: 암호화 대상=고위험 적용, 고유 정보=중위험 보호조치 시 제외, 임의 부여 정보=저위험), 적용한 보호조치 목록. 보조 관찰: 관리자 화면에서 다운로드 시 사유 입력·건수 제한 안내·파일 암호(비밀번호) 설정 안내·마스킹 여부, 파기 시 승인 절차 안내가 화면에 있는지 조회만 한다. 실제 다운로드는 사용자 승인 후 테스트 데이터로만.'
  pass: 예외 PC에서 다운로드·파기 가능한 정보에 민감·암호화 대상이 없고, 위험 분석 문서와 별표 수준 보호조치가 화면·설정에서 확인된다.
  fail: 위험 분석 없이 예외 적용, 예외 PC에서 주민등록번호·계좌번호 등 다운로드 가능, 보호조치가 문서에만 있고 화면에 없다.
  remediation: 위험 분석 문서화, 다운로드 시 사유 입력·건수 상한·파일 암호화·마스킹, 파기 시 상위 관리자 승인, 다운로드 이상행위 집중 모니터링, MFA 등 제로트러스트 원칙 반영(안내서 p.80 보호조치 예시).
  evidence: 다운로드·파기 기능 안내 화면 스크린샷(개인정보 마스킹 필요), 서면 자료 목록
  notes: 법령 의무(예외 요건). 다운로드 시 마스킹·사유 기록은 제12조 담당 항목과 연결.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-07-01-01
  title: 인증정보(비밀번호) 전송 구간 암호화
  basis:
  - 고시 제7조제1항
  - 고시 제7조제4항
  - 안내서 p.82(송·수신 시 SSL/TLS 등), p.87
  - 안내서 부록 FAQ 6-3·6-4(p.145~146)
  requirement: 비밀번호·생체인식정보 등 인증정보를 정보통신망으로 송·수신할 때는 안전한 암호 알고리즘으로 암호화해야 한다. 내부망도 포함된다. 방법은 SSL/TLS 같은 통신구간 암호화나 응용프로그램 암호화 전송이다. 전용선은 구간 암호화를 대신하지 못한다(FAQ 6-4).
  applies_when: 모든 개인정보처리자. 정보주체(이용자)와 개인정보취급자(관리자)의 인증 모두 해당한다.
  type: 관찰
  type_note: null
  location:
  - 로그인 화면
  - 회원가입
  - 비밀번호 변경
  - 비밀번호 찾기·재설정
  - 본인확인(재인증) 화면
  - 관리자 로그인 화면
  method: '

    1. 화면 URL의 스킴을 확인한다(`location.protocol`).

    2. 읽기 전용 JS로 비밀번호 칸이 속한 form을 조회한다: `[...document.querySelectorAll(''input[type=password]'')].map(i=>({form:i.form?.action, method:i.form?.method}))`. action이 `http://`로 시작하는지, 상대경로이면 현재 스킴이 https인지 본다.

    3. 사용자가 직접 로그인한 뒤 네트워크 요청 목록에서 로그인 요청의 URL 스킴(https 여부), 메서드, 대상 호스트를 확인한다. 응답이 리다이렉트이면 중간 hop에 http가 있는지도 본다.

    4. AJAX 로그인이면 JS 번들에서 로그인 API 주소가 `http://`로 하드코딩되어 있는지 찾는다.

    5. 요청 본문의 비밀번호 값이 평문으로 보이더라도 https 구간이면 양호다. 다만 응용 계층 "암호화"라고 하면서 실제로는 Base64 인코딩만 한 것은 암호화로 보지 않고 기록한다.

    6. `http://` 주소로 직접 GET 이동해 로그인 화면이 http로 그대로 열리는지, https로 리다이렉트되는지 확인한다.'
  pass: 인증정보를 보내는 모든 요청이 https(TLS)로 전송되고, http 접근은 https로 강제 전환된다.
  fail: 로그인·가입·비밀번호 변경 요청 가운데 하나라도 평문 http로 전송된다. 로그인 화면이 http로 열리고 그 상태로 제출할 수 있다. form action이 http 주소다.
  remediation: '

    - 전 구간 HTTPS를 적용한다. 웹서버에서 80→443 영구 리다이렉트(301/308)를 설정한다.

    - form action과 API base URL을 https 또는 스킴 상대가 아닌 절대 https로 고친다.

    - HSTS(`Strict-Transport-Security: max-age=31536000; includeSubDomains`)를 적용한다. 이 값은 점검자 권고이며 안내서 수치가 아니다.

    - 응용 계층 암호화를 쓴다면 안내서 p.83 권고 알고리즘(예: RSAES-OAEP 2048비트 이상)을 쓰고 인코딩만 하는 방식은 폐기한다.

    - 관리적으로는 내부 관리계획의 암호화 항목에 "인증정보 전송 시 TLS 필수"를 명시한다.'
  evidence: 로그인 요청의 네트워크 항목(URL·메서드·스킴) 캡처, form action/method 조회 결과, http 접근 시 리다이렉트 여부 캡처. 요청 본문에 비밀번호가 찍히면 반드시 마스킹한다(사용자가 입력한 값이므로 증적에 남기지 않는다).
  notes: '법령 의무(제7조제1항·제4항)다. FAQ 6-3에 따르면 송신 전에 이미 안전하게 암호화되어 도용·재사용 위험이 없으면 구간 암호화를 추가로 할 필요가 없다. 다만 일방향 암호화 값 자체가 인증정보로 쓰이면(예: 클라이언트 해시를 그대로 서버 인증에 쓰는 경우) 그 값도 구간 암호화가 필요하다. 클라이언트 해시만 하고 http로 보내는 방식은 취약으로 본다. HTTPS 전반은 SAFE-07-04-01과 함께 판정한다.'
  category: 암호화·전송
  strength: 의무
  default_risk: 상
- id: SAFE-07-01-02
  title: 비밀번호의 URL·GET 파라미터 노출
  basis:
  - 고시 제7조제1항
  - 고시 제2조제8호(비밀번호는 타인에게 공개되지 않는 정보)
  - 안내서 p.82
  requirement: 인증정보는 암호화하여 송·수신해야 한다. URL 쿼리스트링에 실린 비밀번호는 TLS 안에서도 브라우저 기록, 서버·프록시 로그, Referer 헤더에 평문으로 남는다. 안전한 송·수신 요건을 충족하지 못하는 것으로 본다.
  applies_when: 모든 개인정보처리자
  type: 관찰
  type_note: null
  location:
  - 로그인
  - 비밀번호 변경
  - 비밀번호 찾기·재설정
  - 본인확인
  - 관리자 로그인
  - 임시비밀번호 발급 링크
  method: '

    1. 비밀번호 칸이 있는 form의 method를 확인한다(`form.method`). GET이면 기록한다.

    2. 사용자가 로그인할 때 네트워크 요청 URL의 쿼리스트링에 `pw`, `pwd`, `passwd`, `password`, `userPw`, `pass`, `secret` 등의 파라미터가 있는지 본다.

    3. 로그인 뒤 리다이렉트 URL과 `location.href`, `history`에 비밀번호나 토큰이 남는지 본다.

    4. 비밀번호 재설정 메일 링크 형식이 화면 안내에 있으면 일회성 토큰인지 비밀번호 자체인지 확인한다.'
  pass: 비밀번호는 POST 본문(또는 응용 암호화된 본문)으로만 전송되고 URL에는 나타나지 않는다.
  fail: 비밀번호(또는 임시비밀번호)가 URL 경로나 쿼리 파라미터에 실린다. 비밀번호 칸이 있는 form이 GET 방식이다.
  remediation: '

    - form method를 POST로 바꾸고 서버에서 GET 요청의 인증 파라미터를 거부한다.

    - 비밀번호 재설정은 비밀번호가 아니라 일회성·만료형 토큰 링크로 처리한다. 이는 점검자 권고다.

    - `Referrer-Policy: strict-origin-when-cross-origin` 이상을 적용하고, 서버·WAF 로그에서 해당 파라미터를 마스킹한다.'
  evidence: 해당 요청 URL 캡처(비밀번호 값은 마스킹), form 속성 조회 결과
  notes: 고시에 "URL 금지"라는 명문은 없고, 제7조제1항의 해석으로 판정한다. 보고서에는 "법령 해석에 따른 취약"이라고 적는다.
  category: 암호화·전송
  strength: 의무
  default_risk: 상
- id: SAFE-07-01-03
  title: 접근토큰 등 기타 인증정보의 전송·브라우저 저장
  basis:
  - 고시 제7조제1항
  - 고시 제2조제11호(인증정보)
  - 안내서 p.82(비밀번호 외 인증정보도 암호화, API Access Key는 비밀번호로 보지 않으나 안전한 관리 필요)
  - 안내서 부록 FAQ 6-5(p.146)
  requirement: 접근토큰(Access Token), 갱신토큰(Refresh Token), 비밀접근키(Secret Access Key) 등 인증정보에 해당하면 저장·송수신 시 암호화해야 한다. 시스템 구성에 따른 인증정보를 명확히 식별해 안전조치를 해야 한다.
  applies_when: 모든 개인정보처리자
  type: 관찰
  type_note: null
  location:
  - 로그인 직후 전 화면
  - 마이페이지
  - 관리자 화면
  method: '

    1. 토큰이 실린 요청이 모두 https인지 확인한다(네트워크 목록).

    2. 토큰이 URL 쿼리(`?token=`, `access_token=`, `jsessionid=`)에 실리는지 확인한다.

    3. 읽기 전용 JS로 `document.cookie`를 조회한다. 세션 쿠키·토큰이 보이면 HttpOnly가 미설정된 것이다.

    4. `Object.keys(localStorage)`, `Object.keys(sessionStorage)`에서 `token`, `jwt`, `refresh`, `secret`, `apiKey` 등 키를 찾는다. 값은 앞 몇 글자만 기록한다.

    5. JS 번들과 페이지 소스에서 `secretKey`, `clientSecret`, `AKIA` 같은 하드코딩된 비밀키를 찾는다.

    6. 쿠키 Secure 속성은 JS로 확인할 수 없으므로, 응답 헤더를 볼 수 있으면 `Set-Cookie` 속성을 확인하고, 볼 수 없으면 "확인불가"로 남긴다.'
  pass: 토큰이 https로만 전송되고 URL에 실리지 않는다. 세션 쿠키에 HttpOnly·Secure가 설정되어 있다. 갱신토큰·비밀키가 브라우저 저장소나 JS 소스에 평문으로 남지 않는다.
  fail: '토큰·세션ID가 http로 전송되거나 URL에 실린다. 비밀접근키·클라이언트 시크릿이 프런트 소스에 노출된다.

    - 주의(추가 확인 필요): 갱신토큰을 localStorage에 장기 보관하는 것은 "주의"로 기록한다. 법령상 명시 금지는 아니다.'
  remediation: '

    - 세션·갱신토큰은 `Set-Cookie: ...; Secure; HttpOnly; SameSite=Lax`(또는 Strict) 쿠키로 옮긴다.

    - 접근토큰은 짧은 만료로 메모리에만 보관한다.

    - URL 토큰 전달(세션 ID URL rewriting 등)을 비활성화한다.

    - 클라이언트에 노출된 비밀키는 즉시 폐기·재발급하고 서버측 프록시로 옮긴다.

    - 이상의 설정 예시는 점검자 권고다. 안내서 근거는 FAQ 6-5의 "인증정보 식별 및 암호화"다.'
  evidence: 저장소 키 목록, 쿠키 이름 목록(값은 마스킹), 토큰이 실린 요청 URL(값 마스킹), 소스 내 노출 위치(파일명·행)
  notes: 안내서는 토큰 등이 "인증정보에 해당한다면" 암호화 대상이라고 한다(FAQ 6-5). 저장 위치에 대한 구체 기준은 없다. HttpOnly·SameSite는 접근통제(제6조) 쪽 항목과 겹칠 수 있으니 통합 시 조정한다.
  category: 암호화·전송
  strength: 의무
  default_risk: 상
- id: SAFE-07-01-04
  title: 응답·화면·브라우저 저장소의 비밀번호 노출
  basis:
  - 고시 제7조제1항 단서(비밀번호는 일방향 암호화 저장)
  - 안내서 p.82(일방향 암호화 = 해시함수 등으로 비가역 저장)
  requirement: 비밀번호는 복호화되지 않도록 일방향 암호화하여 저장해야 한다. 서버가 평문 비밀번호를 되돌려 줄 수 있다면 일방향 암호화가 적용되지 않았다는 정황이다.
  applies_when: 모든 개인정보처리자
  type: 관찰
  type_note: 비밀번호 찾기 실제 실행은 능동(승인).
  location:
  - 마이페이지(회원정보 수정)
  - 비밀번호 변경
  - 비밀번호 찾기 결과 화면
  - 관리자 회원 상세 화면
  - 관리자 계정 관리 화면
  method: '

    1. 회원정보 수정 화면에서 비밀번호 칸에 값이 미리 채워져 있는지 확인한다: `[...document.querySelectorAll(''input[type=password]'')].map(i=>i.value.length)`. 길이만 기록하고 값은 읽지 않는다.

    2. 마이페이지·회원정보 API 응답 본문(JSON)에 `password`, `pwd`, `passwd`, `userPw` 필드가 있는지, 값이 평문인지 해시인지 확인한다.

    3. 관리자 회원 상세 화면과 API 응답에 회원 비밀번호(평문 또는 해시) 필드가 있는지 확인한다.

    4. `localStorage`, `sessionStorage`, 전역 JS 변수(`window` 객체의 user·member 객체)에 비밀번호 필드가 있는지 확인한다.

    5. 비밀번호 찾기가 "기존 비밀번호 안내" 방식인지 "임시비밀번호·재설정 링크" 방식인지 화면 안내 문구로 확인한다. 실제 실행은 메일·문자를 발송하므로 사용자 승인 후 테스트 계정으로만 하고, 입력은 사용자가 한다.'
  pass: 어떤 화면·응답·저장소에도 비밀번호 평문이 나타나지 않는다. 비밀번호 찾기는 재설정 방식이다.
  fail: '다음 중 하나라도 해당하면 취약이다.

    - 응답·화면·저장소에 비밀번호 평문이 있다.

    - 비밀번호 칸에 저장된 비밀번호가 채워진다.

    - 비밀번호 찾기가 기존 비밀번호를 그대로 알려준다(복호화 가능 저장의 강한 정황).

    - 주의(추가 확인 필요): 응답에 비밀번호 해시값이 포함되면 "주의(불필요한 인증정보 노출)"로 기록한다.'
  remediation: '

    - 비밀번호를 응답 DTO와 화면 모델에서 제거한다(직렬화 제외).

    - 회원정보 수정 화면은 "현재 비밀번호 확인 + 새 비밀번호" 입력 방식으로 바꾼다.

    - 비밀번호 찾기는 본인확인 뒤 재설정 링크나 임시비밀번호를 발급하고 최초 로그인 시 변경을 강제한다.

    - 저장 방식을 일방향 해시(SHA-256 이상 + 솔트)로 전환한다(SAFE-07-01-05).'
  evidence: 해당 응답의 필드명 목록 캡처(값은 반드시 마스킹), 화면 캡처(비밀번호 칸 값 마스킹), 비밀번호 찾기 안내 문구 캡처
  notes: 저장 방식 자체는 서면 항목(SAFE-07-01-05)으로 확인하고, 이 항목은 그 정황 증거다. 평문 노출이 확인되면 서면 확인 결과와 관계없이 취약으로 판정한다.
  category: 암호화·전송
  strength: 의무
  default_risk: 상
- id: SAFE-07-01-05
  title: 비밀번호 일방향 암호화 저장
  basis:
  - 고시 제7조제1항 단서
  - 안내서 p.82(솔트값, 무작위 대입·레인보우 테이블 대응), p.83(권고 알고리즘 표), p.85(DMZ 저장 시 인증정보 암호화)
  requirement: 비밀번호는 복호화되지 않도록 일방향 암호화(해시)하여 저장해야 한다. 무작위 대입공격과 레인보우 테이블 공격에 대응하는 조치를 해야 하며, 솔트 추가를 고려한다. 권고 알고리즘은 SHA-224/256/384/512 등이고, MD5와 SHA-1은 사용 금지다.
  applies_when: 모든 개인정보처리자. 이용자와 개인정보취급자 비밀번호 모두 해당한다.
  type: 서면
  type_note: null
  location: []
  method: '서면 확인으로 다음을 요청한다.

    - 회원·관리자 계정 테이블 정의서

    - 비밀번호 저장 로직 소스 또는 설계서(해시 알고리즘, 솔트 사용 여부, 반복 횟수)

    - DB 샘플 캡처(해시 형식만, 마스킹)

    - 내부 관리계획의 암호화 조항'
  pass: SHA-256 이상 일방향 해시에 솔트를 적용해 저장한다. 키 스트레칭 함수(PBKDF2, bcrypt, scrypt, Argon2)를 쓰는 경우도 양호다.
  fail: '평문 저장, 양방향 암호화(AES 등) 저장, MD5·SHA-1 해시 저장

    - 주의(추가 확인 필요): 솔트 없이 단순 해시만 하는 경우는 "주의"로 기록한다.'
  remediation: '

    - 로그인 시점 재해시(lazy migration)나 일괄 비밀번호 재설정으로 저장 방식을 전환한다.

    - 알고리즘은 안내서 p.83 표의 SHA-2 계열을 쓰고 사용자별 무작위 솔트를 적용한다.

    - 가능하면 PBKDF2·bcrypt·Argon2 같은 키 스트레칭을 쓴다. 이는 점검자 권고다.

    - 내부 관리계획에 알고리즘과 솔트 정책을 명시한다.'
  evidence: 서면 자료 사본, 담당자 확인 기록
  notes: 법령 의무다. 솔트는 안내서상 "고려할 필요"이므로 권고 수준이다. MD5·SHA-1 금지는 안내서 p.83의 명시 사항이다. SAFE-07-01-04에서 평문 노출 정황이 나오면 함께 기재한다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-07-01-06
  title: 비밀번호 외 인증정보 저장 암호화
  basis:
  - 고시 제7조제1항 본문
  - 고시 제7조제2항제7호(생체인식정보)
  - 안내서 p.82, p.84~85
  - FAQ 6-5(p.146)
  requirement: 생체인식정보, 접근토큰, 비밀접근키 등 인증정보를 DB·파일로 저장할 때는 안전한 암호 알고리즘으로 암호화해야 한다. 비밀번호가 아니므로 양방향 암호화도 허용된다. API Access Key는 비밀번호로 보지 않지만 안전한 관리방안을 세워야 한다.
  applies_when: 모든 개인정보처리자
  type: 서면
  type_note: null
  location: []
  method: '서면 확인으로 다음을 요청한다.

    - 인증정보 식별 목록(생체 템플릿, 토큰, API 키, OTP 시드 등)과 각 저장 위치·암호화 방식

    - 설정 파일 내 비밀키 저장 방식(평문 여부)'
  pass: 식별된 모든 인증정보가 권고 알고리즘(AES-128 이상, ARIA, SEED, LEA 등)으로 암호화되어 저장된다.
  fail: 생체 템플릿·토큰·API 비밀키가 평문으로 DB·설정파일에 저장된다.
  remediation: '

    - 인증정보 인벤토리를 작성한다.

    - DB 컬럼 암호화나 비밀관리 서비스(KMS, Vault 등)로 이전한다.

    - 설정 파일의 평문 키를 제거하고 환경변수나 비밀저장소를 참조하게 한다.

    - 내부 관리계획에 인증정보 관리방안을 추가한다(안내서 p.82 "안전한 관리방안 수립").'
  evidence: 인벤토리, 암호화 설정 캡처
  notes: 법령 의무다. API Access Key는 안내서상 "비밀번호로 간주하지 않음"이므로 일방향 암호화 의무는 없다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-07-02-01
  title: 이용자 고유식별정보·카드·계좌·생체정보 저장 암호화
  basis:
  - 고시 제7조제2항제1~7호
  - 「개인정보 보호법」 제24조의2제2항
  - 시행령 제21조의2
  - 안내서 p.83~84, p.86(주민등록번호), p.88(적용기준 요약표)
  - FAQ 6-1(p.145)
  requirement: 이용자의 주민등록번호, 여권번호, 운전면허번호, 외국인등록번호, 신용카드번호, 계좌번호, 생체인식정보는 안전한 암호 알고리즘으로 암호화하여 저장해야 한다. 저장 위치(인터넷·DMZ·내부망)와 관계없다. 클라우드 제공자의 암호화 기능을 쓸 수 있으나 기준 부합 여부를 확인해야 한다.
  applies_when: 이용자(정보통신서비스 이용자)의 개인정보를 처리하는 자. 주민등록번호는 이용자 여부와 관계없이 전자적으로 보관하는 모든 개인정보처리자가 대상이다(법 제24조의2).
  type: 서면
  type_note: null
  location: []
  method: '서면 확인으로 다음을 요청한다.

    - 개인정보파일 목록과 항목별 암호화 현황표

    - DB 컬럼 암호화 설정(알고리즘·키 길이)

    - 클라우드 암호화 기능을 쓰면 그 사양'
  pass: 7개 항목 모두 권고 알고리즘(AES-128/192/256, ARIA-128/192/256, SEED, LEA 등)으로 암호화되어 저장된다.
  fail: 하나라도 평문 저장이다. 또는 TDEA(3DES) 등 보안강도가 낮은 알고리즘을 쓴다.
  remediation: '

    - DB 암호화 솔루션(API형·플러그인형·TDE)으로 컬럼 단위 암호화를 적용한다.

    - 알고리즘은 안내서 p.83 표 범위에서 고른다.

    - 검증필 암호모듈 사용을 검토한다(안내서 p.188 국정원 암호모듈 검증 참고 사이트).

    - 키 관리는 SAFE-07-06-01과 연계한다.

    - 내부 관리계획과 개인정보파일 대장에 암호화 현황을 반영한다.'
  evidence: 서면 자료
  notes: 법령 의무다. 화면이나 응답에 전체 번호가 평문으로 나오는 것은 저장 암호화 위반의 증거가 아니다(복호화 후 표시할 수 있으므로). 노출 자체는 SAFE-12-01-03에서 판정한다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-07-03-01
  title: 이용자가 아닌 정보주체의 고유식별정보 저장 암호화
  basis:
  - 고시 제7조제3항제1·2호
  - 법 제24조의2
  - 시행령 제21조의2
  - 안내서 p.84~86(DMZ 정의·예시, 영향평가·위험도 분석)
  - 부록 제2장 위험도 분석 기준(p.163~)
  - FAQ 6-1(p.145)
  requirement: '다음 경우에 암호화한다.

    - 인터넷망 구간이나 DMZ에 고유식별정보를 저장하면 암호화해야 한다.

    - 내부망에 저장하는 경우 주민등록번호는 무조건 암호화한다.

    - 내부망에 저장하는 그 밖의 고유식별정보는 공공기관이면 영향평가 결과, 그 외에는 위험도 분석 결과에 따라 적용 여부와 범위를 정할 수 있다.'
  applies_when: 이용자가 아닌 정보주체(직원, 오프라인 고객 등)의 고유식별정보를 처리하는 자
  type: 서면
  type_note: null
  location: []
  method: '서면 확인으로 다음을 요청한다.

    - 네트워크 구성도(DB의 DMZ·내부망 위치)

    - 고유식별정보 보유 현황

    - 영향평가 결과서 또는 위험도 분석 결과보고서(미암호화 시)'
  pass: DMZ·인터넷 구간의 고유식별정보와 내부망의 주민등록번호가 모두 암호화되어 있다. 내부망 미암호화 항목에는 유효한 영향평가·위험도 분석 결과가 있다.
  fail: DMZ에 평문 고유식별정보가 있다. 내부망 주민등록번호가 평문이다. 미암호화 근거 문서가 없다.
  remediation: '

    - 해당 컬럼을 암호화한다.

    - 미암호화를 유지하려면 부록 제2장 서식에 따라 위험도 분석 결과보고서를 작성하고 보완조치를 이행한다(안내서 예시).'
  evidence: 구성도, 분석 결과서
  notes: 법령 의무다. 웹 점검으로는 DB 위치를 알 수 없다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-07-04-01
  title: 개인정보 송·수신 시 HTTPS 적용 범위
  basis:
  - 고시 제7조제4항
  - 고시 제7조제1항
  - 안내서 p.87(SSL 인증서 보안서버, 응용프로그램 암호화)
  - 안내서 p.88 요약표
  requirement: 개인정보를 정보통신망을 통해 인터넷망 구간으로 송·수신하면 안전한 암호 알고리즘으로 암호화해야 한다. SSL 인증서 기반 보안서버나 응용프로그램 암호화를 활용할 수 있다.
  applies_when: 모든 개인정보처리자. 이용자와 비이용자 모두 해당한다.
  type: 관찰
  type_note: null
  location:
  - 전 화면. 특히 회원가입
  - 마이페이지
  - 주문·결제·배송지
  - 문의·상담 폼
  - 개인정보 조회·목록 화면
  - 관리자 화면
  - 파일 업로드·다운로드
  method: '

    1. 메뉴 탐색 중 방문한 모든 페이지의 `location.protocol`을 기록한다.

    2. 대표 URL(메인, 로그인, 가입, 마이페이지, 관리자)을 `http://`로 직접 열어 https로 301/302/307/308 리다이렉트되는지, http로 그대로 서비스되는지 확인한다.

    3. 개인정보 입력 form의 `action` 스킴을 조회한다: `[...document.forms].map(f=>[f.action,f.method])`.

    4. 네트워크 요청 목록에서 `http://`로 시작하는 XHR·fetch·form 요청을 찾는다. 특히 개인정보를 실은 API를 본다.

    5. 외부 도메인(주소검색, 본인확인, 상담 위젯 등)으로 개인정보가 전송되면 그 요청도 https인지 확인한다.

    6. 서브도메인(admin., m., api.)도 같은 방식으로 확인한다.

    7. 응답 헤더를 확인한다: `await fetch(location.href,{method:''HEAD''}).then(r=>r.headers.get(''strict-transport-security''))`. 읽기 전용 동일출처 요청이다.'
  pass: 개인정보를 표시하거나 송·수신하는 모든 페이지와 API가 https로만 제공되고 http 접근은 https로 전환된다.
  fail: '개인정보 입력·조회 페이지나 API가 http로 제공·전송된다. http 접근 시 리다이렉트 없이 서비스된다.

    - 주의(추가 확인 필요): 개인정보가 없는 페이지만 http이면 "주의"로 기록한다.'
  remediation: '

    - 전 사이트에 TLS 인증서를 적용하고 http→https 영구 리다이렉트를 설정한다. Nginx 예: `return 301 https://$host$request_uri;`

    - HSTS(`max-age=31536000; includeSubDomains`)를 적용한다. 운영 안정화 뒤 preload를 검토한다.

    - 하드코딩된 http API 주소를 수정한다.

    - 외부 연동 업체에도 https 사용을 요구한다(위탁·제공 계약에 반영).

    - 위 설정값은 점검자 권고이고, 안내서는 "SSL 인증서를 이용한 보안서버"까지만 예시한다(p.87).'
  evidence: 페이지별 스킴 목록, http 접근 결과 캡처, http 요청 목록(개인정보 값은 마스킹), HSTS 헤더 값
  notes: 법령 의무다. 현행 고시는 "인터넷망 구간으로 송·수신"을 요건으로 하므로 내부망 전용 관리자 시스템의 일반 개인정보는 제4항 대상이 아니다. 인증정보는 내부망도 제1항 대상이다. HSTS 미적용 자체는 법령 위반이 아니라 권고 사항이므로 "주의"로 둔다.
  category: 암호화·전송
  strength: 의무
  default_risk: 상
- id: SAFE-07-04-02
  title: 혼합 콘텐츠(Mixed Content)
  basis:
  - 고시 제7조제4항
  - 고시 제7조제1항
  - 안내서 p.87
  requirement: https 페이지가 http 자원을 불러오면 그 구간이 평문이 된다. 스크립트·form·iframe을 http로 받으면 개인정보나 인증정보 입력 화면이 변조·도청될 수 있어 전송 암호화 취지를 훼손한다.
  applies_when: 모든 개인정보처리자
  type: 관찰
  type_note: null
  location:
  - 전 화면. 특히 로그인
  - 가입
  - 결제
  - 마이페이지
  - 관리자 화면
  method: '

    1. 콘솔 메시지에서 "Mixed Content" 경고·오류를 수집한다.

    2. DOM에서 http 자원을 찾는다: `[...document.querySelectorAll(''[src],[href],form[action],iframe'')].map(e=>e.src||e.href||e.action).filter(u=>u&&u.startsWith(''http:''))`

    3. `performance.getEntriesByType(''resource'').filter(r=>r.name.startsWith(''http:''))`로 실제 로드된 http 자원을 확인한다.

    4. 결과를 active(script, iframe, form action, XHR)와 passive(img, media)로 구분한다.'
  pass: https 페이지에서 http 자원 요청이 없다.
  fail: '개인정보·인증정보를 다루는 페이지에서 active 혼합 콘텐츠(script, iframe, form action, XHR)가 있다.

    - 주의(추가 확인 필요): passive 혼합 콘텐츠(이미지 등)만 있으면 "주의"로 기록한다.'
  remediation: '

    - 자원 URL을 https 또는 상대경로로 고친다.

    - `Content-Security-Policy: upgrade-insecure-requests`를 적용한다.

    - https를 지원하지 않는 외부 자원은 자체 호스팅하거나 교체한다.

    - 이상은 점검자 권고다.'
  evidence: 콘솔 메시지 캡처, http 자원 목록
  notes: 고시·안내서에 혼합 콘텐츠라는 용어는 없고, 제7조제1·4항의 해석으로 판정한다.
  category: 암호화·전송
  strength: 의무
  default_risk: 상
- id: SAFE-07-04-03
  title: TLS 설정·인증서·안전한 암호 알고리즘
  basis:
  - 고시 제7조제1항·제4항("안전한 암호 알고리즘")
  - 안내서 p.83(사용 권장 알고리즘 표, TDEA·MD5·SHA-1 사용 금지, 최신 정보 확인 필요), p.87
  - 안내서 부록 제3장(p.188, 국정원 암호모듈 검증 ncsc.go.kr, KISA 암호이용활성화 seed.kisa.or.kr)
  requirement: '송·수신 암호화는 국내외 암호 연구기관이 권고하는 안전한 알고리즘을 써야 한다. 보안강도가 낮은 TDEA(3DES), MD5, SHA-1은 쓰면 안 된다.

    - 안내서 p.83 권고 표: 대칭키는 AES·ARIA·LEA·SEED·Camellia, 해시는 SHA-224 이상, 공개키는 RSA(RSAES-OAEP) 2048비트 이상'
  applies_when: 모든 개인정보처리자
  type: 관찰
  type_note: 프로토콜 버전·암호군은 별도 도구가 필요하다.
  location:
  - 서비스 도메인 전체(웹
  - 모바일웹
  - API
  - 관리자 도메인)
  method: '

    1. 브라우저 주소창의 인증서 경고 유무를 확인한다. 인증서 만료, 도메인 불일치, 자체서명 경고를 스크린샷으로 남긴다.

    2. `performance.getEntriesByType(''navigation'')[0].nextHopProtocol`을 기록한다. `h3`이면 TLS 1.3이고, `h2`이면 실무상 TLS 1.2 이상이다. `http/1.1`이면 판정 불가다.

    3. TLS 버전(1.0/1.1 허용 여부)과 암호군(3DES, RC4, NULL, EXPORT), 인증서 서명 알고리즘(SHA-1)은 브라우저 JS로 확인할 수 없다. 사용자에게 다음을 안내한다.

    - 사용자 PC에서 `openssl s_client -connect <host>:443 -tls1_1` 등을 직접 실행한다.

    - 또는 사용자 승인 하에 외부 진단 서비스를 쓴다. 이 경우 도메인이 제3자에 전달됨을 고지한다.

    4. 그래도 확인하지 못하면 "점검불가(별도 도구 필요)"로 둔다.'
  pass: 유효한 신뢰 인증서를 쓰고, 인증서 서명이 SHA-256 이상이며 키가 RSA 2048비트 이상(또는 동등한 ECC)이다. TLS 1.2 이상만 허용하고 3DES·RC4·NULL 암호군이 비활성이다.
  fail: '인증서 오류(만료·불일치·자체서명), SHA-1 서명 인증서, 3DES 등 금지 알고리즘 암호군 허용, SSL 3.0 허용

    - 주의(추가 확인 필요): TLS 1.0/1.1 허용은 "취약(점검자 기준)"으로 기록하고 판정 확정은 사용자 결정에 맡긴다.'
  remediation: '

    - 웹서버 TLS 설정을 `ssl_protocols TLSv1.2 TLSv1.3;`으로 하고, 암호군은 AEAD(AES-GCM, CHACHA20) 중심으로 하고 3DES·RC4·NULL·EXPORT를 제외한다.

    - RSA 2048비트 이상·SHA-256 서명 인증서로 교체하고 인증서 만료 모니터링을 도입한다.

    - 버전·암호군 설정 예시는 점검자 권고이고, 금지 알고리즘(3DES, SHA-1)은 안내서 p.83 근거다.

    - 최신 권고는 KISA 암호이용활성화(seed.kisa.or.kr)와 국정원 검증필 암호모듈 목록(ncsc.go.kr)을 확인한다(안내서 p.188).'
  evidence: 인증서 정보 캡처, nextHopProtocol 값, 사용자가 제공한 TLS 진단 결과
  notes: 안내서에는 TLS 버전 수치 기준이 없다. 부록 제3장은 참고 웹사이트 목록뿐이다. "TLS 1.2 이상"은 점검자 기준(업계 일반 권고)이므로 보고서에 "안내서 수치 아님"이라고 표시한다.
  category: 암호화·전송
  strength: 의무
  default_risk: 상
- id: SAFE-07-05-01
  title: 개인정보취급자 컴퓨터·모바일·보조저장매체 저장 시 암호화
  basis:
  - 고시 제7조제5항
  - 안내서 p.87~88(오피스 암호 설정, 압축파일 암호, 암호화 소프트웨어)
  - FAQ 6-2(p.145)
  requirement: '다음 정보를 개인정보취급자의 컴퓨터, 모바일 기기, 보조저장매체에 저장할 때는 안전한 암호 알고리즘으로 암호화한 뒤 저장해야 한다.

    - 이용자의 개인정보(전 항목)

    - 이용자가 아닌 정보주체의 고유식별정보와 생체인식정보

    - 오피스 프로그램의 암호 설정 기능이나 압축 암호를 쓸 수 있다. 다만 그 알고리즘이 안전해야 한다.'
  applies_when: 모든 개인정보처리자
  type: 서면
  type_note: null
  location: []
  method: '서면 확인으로 다음을 요청한다.

    - PC 개인정보 파일 암호화 정책(DRM, 문서암호화 솔루션, 개인정보 검출 솔루션)

    - 모바일 기기 암호화 설정

    - 보조저장매체 암호화(보안 USB) 정책과 점검 기록'
  pass: 취급자 PC·매체에 저장된 개인정보 파일이 암호화되어 있고, 이를 정기적으로 점검한 기록이 있다.
  fail: 평문 개인정보 파일 저장을 허용하고 통제 수단이 없다.
  remediation: '

    - 문서보안(DRM)이나 개인정보 검출·암호화 솔루션을 도입하고 보안 USB 사용을 의무화한다.

    - 오피스 파일 암호 설정과 압축 암호(AES-256)를 사용하도록 지침을 둔다(안내서 예시).

    - 정기 점검과 결과 보고 절차를 마련한다.'
  evidence: 서면 자료
  notes: 법령 의무다. 다운로드 파일 자체의 암호화 여부는 SAFE-07-05-03에서 확인한다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-07-05-02
  title: 관리자 화면의 브라우저 저장소·캐시 내 개인정보 평문 저장
  basis:
  - 고시 제7조제5항(개인정보취급자 컴퓨터에 저장 시 암호화)
  - 고시 제12조제1항
  - 안내서 p.87~88
  requirement: 관리자(개인정보취급자) 웹 화면이 이용자 개인정보를 취급자 PC의 브라우저 저장소(localStorage, IndexedDB, 장기 쿠키)에 평문으로 남기면, 취급자 컴퓨터에 암호화 없이 저장하는 것에 해당할 수 있다.
  applies_when: 이용자 개인정보를 웹 관리자 화면으로 처리하는 자
  type: 관찰
  type_note: null
  location:
  - 관리자 화면(회원 목록·상세
  - 주문·배송 관리
  - 상담 관리)
  method: '

    1. 관리자 화면 탐색 뒤 `Object.entries(localStorage)`, `Object.entries(sessionStorage)`의 키 이름과 값 길이를 조회한다.

    2. 값에서 이름·전화번호·이메일·주소·생년월일·주민번호 패턴(`\d{6}-?[1-4]\d{6}`), 카드번호 패턴(`\d{4}-?\d{4}-?\d{4}-?\d{4}`), 계좌번호 형태를 정규식으로 찾는다. 결과는 패턴 일치 건수만 기록한다.

    3. `indexedDB.databases()`로 DB 목록을 확인한다.

    4. 이용자 화면(마이페이지)도 같은 방식으로 보되, 이용자 본인 PC는 제7조제5항 대상이 아니다. 그 결과는 SAFE-12-01-03에 기록한다.'
  pass: 관리자 화면이 브라우저 영구 저장소에 이용자 개인정보를 남기지 않는다. 남겨야 하면 암호화된 값만 남긴다.
  fail: 'localStorage나 IndexedDB에 회원 목록·상세 정보가 평문으로 남는다.

    - 주의(추가 확인 필요): 개인정보가 sessionStorage에만 있으면 "주의"로 기록한다(탭 종료 시 삭제되기 때문).'
  remediation: '

    - 개인정보 응답을 메모리 상태로만 유지하고 영구 저장소 캐싱을 제거한다.

    - 필요하면 식별 키만 저장한다.

    - 민감 응답에 `Cache-Control: no-store`를 적용하고 로그아웃 시 저장소를 비운다.

    - 이상은 점검자 권고다.'
  evidence: 저장소 키 이름 목록과 패턴 일치 건수. 실제 값은 저장하지 않거나 마스킹한다.
  notes: 고시가 브라우저 저장소를 명시하지는 않으며, 제7조제5항을 적용한 해석이다. 판정 시 "법령 해석"으로 표시한다.
  category: 암호화·전송
  strength: 의무
  default_risk: 상
- id: SAFE-07-05-03
  title: 개인정보 다운로드 파일의 암호화
  basis:
  - 고시 제7조제5항
  - 안내서 p.88(내려받아 저장하는 경우 암호화 소프트웨어, 오피스·압축 암호 설정)
  requirement: 개인정보처리시스템에서 취급자 PC로 내려받은 개인정보 파일은 암호화하여 저장해야 한다.
  applies_when: 개인정보 다운로드 기능을 제공하는 자
  type: 능동
  type_note: null
  location:
  - 관리자 화면의 엑셀·CSV·PDF 다운로드 기능
  method: '

    1. 다운로드 버튼과 옵션 화면에 "파일 암호 설정", "암호화 다운로드" 같은 문구나 입력칸이 있는지 화면만 보고 확인한다(관찰).

    2. 실제 다운로드는 파일을 내려받는 행위이고 접속기록에 남는다. 따라서 파일명·건수 범위를 사용자에게 알리고 승인을 받은 뒤, 테스트 데이터나 최소 범위로 사용자가 직접 실행한다.

    3. 내려받은 파일이 열 때 암호를 요구하는지, DRM이 걸려 있는지 사용자가 확인해 알려준다. Claude는 파일 내용을 열람하지 않는다.'
  pass: 다운로드 파일에 암호 설정이나 DRM이 강제된다. 또는 PC 단 문서암호화 솔루션이 자동 적용된다(서면으로 확인).
  fail: 개인정보가 담긴 파일이 평문으로 내려받아지고 PC 단 암호화 통제도 없다.
  remediation: '

    - 다운로드 시 파일 암호 입력을 필수로 하거나 서버에서 AES 암호화 압축을 생성한다. 암호는 별도 경로로 전달한다.

    - DRM 자동 적용을 연동한다.

    - 다운로드 사유 입력과 함께 구현한다(SAFE-12-01-05).

    - 근거는 안내서 p.88 예시다.'
  evidence: 다운로드 옵션 화면 캡처, 사용자 확인 결과(파일 내용 캡처 금지)
  notes: 법령 의무(제7조제5항)다. 다운로드 화면 구현 방식은 안내서 예시 수준이다.
  category: 암호화·전송
  strength: 의무
  default_risk: 상
- id: SAFE-07-06-01
  title: 암호 키 관리 절차 수립·시행
  basis:
  - 고시 제7조제6항
  - 안내서 p.89~90(라이프사이클별 키 관리 절차 예시)
  requirement: '대상 개인정보처리자는 암호화된 개인정보를 안전하게 보관하기 위해 암호 키의 생성, 이용, 보관, 배포, 파기 절차를 수립·시행해야 한다. 안내서는 다음 4단계 예시를 든다.

    - 준비: 안전한 난수발생기(RNG)로 키를 생성한다.

    - 운영: 키를 백업·복구할 수 있게 하고, 노출되거나 유효기간이 끝나면 교체한다.

    - 정지: 운영 데이터와 분리해 보관하고, 소스 프로그램에 평문으로 저장하지 않는다.

    - 폐기: 키 자료를 삭제한다.'
  applies_when: 10만명 이상 정보주체를 처리하는 대기업·중견기업·공공기관, 또는 100만명 이상 정보주체를 처리하는 중소기업·단체
  type: 서면
  type_note: null
  location: []
  method: '서면 확인으로 다음을 요청한다.

    - 암호 키 관리 지침과 절차서

    - 키 보관 방식(HSM, KMS 등)

    - 키 교체·폐기 기록

    - 키 접근권한자 목록'
  pass: 문서화된 절차가 있고 실제 이행 기록이 있다.
  fail: 절차가 없다. 키가 소스코드나 설정파일에 평문으로 저장된다. 키 교체·폐기 이력이 없다.
  remediation: '

    - 안내서 p.89~90의 4단계 예시에 따라 키 관리 절차서를 작성한다.

    - KMS나 HSM을 도입하고, 키 접근권한 분리와 교체 주기를 정한다.

    - 내부 관리계획 암호화 항목에 반영한다.'
  evidence: 서면 자료
  notes: 법령 의무지만 적용조건이 있다. 규모 판단에 쓸 정보주체 수는 사용자에게 확인한다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-07-06-02
  title: 클라이언트 측 암호 키·비밀값 노출
  basis:
  - 고시 제7조제6항
  - 고시 제7조제1항
  - 안내서 p.90("암호 키는 응용프로그램의 소스 프로그램 내에 평문으로 저장 금지")
  requirement: 암호 키는 소스 프로그램에 평문으로 저장하면 안 된다(안내서 예시). 웹 프런트 JS에 개인정보 암·복호화 키가 들어 있으면 누구나 키를 얻을 수 있어 암호화가 무력화된다.
  applies_when: 모든 개인정보처리자. 제7조제6항 절차 의무 자체는 규모 조건이 있다.
  type: 관찰
  type_note: null
  location:
  - 전 화면의 JS 번들
  - 인라인 스크립트
  method: '

    1. 로드된 스크립트 목록(`performance.getEntriesByType(''resource'')`의 script)을 읽는다.

    2. 다음 패턴을 찾는다.

    - 암호 라이브러리 호출부(`CryptoJS.AES.encrypt(`, `crypto.subtle.importKey(`, `AES_KEY`, `secretKey`, `encKey`, `iv:`)

    - 하드코딩된 16·24·32바이트 문자열 키

    - `privateKey`, `-----BEGIN RSA PRIVATE KEY-----`

    3. 소스맵(`.map`) 공개 여부도 확인한다(GET만).'
  pass: 프런트에 대칭키나 개인키가 없다. 클라이언트 암호화는 서버 공개키(RSA-OAEP 등)만 쓴다.
  fail: 개인정보나 인증정보 암·복호화용 대칭키나 개인키가 JS에 하드코딩되어 있다.
  remediation: '

    - 키를 프런트에서 제거하고 서버 측 암·복호화로 전환한다.

    - 클라이언트 암호화가 필요하면 서버 공개키만 배포한다.

    - 노출된 키로 암호화된 데이터는 새 키로 재암호화한다.

    - 운영 환경에서 소스맵 공개를 차단한다.'
  evidence: 해당 스크립트 URL과 위치(키 값은 일부만 표시)
  notes: 안내서 키 관리 예시(p.90)를 웹에 적용한 해석이다.
  category: 암호화·전송
  strength: 의무
  default_risk: 상
- id: SAFE-08-01-01
  title: 접속기록 보관기간(1년·2년)
  basis:
  - 고시 제8조제1항 각 호
  - 안내서 p.91~92, p.94(최소 기간 이후 보관기간 설정)
  - FAQ 7-5(p.148)
  requirement: '개인정보처리시스템에 접속한 자(정보주체 제외)의 접속기록을 1년 이상 보관·관리한다. 다음에 해당하면 2년 이상 보관한다.

    - 5만명 이상 정보주체를 처리하는 시스템

    - 고유식별정보나 민감정보를 처리하는 시스템

    - 기간통신사업자

    - 오픈마켓 판매자 등 제3자 계정 접속도 포함한다. 처리 목적을 달성해 개인정보를 파기해도 접속기록은 정해진 기간 보관해야 한다.'
  applies_when: 모든 개인정보처리자. 2년 요건은 위 각 호에 해당하는 경우다.
  type: 서면
  type_note: null
  location:
  - (관찰 보조) 관리자 화면의 접속기록 조회 메뉴
  method: '

    - 서면 확인: 접속기록 보관 정책, 실제 최고(最古) 보관분 조회 결과, 시스템별 해당 호(5만명, 고유식별·민감정보) 판단 자료를 요청한다.

    - 관리자 화면에 접속기록 조회 메뉴가 있으면 조회 가능한 최초 일자를 화면으로 확인한다. 기록 내용 중 개인정보는 마스킹한다.'
  pass: 해당 기간 이상의 기록이 실제로 존재한다.
  fail: 보관 기간이 미달한다. 일부 시스템이나 제3자 계정의 기록이 없다.
  remediation: '

    - 로그 보관 정책을 해당 기간 이상으로 설정하고 별도 저장소로 아카이빙한다.

    - 내부 관리계획에 시스템별 보관기간을 명시한다. 안내서 p.94는 최소기간 이후에도 책임추적에 충분한 기간을 정하도록 권고한다.'
  evidence: 서면 자료, 조회 화면 캡처(마스킹)
  notes: '법령 의무다.

    - 시행시기: 안내서 p.91은 2년 요건을 "''26.11.1 부 시행"으로 적는다(고시 제2025-9호 부칙, 발령 1년 후).

    - 오늘(2026-10-27)은 시행 전이다. 2026.11.1. 이후 점검분부터 2년 기준을 적용한다.

    - 현행 고시 제2026-9호 부칙은 이 유예를 따로 언급하지 않는다. 메모 참조.'
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-08-01-02
  title: 접속기록 필수 기록 항목
  basis:
  - 고시 제2조제3호
  - 고시 제8조제1항
  - 안내서 p.92~93(필수 항목과 예시, 쿼리 기록, 가명정보)
  - FAQ 7-1(p.147)
  - 안내서 p.128~129(누락 사례)
  requirement: '다음 5개 항목을 모두 기록해야 한다.

    - 식별자

    - 접속일시(년-월-일 시:분:초)

    - 접속지 정보(IP 등)

    - 처리한 정보주체 정보(ID, 고객번호 등)

    - 수행업무(검색, 열람, 조회, 입력, 수정, 삭제, 출력, 다운로드)

    로그인, 로그아웃, 로그인 실패도 기록한다. 처리한 정보주체 정보에는 민감하거나 과도한 개인정보를 남기지 않고, 필요하면 암호화한다. 대량 조회는 쿼리를 기록할 수 있으며 책임추적성 확보 조치가 필요하다.'
  applies_when: 모든 개인정보처리자
  type: 서면
  type_note: null
  location:
  - (관찰 보조) 관리자 접속기록 조회 화면
  method: '

    - 서면 확인: 접속기록 샘플(마스킹)과 로그 스키마를 요청한다.

    - 관리자 화면에 접속기록 메뉴가 있으면 컬럼 구성을 화면으로 확인한다.

    - 점검자가 관리자 화면에서 조회·다운로드한 행위가 기록되었는지 사용자에게 확인을 요청한다. 누락 사례의 예: 신규 메뉴 미연계, 목록 일괄 조회 시 정보주체 공란, 첫 화면 자동 조회 미기록.'
  pass: 5개 항목과 로그인·로그아웃·실패 기록이 모든 메뉴에서 생성된다.
  fail: '다음 중 하나라도 해당하면 취약이다.

    - 항목이 누락된다.

    - 일부 메뉴·기능에서 기록이 생성되지 않는다.

    - 목록 조회 시 정보주체가 공란이다.

    - 접속기록에 과도한 개인정보(예: 주민번호 전체)가 평문으로 남는다.'
  remediation: '

    - 공통 로깅 모듈에 모든 개인정보 메뉴를 연계한다.

    - 목록·일괄 조회 시 대상 식별자 목록이나 쿼리, 당시 DB 스냅샷을 기록한다(안내서 p.93 예시).

    - 로그의 정보주체 정보를 식별자 수준으로 최소화한다.'
  evidence: 서면 샘플, 화면 캡처(마스킹)
  notes: 법령 의무다. 이용자 접속기록은 이 기준 대상이 아니다. 다만 「통신비밀보호법」상 3개월 보관이 필요하다(FAQ 7-2, 참고용).
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-08-02-01
  title: 접속기록·다운로드 점검 주기·방법·사후조치
  basis:
  - 고시 제8조제2항
  - 안내서 p.94~95(관리항목 표, 비정상 행위 예시, 별도 부서 점검)
  - FAQ 7-4·7-6(p.148~149)
  requirement: '접속기록과 개인정보 다운로드 상황을 확인·점검하는 주기, 방법, 사후조치 절차 등을 내부 관리계획으로 정하고 이행해야 한다. 안내서 예시는 다음과 같다.

    - 주기: 실시간, 매일, 매주, 매월, 격월, 분기

    - 방법: 자동화, 스크립트, 수동

    - 점검기준: 비인가 접속, 단시간 대량 다운로드, 업무시간 외 조회 등

    - 사후조치: 보고, 소명, 회수·파기

    - 점검은 취급부서가 아닌 총괄·감사 부서가 하도록 권고한다. 최종 책임은 개인정보 보호책임자에게 있다.'
  applies_when: 모든 개인정보처리자
  type: 서면
  type_note: null
  location: []
  method: 서면 확인으로 내부 관리계획의 해당 조항, 최근 점검 결과 보고서, 이상행위 소명·조치 기록, 다운로드 현황 점검 기록을 요청한다.
  pass: 주기·방법·기준·사후조치가 규정되어 있고 그대로 이행된 기록이 있다. 다운로드 점검이 포함된다.
  fail: 규정이 없거나 이행 기록이 없다. 다운로드 점검이 빠져 있다. 주기가 과도하게 길다(FAQ 7-6).
  remediation: '

    - 안내서 p.94 표에 따라 주기·방법·점검기준·사후조치를 내부 관리계획에 규정한다.

    - 비정상 행위 탐지 기준을 수립한다. 안내서 예시는 업무시간 외 접속, 다수 IP, 대량 다운로드다.

    - 점검 결과를 개인정보 보호책임자에게 보고하는 체계를 둔다.'
  evidence: 서면 자료
  notes: 법령 의무다. 안내서 p.94는 "다운로드 상황 점검"을 '26.11.1 시행으로 표시한다(SAFE-08-01-01 비고와 같음).
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-08-03-01
  title: 접속기록 위·변조·도난·분실 방지
  basis:
  - 고시 제8조제3항
  - 안내서 p.95(별도 저장장치 백업, WORM, MAC·전자서명 값 별도 보관, 수정·삭제 권한 제한)
  requirement: 접속기록이 위·변조, 도난, 분실되지 않도록 안전하게 보관해야 한다. 임의 수정·삭제가 불가능하도록 접근 권한을 제한해야 한다.
  applies_when: 모든 개인정보처리자
  type: 서면
  type_note: null
  location: []
  method: 서면 확인으로 접속기록 저장 구조(별도 로그서버, WORM), 무결성 검증 방법, 로그 접근권한자 목록, 백업 기록을 요청한다.
  pass: 별도 저장소 백업과 무결성 보장 수단이 있고, 수정·삭제 권한이 제한되어 있다.
  fail: 운영 DB의 같은 테이블에만 있고 관리자가 수정·삭제할 수 있다.
  remediation: '

    - 로그 서버나 SIEM으로 실시간 전송한다.

    - WORM 스토리지를 쓰거나, 해시·MAC 값을 별도 보관한다(안내서 예시).

    - 로그 삭제 권한을 분리한다.'
  evidence: 서면 자료
  notes: 법령 의무다. 관리자 화면에 "접속기록 삭제" 기능이 보이면 관찰 결과로 첨부한다. 버튼은 누르지 않는다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-09-01-01
  title: 보안 프로그램 설치·운영 및 최신 상태 유지
  basis:
  - 고시 제9조제1항제1호
  - 안내서 p.96~98(정품 사용, 실시간 감시, 자동 업데이트 또는 일 1회 이상, 업로드 파일 악성코드 검사, 클라우드 기능 활용)
  - FAQ 8-1(p.150)
  requirement: '다음 대상에 악성프로그램 방지·치료 보안 프로그램을 설치·운영해야 한다.

    - 개인정보처리시스템(Web, WAS, DBMS)

    - 정보통신망 관리 시스템

    - 업무용 컴퓨터

    - 리눅스 등 비윈도우 OS 포함

    자동 업데이트를 쓰거나 정당한 사유가 없는 한 일 1회 이상 업데이트한다.'
  applies_when: 모든 개인정보처리자
  type: 서면
  type_note: null
  location: []
  method: '서면 확인으로 다음을 요청한다.

    - 백신 설치 현황(서버·PC)

    - 자동·예약 업데이트와 실시간 감시 설정 캡처

    - 라이선스(정품) 증빙

    - 웹 업로드 파일 악성코드 검사 적용 여부'
  pass: 대상 전체에 정품 백신이 설치되고, 실시간 감시가 켜져 있으며, 자동 또는 일 1회 이상 업데이트된다.
  fail: 서버(특히 리눅스)에 미설치, 업데이트 지연, 실시간 감시 해제
  remediation: '

    - 서버용 백신이나 EDR을 도입한다.

    - 중앙관리 콘솔로 업데이트와 정책을 강제한다.

    - 업로드 파일 검사(백신 연동)를 적용한다(안내서 p.97).'
  evidence: 서면 자료
  notes: 법령 의무다. "일 1회 이상"은 고시 수치다. 파일 업로드 기능에 악성 파일을 실제로 올려보는 시험은 운영 데이터 변경이므로 하지 않는다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-09-01-02
  title: 발견된 악성프로그램 대응
  basis:
  - 고시 제9조제1항제2호
  - 안내서 p.98
  requirement: 발견된 악성프로그램은 삭제·치료 등으로 대응해야 한다. 치료가 안 되면 시스템을 분리하는 등 확산 방지 조치를 한다.
  applies_when: 모든 개인정보처리자
  type: 서면
  type_note: null
  location: []
  method: 서면 확인으로 악성코드 탐지·조치 이력과 대응 절차서를 요청한다.
  pass: 탐지 건별로 조치 기록이 있다.
  fail: 탐지 후 방치했거나 대응 절차가 없다.
  remediation: 침해대응 절차(탐지→격리→치료→원인분석→보고)를 문서화하고 이력을 관리한다.
  evidence: 서면 자료
  notes: 법령 의무다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-09-02-01
  title: 보안 업데이트 즉시 적용
  basis:
  - 고시 제9조제2항
  - 안내서 p.99("정당한 사유가 없는 한 즉시" = 합리적 소요시간, 형상관리, EOS 확인, KrCERT 보안공지)
  - 부록 위험도 분석 26번(p.185)
  - FAQ 8-1(p.150)
  requirement: 악성프로그램 경보가 발령되거나 OS·응용프로그램 제작업체의 보안 업데이트 공지가 있으면 정당한 사유가 없는 한 즉시 업데이트해야 한다. 기술지원 종료(EOS) 여부를 지속적으로 확인해야 한다.
  applies_when: 모든 개인정보처리자
  type: 서면
  type_note: 버전 노출은 관찰 보조.
  location:
  - 전 화면(응답 헤더
  - 프런트 라이브러리)
  method: '

    - 서면 확인: 패치 관리 대장(적용 일자), EOS 현황을 요청한다.

    - 관찰 보조 1: `fetch(location.href,{method:''HEAD''})` 응답의 `Server`, `X-Powered-By`, `X-AspNet-Version` 헤더에서 제품·버전 노출을 확인한다.

    - 관찰 보조 2: 프런트 라이브러리 버전(`jQuery.fn.jquery`, `angular.version`, 번들 주석 등)을 기록해 알려진 취약·EOS 버전인지 확인한다.'
  pass: 패치가 지체 없이 적용되고, EOS 제품을 쓰지 않거나 대체 조치가 있다.
  fail: '공지 후 장기간 미적용이다. 또는 EOS OS·WAS를 쓴다.

    - 주의(추가 확인 필요): 다음은 관찰 근거로 "주의"를 기록하고 서면으로 확정한다.

    - 응답 헤더에서 EOS·구버전 서버 정보가 노출된다.

    - 알려진 고위험 취약 버전의 프런트 라이브러리를 쓴다.'
  remediation: '

    - 패치 관리 절차와 형상관리 대장을 운영한다(안내서 p.99).

    - KrCERT 보안공지(boho.or.kr)를 구독한다.

    - 서버 버전 헤더를 숨긴다(`server_tokens off;`, `X-Powered-By` 제거).

    - 취약 라이브러리를 업그레이드한다. 헤더 숨김은 점검자 권고다.'
  evidence: 응답 헤더 값, 라이브러리 버전 목록, 서면 자료
  notes: 법령 의무는 "업데이트 실시"다. 버전 노출 자체는 법령 위반이 아니므로 정황 증거로만 쓴다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-10-01-01
  title: 전산실·자료보관실 출입통제 절차
  basis:
  - 고시 제10조제1항
  - 안내서 p.100~101(출입 신청·승인, 관리대장, 정기 검토, 출입통제 장치 예시)
  - FAQ 9-1(p.151)
  requirement: 전산실, 자료보관실 등 물리적 보관 장소를 별도로 두면 출입통제 절차를 수립·운영해야 한다.
  applies_when: 물리적 보관 장소를 별도로 둔 개인정보처리자. 없으면 출입통제 절차를 두지 않을 수 있다(FAQ 9-1).
  type: 서면
  type_note: null
  location: []
  method: 서면 확인으로 출입통제 절차서, 출입 신청서·관리대장, 출입 기록 정기 검토 기록, 출입통제 장치 현황을 요청한다. 클라우드나 IDC를 쓰면 제공자의 인증·보고서를 요청한다.
  pass: 절차가 있고 대장 기록과 정기 검토가 이행된다.
  fail: 절차나 기록이 없다.
  remediation: '

    - 출입 신청·승인·대장 양식을 마련한다. 안내서 p.101 예시 항목은 출입일자, 입·퇴실 시간, 출입자, 목적, 승인자다.

    - 출입통제 장치를 설치하고 기록을 정기 검토한다.'
  evidence: 서면 자료
  notes: 법령 의무다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-10-02-01
  title: 개인정보 서류·보조저장매체 잠금장치 보관
  basis:
  - 고시 제10조제2항
  - 안내서 p.101
  - FAQ 9-1(p.151)
  requirement: 개인정보가 포함된 서류와 보조저장매체(이동형 HDD, USB, 외장 SSD 등)를 금고나 잠금장치가 있는 캐비닛 등에 보관해야 한다.
  applies_when: 모든 개인정보처리자
  type: 서면
  type_note: null
  location: []
  method: 서면 확인으로 보관 장소 현황(사진)과 보관 지침을 요청한다.
  pass: 잠금 보관한다.
  fail: 개방된 장소에 보관한다.
  remediation: 잠금 캐비닛이나 금고를 마련하고, 보관·열쇠 관리 지침과 클린데스크 점검을 시행한다.
  evidence: 서면·사진 자료
  notes: 법령 의무다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-10-03-01
  title: 보조저장매체 반출·입 통제
  basis:
  - 고시 제10조제3항
  - '안내서 p.102(고려사항 예시: 보유 현황, 반출·입 관리, USB 연결 시 바이러스 점검 기본 설정)'
  requirement: 개인정보가 담긴 보조저장매체의 반출·입 통제 보안대책을 마련해야 한다.
  applies_when: 별도 개인정보처리시스템을 운영하는 자. 업무용 PC나 모바일로만 처리하면 적용하지 않을 수 있다.
  type: 서면
  type_note: null
  location: []
  method: 서면 확인으로 매체 관리대장, 반출·입 승인 기록, 매체제어 솔루션 정책을 요청한다.
  pass: 보유 현황을 관리하고, 반출·입을 승인·기록하며, 기술적으로 통제한다.
  fail: 통제 대책이 없다.
  remediation: '

    - 매체 등록·관리대장을 운영하고 반출·입 승인 절차를 둔다.

    - 매체제어(DLP) 솔루션을 쓰고 USB 자동 검사를 설정한다(안내서 예시).'
  evidence: 서면 자료
  notes: 법령 의무다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-11-00-01
  title: 위기대응 매뉴얼 등 대응절차 마련·정기 점검
  basis:
  - 고시 제11조제1호
  - 안내서 p.103~105(문서화, 정기 점검, 시험계획, 클라우드 이용기관 측 절차, 매뉴얼 포함 항목 예시)
  - FAQ 9-2(p.151)
  requirement: 화재, 홍수, 단전 등 재해·재난에 대비해 개인정보처리시스템 보호를 위한 위기대응 매뉴얼 등 대응절차를 문서화하고 정기적으로 점검해야 한다.
  applies_when: 10만명 이상 정보주체를 처리하는 대기업·중견기업·공공기관, 또는 100만명 이상 정보주체를 처리하는 중소기업·단체
  type: 서면
  type_note: null
  location: []
  method: 서면 확인으로 위기대응 매뉴얼, 정기 점검·모의훈련 기록, 변경 반영 이력을 요청한다.
  pass: 매뉴얼이 있고 정기 점검·훈련 기록이 있다.
  fail: 매뉴얼이 없거나 점검하지 않는다.
  remediation: '안내서 p.105 예시 항목으로 매뉴얼을 작성하고 연간 훈련 계획을 수립·이행한다.

    - 시스템 구성요소

    - 파급효과와 초기대응

    - 복구 우선순위, RPO, RTO

    - 업무분장

    - 정기 점검'
  evidence: 서면 자료
  notes: 법령 의무지만 적용조건이 있다. 고시 조문은 항 구분 없이 호만 있어 ID 항 자리를 00으로 했다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-11-00-02
  title: 백업 및 복구 계획 마련
  basis:
  - 고시 제11조제2호
  - 안내서 p.105(대상, 방법, 절차 포함, 매뉴얼에 포함 가능)
  requirement: 개인정보처리시스템의 백업 및 복구 대상, 방법, 절차를 포함한 계획을 마련해야 한다.
  applies_when: SAFE-11-00-01과 같다.
  type: 서면
  type_note: null
  location: []
  method: 서면 확인으로 백업·복구 계획서, 백업 수행 기록, 복구 테스트 결과를 요청한다.
  pass: 계획과 수행 기록이 있다.
  fail: 계획이 없다.
  remediation: 백업 대상·주기·보관위치(원격지)·복구 절차를 문서화하고 정기적으로 복구 시험을 한다. 복구 시험은 안내서상 권고다.
  evidence: 서면 자료
  notes: 법령 의무지만 적용조건이 있다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-12-01-01
  title: 출력(화면표시·인쇄·파일생성) 용도 특정과 항목 최소화
  basis:
  - 고시 제12조제1항
  - 안내서 p.106(용도별 출력항목 차등, 마스킹, 접근 권한 범위 내 최소 출력)
  - FAQ 10-1(p.152)
  requirement: 개인정보를 출력(인쇄, 화면표시, 파일생성 등)할 때는 용도를 특정하고, 용도에 따라 출력 항목을 최소화해야 한다. 업무상 반드시 필요한 항목만 포함하도록 처리를 제한한다.
  applies_when: 모든 개인정보처리자. 주로 관리자(개인정보취급자) 화면이 대상이며, 이용자 화면도 같은 원칙으로 점검한다.
  type: 관찰
  type_note: null
  location:
  - 관리자 회원 목록·상세
  - 주문·배송·상담 목록
  - 통계 화면. 이용자 마이페이지
  - 주문내역
  - 영수증·증명서 출력 화면.
  method: '

    1. 화면별로 표시되는 개인정보 항목을 기록한다. 기록은 항목명만 하고 값은 남기지 않는다.

    2. 그 화면의 용도(예: 배송 처리, 상담 응대)에 비해 불필요한 항목이 있는지 표시한다. 예:

    - 목록 화면에 주민번호, 생년월일 전체, 상세 주소, 계좌번호가 노출된다.

    - 상담 화면에 결제 정보가 노출된다.

    3. 목록 화면과 상세 화면의 항목이 차등화되어 있는지 확인한다(목록은 최소, 상세는 필요 시).

    4. 권한별 계정이 있으면 사용자 승인 하에 권한별 화면 항목 차이를 비교한다.'
  pass: 화면마다 용도에 필요한 항목만 표시되고, 목록·상세·권한별로 차등화되어 있다.
  fail: '다음 중 하나라도 해당하면 취약이다.

    - 용도와 무관한 개인정보 항목이 일괄 표시된다.

    - 목록 화면에 고유식별정보·카드·계좌번호 전체가 평문으로 나온다.

    - 주의(추가 확인 필요): 용도 판단이 애매하면 "주의"로 기록하고 업무 담당자 확인을 요청한다.'
  remediation: '

    - 화면별 "용도-출력항목" 매핑표를 작성해 내부 관리계획이나 지침에 반영한다.

    - 목록에서 고유식별정보, 카드·계좌번호, 상세주소를 제거하거나 마스킹한다.

    - 상세 조회는 권한·사유 기반으로 "마스킹 해제" 기능을 둔다. 해제 행위는 접속기록에 남긴다.

    - 근거: 안내서 p.106(차등 표시·마스킹 예시)'
  evidence: 화면 캡처(개인정보 값 전체 마스킹 필요), 화면별 항목 목록
  notes: 법령 의무는 용도 특정과 최소화이고, 마스킹은 수단 중 하나다(FAQ 10-2, 의무 아님). "최소" 판단에는 업무 맥락이 필요하므로, 명백한 과다 노출만 취약으로 하고 나머지는 주의로 둔다.
  category: 노출·출력
  strength: 의무
  default_risk: 중
- id: SAFE-12-01-02
  title: 마스킹 적용과 화면 간 일관성
  basis:
  - 고시 제12조제1항
  - 안내서 p.106(여러 시스템이 각기 다른 방식으로 마스킹하면 조합 위험이 있으므로 동일한 표시제한 필요)
  - FAQ 10-2(p.152)
  requirement: 마스킹으로 출력항목을 최소화할 때는 화면이나 시스템마다 마스킹 위치가 달라 조합으로 원본이 복원되지 않도록 일관된 기준을 수립·적용하는 것이 바람직하다.
  applies_when: 모든 개인정보처리자
  type: 관찰
  type_note: null
  location:
  - 같은 정보주체가 표시되는 여러 화면(관리자 목록·상세·주문·상담·엑셀 미리보기). 이용자 화면(마이페이지
  - 주문내역
  - 배송지 관리
  - 알림 문구).
  method: '

    1. 같은 항목(이름, 휴대전화, 이메일, 주소, 생년월일, 카드·계좌번호)의 마스킹 위치를 화면별로 비교한다.

    2. 예를 들어 A 화면 `010-****-1234`, B 화면 `010-1234-****`이면 조합으로 전체 번호가 나온다. 이런 사례를 기록한다.

    3. 화면에는 마스킹되어 있는데 DOM·응답에는 원본이 있는지는 SAFE-12-01-03에서 함께 본다.

    4. 증적에는 마스킹 패턴만 남긴다(예: `010-****-XXXX`).'
  pass: 항목별 마스킹 위치가 모든 화면에서 같다.
  fail: '화면 간 마스킹 위치가 달라 두 화면을 조합하면 원본이 복원된다.

    - 주의(추가 확인 필요): 일부 화면만 마스킹이 빠졌으면 "주의"로 기록한다.'
  remediation: '전사 공통 마스킹 규칙을 수립하고 서버 공통 함수로 일괄 적용한다(안내서 p.106). 아래 위치 예시는 이 안내서 범위 밖의 업계 관행 예시이고, 확정은 사용자가 결정한다.

    - 이름: 두 번째 글자 마스킹

    - 휴대전화: 가운데 자리 마스킹

    - 이메일: 아이디 일부 마스킹

    - 주민번호: 뒤 6자리 마스킹

    - 카드번호: 7~12번째 자리 마스킹

    - 계좌번호: 일부 자리 마스킹

    - 주소: 상세주소 마스킹'
  evidence: 화면별 마스킹 패턴 비교표, 캡처(원본 값 마스킹)
  notes: 안내서 표현은 "바람직" 또는 "필요"이고 마스킹 자체는 의무가 아니다. 일관성 미흡은 조합 복원이 실제로 가능할 때만 취약으로 한다. 구체 마스킹 위치는 이 안내서에 없다(메모 참조).
  category: 노출·출력
  strength: 의무
  default_risk: 중
- id: SAFE-12-01-03
  title: 웹페이지 소스·응답 본문·JS 변수·브라우저 저장소의 불필요한 개인정보 노출
  basis:
  - 고시 제12조제1항
  - 안내서 p.107("웹페이지 소스 보기 등을 통하여 불필요한 개인정보가 출력되지 않도록 조치")
  - 고시 제7조제2항(고유식별·카드·계좌, 참고)
  - 법 제24조의2
  requirement: 화면에 보이지 않더라도 페이지 소스, 숨김 필드, API 응답, JS 변수로 불필요한 개인정보가 출력되면 안 된다. 특히 주민등록번호 등 고유식별정보, 카드번호, 계좌번호가 평문 전체로 내려오면 안 된다.
  applies_when: 모든 개인정보처리자
  type: 관찰
  type_note: null
  location:
  - 전 화면. 특히 마이페이지
  - 회원정보 수정
  - 주문·결제 내역
  - 환불계좌
  - 관리자 회원 목록·상세
  - 검색 결과
  - 자동완성 API.
  method: '

    1. 페이지 소스와 DOM을 확인한다.

    - `document.querySelectorAll(''input[type=hidden]'')`의 name·value 패턴을 본다.

    - HTML 주석과 `data-*` 속성에 개인정보가 있는지 본다.

    2. 네트워크 응답(JSON)을 확인한다.

    - 화면 표시 항목보다 많은 필드가 내려오는지 본다(예: 목록 API에 주민번호, 생년월일, 전체 주소, 비밀번호 해시).

    - 화면은 마스킹인데 응답은 원본인지 본다.

    3. JS 전역 변수(`window.__INITIAL_STATE__`, `__NEXT_DATA__`, `__NUXT__` 등)를 확인한다.

    4. 브라우저 저장소(`localStorage`, `sessionStorage`)를 확인한다.

    5. 위 결과에 정규식을 적용한다.

    - 주민·외국인등록번호: `\b\d{6}-?[1-8]\d{6}\b`

    - 카드번호: `\b\d{4}[- ]?\d{4}[- ]?\d{4}[- ]?\d{3,4}\b`

    - 여권번호: `[A-Z]\d{8}` 또는 `[MSRODG]\d{3}[A-Z]\d{4}`

    - 운전면허번호: `\d{2}-?\d{2}-?\d{6}-?\d{2}`

    - 계좌번호: 숫자·하이픈 10~14자리, 필드명 `account`, `acctNo`, `bankAccount`

    - 결과는 건수와 필드명만 기록한다.

    6. 콘솔 로그(`console.log`)에 개인정보 객체가 출력되는지 확인한다.'
  pass: 응답·소스·저장소에 화면 용도에 필요한 항목만 있고, 마스킹 대상은 서버에서 마스킹된 값으로 내려온다. 고유식별정보, 카드·계좌번호 전체가 평문으로 나타나지 않는다.
  fail: '다음 중 하나라도 해당하면 취약이다.

    - 화면에 표시하지 않는 고유식별정보, 카드·계좌번호, 비밀번호(해시 포함)가 응답·숨김필드·JS 변수·저장소·콘솔에 평문으로 존재한다.

    - 화면은 마스킹하지만 응답은 원본이다(클라이언트 측 마스킹).

    - 주의(추가 확인 필요): 일반 개인정보(이름, 연락처 등)가 화면보다 과다하게 응답되면 "주의" 또는 "취약"으로 기록한다. 판단 기준은 메모를 참조한다.'
  remediation: '

    - 서버에서 화면용 DTO를 분리해 필요한 필드만 직렬화하고, 마스킹은 서버에서 한다.

    - 숨김필드에 개인정보를 두지 말고 식별 키만 둔다.

    - SSR 초기 상태에서 개인정보를 제거하고, 운영 빌드에서 `console.log`를 제거한다.

    - 고유식별정보와 카드·계좌번호는 표시가 필요할 때만 권한·사유 확인 후 별도 API로 제공한다.

    - 근거는 안내서 p.107(소스 보기 노출 금지)이고, 구현 방식은 점검자 권고다.'
  evidence: 해당 요청 URL, 필드명 목록, 정규식 일치 건수. 값은 반드시 마스킹한다. 원본 응답 전문은 보고서에 첨부하지 않는다.
  notes: '

    - 법령 의무(제12조제1항)를 안내서 주의사항으로 구체화한 항목이다.

    - 이용자 본인의 정보를 본인 화면에 표시하는 것은 출력 용도에 맞으면 허용된다. 그래도 고유식별정보 전체 평문 응답은 취약으로 본다(주민번호 처리 제한 취지, 법 제24조의2). 이 판단은 사용자 확인이 필요하다(메모 참조).

    - 다른 정보주체의 데이터가 응답에 섞여 나오면 접근통제(제5·6조) 결함일 수 있으므로 해당 항목과 연결한다. 이 경우에도 파라미터를 변조해 재현하지 않는다.'
  category: 노출·출력
  strength: 의무
  default_risk: 상
- id: SAFE-12-01-04
  title: 개인정보 검색 조건 제한(like 검색 제한, 일치검색)
  basis:
  - 고시 제12조제1항
  - 안내서 p.107(업무상 필요하지 않으면 like 검색 금지, equal 검색 또는 2개 이상 조건 사용)
  requirement: 개인정보 검색 시 불필요하거나 과도한 정보가 조회되지 않도록, 업무상 반드시 필요한 경우가 아니면 부분일치(like) 검색을 막는다. 대신 일치검색(equal)이나 2개 이상 검색조건을 쓴다.
  applies_when: 개인정보 검색 기능이 있는 개인정보처리시스템(주로 관리자 화면)
  type: 관찰
  type_note: 실제 검색 실행은 능동(승인).
  location:
  - 관리자 회원·고객 검색
  - 주문 검색
  - 상담 검색 화면
  method: '

    1. 검색 화면의 UI를 확인한다(관찰).

    - 필수 검색조건 수

    - 조건 없이 "전체 조회"가 가능한지

    - 이름 한 글자 입력 허용 여부(`minlength`, `required` 속성, 안내 문구)

    2. 화면 진입 시 조건 없이 전체 목록이 자동 조회되는지 본다(첫 화면 자동 조회).

    3. 실제 부분검색 시험(예: 성씨 한 글자 검색)은 다른 정보주체의 개인정보를 대량 조회하게 되므로 기본적으로 하지 않는다. 필요하면 사용자 승인 후 사용자가 직접 실행하고, 결과는 건수만 기록한다.'
  pass: 검색 시 2개 이상 조건이나 정확 일치가 요구되고, 전체·부분 검색이 업무상 필요한 권한자로 제한된다. 첫 화면에서 개인정보 목록이 자동 표시되지 않는다(또는 마스킹되어 표시된다).
  fail: '조건 없이 전체 회원 목록이 조회된다. 한 글자 부분검색으로 대량 개인정보가 평문으로 나온다.

    - 주의(추가 확인 필요): 업무 필요성이 입증되지 않은 like 검색만 있으면 "주의"로 기록한다.'
  remediation: '

    - 검색조건을 2개 이상 필수로 한다(예: 이름+휴대전화 뒤 4자리). 기본은 일치검색으로 한다.

    - 부분검색은 권한자에게만 허용하고, 검색 결과 건수에 상한을 둔다.

    - 첫 화면 자동 조회를 제거한다(안내서 p.107 예시).'
  evidence: 검색 화면 캡처(결과 값 마스킹), 폼 속성
  notes: 안내서 주의사항(권고 성격)이다. 법령 위반 판정은 과다 조회가 명백할 때만 한다.
  category: 노출·출력
  strength: 권고
  default_risk: 하
- id: SAFE-12-01-05
  title: 개인정보 다운로드(파일생성) 기능의 사유 입력·권한·항목 선택
  basis:
  - 고시 제12조제1항(파일생성 시 용도 특정·항목 최소화)
  - 고시 제8조제2항(다운로드 상황 점검)
  - 고시 제6조의2제1항제2호(다운로드 가능 취급자, 참고)
  - 고시 제17조제1항(공공시스템 사전승인·사후소명)
  - 안내서 p.94~95(다운로드 정의, 대량 다운로드 비정상 행위), p.106, p.130(사전승인 시 목적·필요성 기재)
  - 안내서 p.107(엑셀 숨겨진 필드 금지)
  requirement: '다운로드(파일생성)도 출력에 해당하므로 다음을 지켜야 한다.

    - 용도를 특정하고 항목을 최소화한다.

    - 다운로드 상황은 점검할 수 있어야 한다.

    - 엑셀 등에 개인정보가 숨겨진 필드로 저장되지 않아야 한다.

    - 공공시스템은 이상행위 기준에 해당하는 다운로드에 사전승인이나 사후소명 절차가 있어야 한다.'
  applies_when: 개인정보 다운로드 기능이 있는 모든 개인정보처리자. 사전승인·소명 의무는 공공시스템운영기관에 해당한다.
  type: 능동
  type_note: UI 관찰은 관찰.
  location:
  - 관리자 화면의 엑셀·CSV·PDF 내보내기
  - 대량 출력
  - 인쇄 기능
  method: '

    1. 관찰:

    - 다운로드 버튼의 노출 범위(어느 권한 계정에 보이는지)를 확인한다.

    - 버튼 주변 옵션을 확인한다: 항목 선택 체크박스, 마스킹 포함·해제 옵션, 건수 제한 안내.

    2. 능동(승인):

    - 사용자 승인 후 테스트 범위로 다운로드 버튼을 누르고 다음을 확인한다.

    - 사유 입력창이 뜨는지

    - 사유가 필수인지(빈 값 제출 시 차단되는지)

    - 사유가 미리 정한 선택지인지 자유입력인지

    - 승인 요청 절차가 있는지

    - 사유 입력 단계에서 취소할 수 있으면 실제 파일을 생성하지 않고 확인을 끝낸다.

    3. 파일을 생성한다면 사용자가 열어 숨김 시트·숨김 열·불필요 항목 포함 여부와 마스킹 여부를 확인해 알려준다. Claude는 파일 내용을 보지 않는다.

    4. 권한별 계정이 있으면 하위 권한 계정에서 다운로드 버튼이 숨겨지거나 비활성화되는지 비교한다.'
  pass: '

    - 다운로드가 필요한 권한자에게만 제공된다.

    - 용도(사유) 입력이나 선택이 필수다.

    - 필요한 항목만 선택하거나 마스킹해 내려받을 수 있다.

    - 숨김 필드가 없다.

    - 다운로드 이력이 접속기록에 남는다(서면 확인).'
  fail: '모든 관리자 계정이 사유나 항목 선택 없이 전체 항목을 평문으로 내려받을 수 있다. 내려받은 파일에 화면보다 많은 항목이나 숨김 필드가 있다.

    - 주의(추가 확인 필요):

    - 사유 입력이 없더라도 항목 최소화와 다운로드 점검이 서면으로 확인되면 "주의"로 기록한다(일반 개인정보처리자).

    - 공공시스템에서 사전승인·사후소명이 모두 없으면 취약이다.'
  remediation: '

    - 다운로드 클릭 시 사유 입력 모달을 띄운다. 예: 사유 선택(배송, 정산, 민원 등)과 상세사유 입력, 빈 값 제출 차단.

    - 다운로드 항목을 선택하게 하고 기본은 마스킹으로 한다.

    - 건수 상한과 대량 다운로드 시 상급자 승인을 둔다.

    - 파일 암호를 설정한다(SAFE-07-05-03).

    - 다운로드 이력을 별도로 기록해 정기 점검한다(제8조제2항).

    - 공공시스템은 사전승인 또는 사후소명 워크플로를 둔다(안내서 p.130, FAQ 14-3).

    - 사유 입력 화면은 안내서에 명시된 형태가 아니라 점검자 권고 구현 예시다.'
  evidence: 다운로드 버튼·옵션·사유 입력 화면 캡처, 권한별 비교 결과. 파일 내용은 캡처하지 않는다.
  notes: '

    - 일반 개인정보처리자에게 "다운로드 사유 입력"을 명시한 조문은 없다. 제12조제1항의 용도 특정을 구현하는 대표 수단이다.

    - 공공시스템은 제17조제1항과 안내서 p.130에 따라 사전승인(목적·필요성 기재) 또는 사후소명이 요구된다.

    - 다운로드를 실행하면 운영 접속기록에 남으므로 반드시 사전 승인을 받는다.'
  category: 노출·출력
  strength: 의무
  default_risk: 중
- id: SAFE-12-02-01
  title: 출력·복사물 안전관리
  basis:
  - 고시 제12조제2항
  - 안내서 p.107(출력·복사물 안전조치 예시, DRM·보안 USB·DLP)
  requirement: '개인정보가 포함된 종이 인쇄물과 외부 저장매체 복사물을 안전하게 관리하기 위해 출력·복사 기록 등 필요한 안전조치를 해야 한다. 안내서 예시는 다음과 같다.

    - 정책, 대장, 관리부서

    - 외부반출 통제

    - 인쇄자·인쇄일시 기록

    - 파기계획

    - 복합기 보안

    - 워터마크

    - DRM, DLP'
  applies_when: 모든 개인정보처리자
  type: 서면
  type_note: 인쇄 화면은 관찰 보조.
  location:
  - (관찰 보조) 관리자·이용자 인쇄 기능
  - 출력용 화면
  method: '

    - 서면 확인: 출력·복사물 관리 지침, 출력 기록(인쇄자·일시), DRM·DLP·보안 USB 적용 현황, 종이 파기 기록을 요청한다.

    - 관찰 보조: 인쇄용 화면이나 출력 미리보기 페이지에 워터마크와 출력자·일시 표시가 있는지 본다. 인쇄 버튼은 브라우저 인쇄 대화상자만 열고 실제 인쇄는 하지 않는다. 또는 `@media print` CSS를 조회한다.'
  pass: 지침과 기록이 있고 기술적 통제(DRM, 워터마크 등)를 적용한다.
  fail: 출력·복사물 관리 조치가 없다.
  remediation: '안내서 p.107 예시를 참고해 다음을 갖춘다.

    - 출력·복사물 관리 지침

    - 생산·관리 대장

    - 출력물 워터마크(출력자 ID, 일시)

    - DRM 또는 DLP'
  evidence: 서면 자료, 인쇄 화면 캡처(마스킹)
  notes: 법령 의무다. 구체 수단은 안내서 예시다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-13-01-01
  title: 파기 방법(완전파괴·소자·초기화·덮어쓰기)
  basis:
  - 고시 제13조제1항
  - 안내서 p.108~109(복원 불가능한 방법, 매체별 방법, 완전포맷·덮어쓰기 3회 이상 권고, 파기 기록 관리)
  requirement: '개인정보를 파기할 때는 다음 가운데 하나를 해야 한다.

    - 완전파괴(소각, 파쇄)

    - 전용 소자장비(디가우저)로 삭제

    - 복원되지 않도록 초기화나 덮어쓰기

    - 메모리 저장장치(SSD 등)는 완전파괴나 초기화·덮어쓰기를 적용한다.

    - 파기 시행과 결과 확인은 개인정보 보호책임자 책임하에 하고 기록·관리한다.'
  applies_when: 모든 개인정보처리자
  type: 서면
  type_note: null
  location: []
  method: 서면 확인으로 파기 절차서, 파기 관리대장, 매체 폐기 증명서(위탁 시), 파기 결과 확인 기록을 요청한다.
  pass: 매체별로 고시 방법으로 파기하고 기록을 관리한다.
  fail: 단순 삭제나 포맷 후 매체를 재사용·폐기하고 기록이 없다.
  remediation: '매체별 파기 방법을 규정하고 파기대장을 운영한다.

    - HDD: 디가우저 또는 파쇄

    - SSD: 파쇄 또는 암호화 후 키 폐기

    - 종이: 세절 또는 소각

    - 덮어쓰기 3회 이상은 안내서 권고다.'
  evidence: 서면 자료
  notes: 법령 의무다. "3회 이상"은 안내서 권고 수치다. 탈퇴 회원의 즉시 파기 여부 같은 파기 시점은 「개인정보 보호법」 제21조 담당 범위다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-13-02-01
  title: 일부 파기 시 조치
  basis:
  - 고시 제13조제2항제1·2호
  - 안내서 p.110(일부 파기 사례, 삭제 방법 예시, 복구 관련 모니터링, 서면 마스킹·절삭)
  requirement: '개인정보 일부만 파기할 때 제1항 방법이 어려우면 다음 조치를 한다.

    - 전자적 파일: 삭제 후 복구·재생되지 않도록 관리·감독한다.

    - 기록물, 인쇄물, 서면: 해당 부분을 마스킹하거나 구멍 뚫기 등으로 삭제한다.

    - 운영 DB에서 탈퇴 회원 삭제, 백업 매체의 특정 정보주체 삭제 등이 포함된다.'
  applies_when: 모든 개인정보처리자
  type: 서면
  type_note: null
  location: []
  method: 서면 확인으로 DB 일부 파기 절차(삭제 쿼리·배치), 백업본 처리 방법, 복구 활동 모니터링 기록을 요청한다.
  pass: 절차가 있고 백업까지 포함해 관리한다.
  fail: 운영 DB에서만 삭제하고 백업에는 그대로 남아 있는데 관리 방안이 없다.
  remediation: '

    - 파기 배치에 백업 처리 방안을 포함한다(파기 대상 제외 백업 등).

    - 복구 작업 승인과 모니터링 절차를 둔다(안내서 예시).'
  evidence: 서면 자료
  notes: 법령 의무다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-13-03-01
  title: 기술적 특성으로 파기가 곤란한 경우 익명처리
  basis:
  - 고시 제13조제3항
  - 법 제58조의2
  - 안내서 p.111(블록체인 오프체인 저장, 해시 등 익명정보만 온체인, 파기 시 솔트·키 삭제)
  requirement: 블록체인처럼 제1·2항 방법으로 파기하기 현저히 곤란하면 익명정보로 처리해 복원이 불가능하도록 해야 한다.
  applies_when: 블록체인 등 수정 불가 기술을 쓰는 개인정보처리자
  type: 서면
  type_note: null
  location: []
  method: 서면 확인으로 온체인·오프체인 데이터 설계서와 파기 시 솔트·키 삭제 절차를 요청한다.
  pass: 온체인에는 익명정보만 있고 오프체인은 파기할 수 있다.
  fail: 개인정보가 온체인에 평문이나 복원 가능한 형태로 기록된다.
  remediation: 개인정보를 오프체인으로 분리하고, 온체인에는 솔트를 적용한 해시만 기록하며, 파기 시 솔트·키를 삭제한다(안내서 예시).
  evidence: 서면 자료
  notes: 법령 의무다. 해당 기술을 쓰지 않으면 "해당없음"이다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-14-01-01
  title: 공공시스템 지정 여부 확인(제3장 적용 판단)
  basis:
  - 고시 제14조제1항제1~3호, 제2항
  - 영 제30조의2제1항
  - 안내서 p.112~115(유형 정의, 지정 제외 예시)
  - FAQ 11-1·11-2·11-3(p.153)
  requirement: '다음 시스템 가운데 보호위원회가 지정한 공공시스템을 운영하는 공공기관은 제2장 외에 제3장 조치를 해야 한다.

    - 단일접속 시스템: 100만명 이상, 취급자 200명 이상, 민감정보 중 하나

    - 표준배포 시스템: 대국민 행정·민원용

    - 개별 시스템: 100만명 이상, 취급자 200명 이상, 주민등록정보시스템 연계, 총사업비 100억원 이상 중 하나

    지정은 보호위원회가 하고 홈페이지(pipc.go.kr)에 공지한다. 지정 제외 사유는 다음과 같다.

    - 체계적 검색 곤란(PDF·이미지 내 텍스트)

    - 내부 업무용(ERP 등)

    - 유출 가능성 낮음

    위반하면 3,000만원 이하 과태료(법 제75조제2항제5호)이고, 유출 시 과징금 대상이 될 수 있다.'
  applies_when: 공공기관
  type: 서면
  type_note: null
  location: []
  method: 서면 확인으로 보호위원회 지정 공문이나 공지 목록에 해당 시스템이 있는지 사용자(기관)에게 확인한다.
  pass: (판정용) 지정 여부가 명확하다.
  fail: (판정용) 지정 여부가 명확하지 않다.
  remediation: 해당하면 SAFE-15~18 항목을 적용하고, 지정 여부를 기관 내부 관리계획에 명시한다.
  evidence: 지정 공문·공지 사본
  notes: '

    - 판정 항목이 아니라 적용범위 결정 항목이다. 지정되지 않았으면 SAFE-15~18은 "해당없음"이다.

    - 제외 시스템도 추가 조치는 권장 사항이다(안내서 p.115).

    - 이용기관(공공시스템에 접속하는 기관)은 SAFE-16-05-01과 SAFE-17-02-01의 이용기관 측 이행이 해당한다.'
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-15-00-01
  title: 공공시스템별 내부 관리계획 수립·시행
  basis:
  - 고시 제15조제1~5호
  - 영 제30조의2제1항제1호, 제3~5항
  - 안내서 p.116~121(별지·유형별 수립 가능, 관리책임자 연 1회 이행실태 점검, 협의회 연 1회 이상 개최, 취급자 역할 예시)
  - FAQ 12-1~12-4(p.156)
  requirement: '공공시스템별로 다음 사항을 포함한 내부 관리계획을 수립·시행해야 한다.

    1. 관리책임자(시스템 총괄부서의 장) 지정

    2. 관리책임자의 역할과 책임

    3. 개인정보취급자의 역할과 책임

    4. 제4조제1항제4~6호, 제8호(취급자 관리·교육, 접근권한, 접근통제, 접속기록)

    5. 제16조~제18조 사항

    기관 내부 관리계획의 별지나 유형별 묶음으로 수립할 수 있다. 관리책임자는 연 1회 이상 이행실태를 점검한다. 공공시스템운영협의회는 연 1회 이상 개최한다(안내서). 전담부서나 인력을 둔다(영).'
  applies_when: 공공시스템운영기관
  type: 서면
  type_note: null
  location: []
  method: 서면 확인으로 공공시스템별 내부 관리계획(또는 별지), 관리책임자 지정 문서, 협의회 구성·회의록, 이행실태 점검 결과를 요청한다.
  pass: 1~5호가 모두 포함되고, 지정·점검·협의회가 이행된다.
  fail: 시스템별 계획이 없거나 항목이 누락되었다. 관리책임자가 지정되지 않았다.
  remediation: '

    - 기관 내부 관리계획에 공공시스템별 별지를 추가한다(FAQ 12-2).

    - 관리책임자 지정 공문을 내고 역할을 규정한다. 안내서 p.118 예시는 다음과 같다.

    - 협의회 참석

    - 사후통지

    - 연 1회 점검

    - 반기 권한 점검

    - 이용기관 교육

    - 이용기관 월 1회 접속기록 점검 관리

    - 협의회를 설치하고 연 1회 이상 개최한다.'
  evidence: 서면 자료
  notes: '

    - 법령 의무다. 현행 고시 제15조제5호는 "제16조부터 제18조까지"이고, 그 가운데 제18조 부분은 2027.1.1. 시행이다(고시 부칙).

    - 안내서(p.116)는 "제16조 및 제17조"로 적혀 있어 구 고시 기준이다.

    - 협의회 연 1회와 이용기관 월 1회 점검은 안내서(강화계획) 기준이다.'
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-16-01-01
  title: 공공시스템 접근 권한과 인사정보 연계
  basis:
  - 고시 제16조제1항
  - 영 제30조의2제1항제2호
  - 안내서 p.122~124(e인사·표준지방인사·정부디렉토리 연계, 퇴직·휴직·징계·부서이동 시 자동 말소, 팀 내 업무 변경은 관리책임자가 현행화)
  - FAQ 13-1·13-2·13-4·13-5·13-7·13-11·13-12(p.157~160)
  requirement: 공공시스템 접근 권한을 부여·변경·말소할 때는 인사정보와 연계해야 한다. 원칙은 자동 연계이고, 소속부서까지 연계하면 된다. 자동 연계가 곤란하면 인사 변동 시 지체 없이 변경하는 절차를 둔다. DB 접근통제 솔루션의 권한도 연계 대상이다.
  applies_when: 공공시스템운영기관
  type: 서면
  type_note: null
  location: []
  method: 서면 확인으로 인사정보 연계 구성도, 연계 대상 인사시스템, 자동 말소 처리 로그, 최근 인사이동자의 권한 변경 내역을 요청한다.
  pass: 인사 변동이 지체 없이 자동으로 반영되고 말소된다.
  fail: 연계가 없고 수동 절차도 없다. 퇴직자나 전보자 계정이 남아 있다.
  remediation: '

    - e인사, 표준지방인사, 정부디렉토리와 연계한다.

    - 연계가 곤란하면 인사발령 시 권한 변경 매뉴얼을 운영한다(안내서 p.124 예시).

    - DB 접근통제 솔루션도 연계한다(FAQ 13-11).'
  evidence: 서면 자료
  notes: 법령 의무다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-16-02-01
  title: 인사정보 미등록자 계정 발급 제한
  basis:
  - 고시 제16조제2항
  - 고시 제5조제3항·제4항
  - '안내서 p.124~125(불가피한 사유 예시: 위탁 공공기관, 유지보수 업체, 수탁 단체 직원'
  - 최소 범위, 3년 보관, 목적 달성 시 지체 없이 말소)
  - FAQ 13-8(p.158)
  requirement: '인사정보에 등록되지 않은 자에게는 계정을 발급하면 안 된다. 긴급상황 등 불가피한 사유가 있으면 예외로 하되, 다음을 지킨다.

    - 사유를 권한 부여 내역에 포함한다.

    - 내역을 3년 보관한다.

    - 권한은 최소 범위로 부여한다.

    - 목적을 달성하면 즉시 말소한다.'
  applies_when: 공공시스템운영기관. 직접 발급하는 이용기관도 포함한다(제16조제5항).
  type: 서면
  type_note: null
  location: []
  method: 서면 확인으로 미등록자 계정 목록, 발급 사유 기록, 말소 내역을 요청한다.
  pass: 모든 미등록자 계정에 사유 기록이 있고 기한 관리가 된다.
  fail: 사유 기록이 없거나 목적 달성 후에도 계정이 유지된다.
  remediation: 미등록자 계정 발급 신청서에 사유와 기간을 필수로 넣고, 만료일 자동 잠금을 적용하고, 권한 내역을 3년 보관한다.
  evidence: 서면 자료
  notes: 법령 의무다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-16-03-01
  title: 계정 발급 시 개인정보 보호 교육·보안서약
  basis:
  - 고시 제16조제3항
  - 안내서 p.125~126(행동수칙 고지로 교육 대체 가능, 표준행동수칙 10개 항목, 비공무원 부서장의 신청서·서약서·교육실적 보관, 회원가입·가입승인 과정에서 팝업으로 확인·동의하는 온라인 방식 권장)
  - FAQ 13-6·13-9·13-10(p.158~159)
  requirement: 계정을 발급할 때 개인정보 보호 교육을 실시하고 보안서약을 받아야 한다. 행동수칙 고지로 교육을 대체할 수 있다. 민간인 사용자도 대상이다. 온라인(시스템 내 팝업 동의)이나 공문 방식 모두 가능하며, 공문 방식이면 증빙을 보관한다.
  applies_when: 공공시스템운영기관. 직접 발급하는 이용기관도 포함한다.
  type: 관찰
  type_note: 발급 이력은 서면.
  location:
  - 공공시스템의 사용자 계정 신청(회원가입) 화면
  - 가입승인 화면
  method: '

    - 관찰: 계정 신청 화면에 개인정보 보호 행동수칙이나 교육 내용 고지와 보안서약 동의 체크가 있는지 화면만 확인한다. 신청서는 제출하지 않는다.

    - 서면: 계정 발급 대장과 보안서약서 및 교육 이수 증빙을 대조한다.'
  pass: 모든 발급 계정에 교육(또는 행동수칙 고지)과 보안서약 증빙이 있다.
  fail: 서약이나 교육 없이 계정이 발급된다.
  remediation: '

    - 계정 신청 화면에 표준행동수칙 고지와 보안서약 동의 단계를 넣는다(안내서 권장 온라인 방식).

    - 서약 이력을 계정과 연결해 보관한다.'
  evidence: 신청 화면 캡처, 서면 자료
  notes: 법령 의무다. 행동수칙 대체와 온라인 방식은 안내서 해석·권장이다.
  category: 인증·접근통제
  strength: 의무
  default_risk: 중
- id: SAFE-16-04-01
  title: 접근 권한 내역 반기별 점검
  basis:
  - 고시 제16조제4항
  - 고시 제5조제3항
  - 안내서 p.126(단일접속·표준배포 개발·배포기관은 이용기관 현행화 점검, 중대 사안 보고)
  requirement: 정당한 권한자에게만 권한이 부여·관리되는지 확인하기 위해 접근 권한 부여·변경·말소 내역을 반기별 1회 이상 점검해야 한다.
  applies_when: 공공시스템운영기관. 직접 발급하는 이용기관도 포함한다.
  type: 서면
  type_note: null
  location: []
  method: 서면 확인으로 최근 2개 반기의 권한 점검 결과 보고서와 조치 내역을 요청한다.
  pass: 반기마다 점검하고 조치한 기록이 있다.
  fail: 점검 주기가 반기를 넘거나 기록이 없다.
  remediation: 반기 점검 계획을 내부 관리계획에 명시하고, 점검 결과 보고와 부적정 권한 회수 절차를 둔다.
  evidence: 서면 자료
  notes: 법령 의무다. "반기 1회"는 고시 수치다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-16-05-01
  title: 공공시스템이용기관의 직접 권한관리 시 조치
  basis:
  - 고시 제16조제5항
  - 안내서 p.124(수탁 단체 직원 지도·점검), p.127
  requirement: 공공시스템이용기관이 소관 취급자의 계정 발급 등 권한관리를 직접 하면 제16조제2~4항 조치(미등록자 제한, 교육·서약, 반기 점검)를 해야 한다.
  applies_when: 공공시스템이용기관 가운데 권한을 직접 관리하는 기관
  type: 서면
  type_note: null
  location: []
  method: 서면 확인으로 이용기관의 계정 발급 대장, 서약·교육 증빙, 반기 점검 기록을 요청한다.
  pass: 2~4항 조치를 모두 이행한다.
  fail: 하나라도 미이행이다.
  remediation: 이용기관용 권한관리 지침을 배포하고, 운영기관이 이행 실태를 점검한다.
  evidence: 서면 자료
  notes: 법령 의무다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-17-01-01
  title: 접속기록 자동화 분석·이상행위 탐지·소명
  basis:
  - 고시 제17조제1항
  - 영 제30조의2제1항제3호, 제2항(권한 없는 접근 확인 시 정보주체 통지)
  - 안내서 p.128~131(접속기록 검색 메뉴, 5개 항목 누락 사례, 이상행위 기준 예시, 사전승인·사후소명, 오남용 시 고발·징계)
  - FAQ 13-3(p.157), 14-1~14-3(p.161)
  requirement: '공공시스템 접속기록을 자동화된 방식으로 분석해 불법 유출과 오·남용 시도를 탐지하고 사유를 소명하게 해야 한다. 이상행위 기준 예시는 다음과 같다.

    - 공휴일·업무시간 외 열람·다운로드

    - 직전 3개월 평균을 초과하는 열람·다운로드

    - 월별 다운로드 상위자

    - 월별 다수 IP 사용자

    사후소명 대신 사전승인도 가능하다. 자동점검이 구현되기 전에는 수시로 점검한다. 공무원과 비공무원 모두 대상이다. 권한 없는 접근이 확인되면 정보주체에게 통지한다(영).'
  applies_when: 공공시스템운영기관
  type: 서면
  type_note: 기능 존재는 관찰 보조.
  location:
  - (관찰 보조) 공공시스템 관리자 화면의 접속기록·이상행위·소명 메뉴
  method: '

    - 서면 확인: 이상행위 탐지 기준서, 탐지·알림 내역, 소명·승인 처리 기록, 통지 사례를 요청한다.

    - 관찰 보조: 관리자 메뉴에 이상행위 탐지 결과, 소명 요청·처리, 사전승인 신청 메뉴가 있는지와 검색 조건을 화면으로 확인한다. 개인정보 값은 마스킹하고 처리 버튼은 누르지 않는다.'
  pass: 자동 탐지 기준이 설정·운영되고 소명이나 승인 절차가 이행된다.
  fail: 자동 분석이 없고 수시 점검 기록도 없다. 탐지 후 소명 절차가 없다.
  remediation: '

    - 안내서 p.130 예시 기준으로 이상행위 룰을 설정하고 알림 기능을 구현한다(직접 개발 또는 솔루션, FAQ 14-2).

    - 사전승인 또는 사후소명 워크플로를 둔다. 사후소명은 기준 해당 건을 모아 부서장이 정기 검토한다(FAQ 14-3).

    - 오·남용 확인 시 징계·고발 절차를 둔다.'
  evidence: 메뉴 캡처(마스킹), 서면 자료
  notes: 법령 의무다. 이상행위 기준 수치는 안내서 예시다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-17-02-01
  title: 이용기관용 접속기록 점검 기능 제공
  basis:
  - 고시 제17조제2항
  - 안내서 p.131(이용기관이 접속기록을 확인·분석할 수 있는 기능)
  - 안내서 p.118(이용기관 월 1회 이상 점검 관리)
  - FAQ 11-4 표(p.153~154)
  requirement: 공공시스템운영기관은 이용기관이 소관 취급자의 접속기록을 직접 점검할 수 있는 기능을 제공해야 한다.
  applies_when: 공공시스템운영기관. 이용기관은 그 기능으로 점검을 이행한다.
  type: 관찰
  type_note: 운영 실적은 서면.
  location:
  - 공공시스템 관리자(이용기관 관리자 권한) 화면의 접속기록 조회 메뉴
  method: '

    - 관찰: 사용자 승인 하에 이용기관 관리자 계정으로 로그인한다(입력은 사용자). 접속기록 조회 메뉴에서 다음을 화면으로 확인한다.

    - 소관 취급자 범위로 조회되는지

    - 검색 조건(기간, 사용자, 수행업무)이 있는지

    - 5개 항목 컬럼이 표시되는지

    - 다른 기관 기록이 섞여 보이지 않는지(보이는 것만 기록하고 파라미터는 변조하지 않는다)

    - 서면: 이용기관의 월 점검 기록을 요청한다.'
  pass: 이용기관이 소관 기록만 검색·분석할 수 있는 메뉴가 제공되고 실제로 활용된다.
  fail: 기능이 없거나 운영기관에 요청해야만 기록을 받을 수 있다.
  remediation: 이용기관별로 범위가 제한된 접속기록 조회·통계·이상행위 화면을 구현하고, 월 1회 점검 결과 등록 기능을 둔다. 월 1회는 안내서 기준이다.
  evidence: 메뉴 화면 캡처(개인정보·식별자 마스킹)
  notes: 법령 의무다.
  category: 인증·접근통제
  strength: 의무
  default_risk: 중
- id: SAFE-18-01-01
  title: 공공시스템 취약점 점검 연 1회 이상
  basis:
  - 고시 제18조제1항
  - 고시 제4조제1항제10호(내부 관리계획의 취약점 점검 사항)
  - 고시 부칙(2027.1.1. 시행)
  - '참고: 안내서 부록 위험도 분석 25번(p.184, 웹 취약점 연 1회 이상 진단, 긴급 취약점 추가 점검)'
  requirement: 공공시스템운영기관은 내부 관리계획에서 정한 취약점 점검을 공공시스템별로 연 1회 이상 실시해야 한다.
  applies_when: 공공시스템운영기관. 2027.1.1.부터 시행한다.
  type: 서면
  type_note: null
  location: []
  method: 서면 확인으로 내부 관리계획의 취약점 점검 조항, 시스템별 연간 점검 계획, 최근 점검 결과 보고서를 요청한다.
  pass: 시스템마다 연 1회 이상 점검하고 결과 보고서가 있다.
  fail: 점검하지 않은 시스템이 있거나 주기가 연 1회를 넘는다.
  remediation: 내부 관리계획에 점검 범위(웹·서버·DB·네트워크)와 주기를 명시하고, 시스템별 연간 점검 일정을 수립한다. 긴급 취약점이 나오면 수시 점검한다(안내서 p.184 예시 준용).
  evidence: 서면 자료
  notes: '

    - 법령 의무지만 시행 전(점검일 2026-10-27 기준)이다. 시행 전에는 "참고(시행 예정)"로 보고한다.

    - 안내서(2025.11)에는 이 조의 해설이 없다.

    - 이 점검 도구의 웹 관찰 결과는 취약점 점검을 대신하지 않는다.'
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-18-02-01
  title: 외부 전문기관·전문가 침투테스트 연 1회 이상
  basis:
  - 고시 제18조제2항
  - 고시 부칙(2027.1.1. 시행)
  requirement: 제1항의 취약점 점검과 별도로, 외부 전문기관이나 외부 전문가의 침투테스트를 공공시스템별로 연 1회 이상 실시해야 한다.
  applies_when: 공공시스템운영기관. 2027.1.1.부터 시행한다.
  type: 서면
  type_note: null
  location: []
  method: 서면 확인으로 침투테스트 계약서(외부 수행 주체 확인), 범위, 결과 보고서를 요청한다.
  pass: 외부 주체가 시스템마다 연 1회 이상 침투테스트를 한다.
  fail: 미실시, 내부 인력만으로 수행, 일부 시스템 누락
  remediation: 외부 전문기관 침투테스트를 연간 계약하고, 범위에 대국민 서비스·관리자·API를 포함한다.
  evidence: 서면 자료
  notes: '

    - 법령 의무이며 시행 예정이다. 안내서 해설은 없다.

    - "외부 전문기관·전문가"의 자격 기준은 고시에 없다. 메모 참조.'
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
- id: SAFE-18-03-01
  title: 점검 결과 보완조치
  basis:
  - 고시 제18조제3항
  - 고시 부칙(2027.1.1. 시행)
  requirement: 취약점 점검과 침투테스트 결과에 따라 필요한 보완조치를 지체 없이 시행해야 한다.
  applies_when: 공공시스템운영기관. 2027.1.1.부터 시행한다.
  type: 서면
  type_note: null
  location: []
  method: 서면 확인으로 발견 취약점별 조치 계획과 조치 완료 증적, 이행 점검 결과를 요청한다.
  pass: 모든 발견 사항에 조치 또는 위험수용 결재가 있고 지체되지 않았다.
  fail: 미조치 취약점이 방치되어 있다.
  remediation: 취약점별 조치 기한(위험도별)과 이행 점검 절차를 두고, 결과를 관리책임자에게 보고한다.
  evidence: 서면 자료
  notes: 법령 의무이며 시행 예정이다.
  category: 관리체계(서면)
  strength: 의무
  default_risk: 하
